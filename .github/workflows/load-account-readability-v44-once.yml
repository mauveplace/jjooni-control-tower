name: Load Account Readability V44 Once

on:
  push:
    branches: [main]
    paths: ['.github/workflows/load-account-readability-v44-once.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Wire V44 readability module
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p=Path('trade-review-loader.js')
          t=p.read_text()
          if "account-card-readability-v44.js" not in t:
              old="['ctTabletStabilityV37Script','tablet-stability-v37.js?v=37.6','tablet-stability']"
              new=old+",['ctAccountCardReadabilityV44Script','account-card-readability-v44.js?v=44.0','account-card-readability']"
              if t.count(old)!=1:
                  raise SystemExit('V44_LOADER_ANCHOR_MISMATCH')
              t=t.replace(old,new,1)
          t=t.replace("version:'14.24'","version:'14.25'",1)
          p.write_text(t)
          PY
      - name: Regression acceptance
        shell: bash
        run: |
          set -euo pipefail
          node --check account-card-readability-v44.js
          node --check trade-review-loader.js
          node --test tests/*.test.cjs
          grep -q "account-card-readability-v44.js?v=44.0" trade-review-loader.js
          grep -q "font-size:18px!important" account-card-readability-v44.js
          grep -q "font-size:22px!important" account-card-readability-v44.js
          echo ACCOUNT_READABILITY_V44=PASS
      - name: Commit loader patch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add trade-review-loader.js
          git diff --cached --check
          git commit -m 'fix: load 18px account readability module'
          git push
