name: Cleanup Account Readability V45 Once

on:
  push:
    branches: [main]
    paths: ['.github/workflows/cleanup-account-readability-v45-once.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore pre-readability layering baseline
        shell: bash
        run: |
          set -euo pipefail
          BASE=166179373749b0a70d87ca8ea057cdaa416b8b91
          git checkout "$BASE" -- \
            tablet-runtime-v8.js \
            tablet-accounts-v8.js \
            tablet-stability-v37.js \
            trade-review-loader.js \
            tests/tablet-stability-v37.test.cjs
          rm -f account-card-readability-v44.js

      - name: Make tablet stability the single account-card typography owner
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          p=Path('tablet-stability-v37.js')
          t=p.read_text()
          t=t.replace("version:'37.5'","version:'37.7'",1)
          anchor="""html.ctStableTabletV37 :is(.ctWlBtn,.ctTrChip,.ctD8Btn){font-size:16px!important;min-height:44px!important;padding:9px 12px!important}\n\n"""
          block="""html.ctStableTabletV37 :is(.ctWlBtn,.ctTrChip,.ctD8Btn){font-size:16px!important;min-height:44px!important;padding:9px 12px!important}\n\n/* Account-card typography authority: 18pt means 24 CSS px.\n   Keep this in tablet-stability only; do not add another readability sidecar. */\nhtml.ctStableTabletV37 #overviewAccounts.ctOvAccounts,\nhtml.ctStableTabletV37 .ctOvAccounts{grid-template-columns:repeat(2,minmax(0,1fr))!important;gap:16px!important}\nhtml.ctStableTabletV37 #overviewAccounts .ctAcct,\nhtml.ctStableTabletV37 .ctOvAccounts .ctAcct{padding:20px!important;min-height:260px!important;font-size:18pt!important;line-height:1.45!important}\nhtml.ctStableTabletV37 #overviewAccounts .ctAcct *,\nhtml.ctStableTabletV37 .ctOvAccounts .ctAcct *{font-size:18pt!important;line-height:1.45!important}\nhtml.ctStableTabletV37 #overviewAccounts .ctAcctName,\nhtml.ctStableTabletV37 .ctOvAccounts .ctAcctName{font-size:20pt!important;font-weight:900!important;line-height:1.3!important}\nhtml.ctStableTabletV37 #overviewAccounts .ctAcctNav,\nhtml.ctStableTabletV37 .ctOvAccounts .ctAcctNav{font-size:22pt!important;font-weight:900!important;line-height:1.2!important}\nhtml.ctStableTabletV37 #overviewAccounts .ctAcct :is(.gain,.loss),\nhtml.ctStableTabletV37 .ctOvAccounts .ctAcct :is(.gain,.loss){font-size:20pt!important;font-weight:900!important}\nhtml.ctStableTabletV37 #overviewAccounts .ctAcctIcon,\nhtml.ctStableTabletV37 .ctOvAccounts .ctAcctIcon{width:34px!important;height:34px!important;font-size:14pt!important}\nhtml.ctStableTabletV37 #overviewAccounts .ctAcctSpark svg text,\nhtml.ctStableTabletV37 .ctOvAccounts .ctAcctSpark svg text{font-size:18pt!important}\nhtml.ctStableTabletV37 #overviewAccounts .ctHumanAccountLineV6,\nhtml.ctStableTabletV37 .ctOvAccounts .ctHumanAccountLineV6{font-size:18pt!important;line-height:1.45!important;margin-top:10px!important;padding-top:10px!important}\n\n"""
          if anchor not in t:
              raise SystemExit('ACCOUNT_TYPOGRAPHY_ANCHOR_MISSING')
          t=t.replace(anchor,block,1)
          p.write_text(t)

          p=Path('trade-review-loader.js')
          t=p.read_text()
          t=t.replace("version:'14.23'","version:'14.26'",1)
          t=t.replace("tablet-stability-v37.js?v=37.0","tablet-stability-v37.js?v=37.7",1)
          p.write_text(t)

          p=Path('tests/tablet-stability-v37.test.cjs')
          t=p.read_text()
          t=t.replace(r"tablet-stability-v37\.js\?v=37\.0",r"tablet-stability-v37\.js\?v=37\.7",1)
          t += """\n\ntest('tablet overview account cards use one 18pt typography authority',()=>{\n  assert.match(guard,/Account-card typography authority/);\n  assert.match(guard,/grid-template-columns:repeat\\(2,minmax\\(0,1fr\\)\\)/);\n  assert.match(guard,/font-size:18pt!important/);\n  assert.match(guard,/font-size:20pt!important/);\n  assert.match(guard,/font-size:22pt!important/);\n  assert.doesNotMatch(loader,/account-card-readability-v44/);\n});\n"""
          p.write_text(t)
          PY

      - name: Regression acceptance
        shell: bash
        run: |
          set -euo pipefail
          node --check tablet-stability-v37.js
          node --check tablet-runtime-v8.js
          node --check tablet-accounts-v8.js
          node --check trade-review-loader.js
          node --test tests/*.test.cjs
          test ! -e account-card-readability-v44.js
          grep -q 'font-size:18pt!important' tablet-stability-v37.js
          grep -q 'grid-template-columns:repeat(2,minmax(0,1fr))' tablet-stability-v37.js
          ! grep -q 'account-card-readability-v44' trade-review-loader.js
          echo ACCOUNT_READABILITY_CONSOLIDATED=PASS

      - name: Commit consolidated UI
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A tablet-runtime-v8.js tablet-accounts-v8.js tablet-stability-v37.js trade-review-loader.js tests/tablet-stability-v37.test.cjs account-card-readability-v44.js
          git diff --cached --check
          git commit -m 'refactor(ui): consolidate tablet account typography'
          git push
