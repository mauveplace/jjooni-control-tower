name: Patch Readability Cost Trades Once
on:
  push:
    branches: [fix/readability-cost-trades-20260908]
    paths: ['.github/workflows/patch-readability-cost-trades-once.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/readability-cost-trades-20260908
      - name: Patch UI
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p=Path(path); s=p.read_text(encoding='utf-8')
              c=s.count(old)
              if c!=1: raise SystemExit(f'{path}: pattern count {c} != 1: {old[:120]}')
              p.write_text(s.replace(old,new,1),encoding='utf-8')

          # Tablet/wide trade review: human names beat ticker placeholders, denser cards, larger readable type.
          p=Path('tablet-runtime-v8.js'); s=p.read_text(encoding='utf-8')
          s=s.replace("window.__JJOONI_TABLET_RUNTIME_V8={state:'BOOTING',version:'8.0'};","window.__JJOONI_TABLET_RUNTIME_V8={state:'BOOTING',version:'8.3'};",1)
          old="const fxNow=()=>n(window.__JJOONI_FX_KRW_PER_USD)||n((((L().accounts||{}).AI)||{}).fx_krw_per_usd)||1;"
          new="const fxNow=()=>{const r=L().fx_reference||{};const x=n(r.krw_per_usd);return x&&x>500&&x<3000?x:null};"
          if old in s: s=s.replace(old,new,1)
          old=".ctD8Head{display:flex;justify-content:space-between;gap:16px;align-items:flex-end;margin:8px 0 12px}.ctD8Title{font-size:22px;font-weight:900}.ctD8Sub{font-size:11px;color:#667085;margin-top:3px}.ctD8Tools{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}.ctD8Btn{border:1px solid #d8e1ea;background:#fff;color:#475467;border-radius:999px;padding:7px 10px;font:800 10px/1 system-ui;cursor:pointer}.ctD8Btn.on{background:#0b2f5d;color:#fff;border-color:#0b2f5d}"
          new=".ctD8Head{display:flex;justify-content:space-between;gap:16px;align-items:flex-end;margin:6px 0 10px}.ctD8Title{font-size:23px;font-weight:900}.ctD8Sub{font-size:12px;color:#667085;margin-top:3px}.ctD8Tools{display:flex;gap:7px;flex-wrap:wrap;justify-content:flex-end}.ctD8Btn{border:1px solid #cbd5e1;background:#fff;color:#344054;border-radius:10px;padding:7px 11px;min-height:34px;font:850 11px/1 system-ui;cursor:pointer;box-shadow:0 1px 2px rgba(16,24,40,.04)}.ctD8Btn.on{background:#0b2f5d;color:#fff;border-color:#0b2f5d}"
          if old not in s: raise SystemExit('tablet head css missing')
          s=s.replace(old,new,1)
          old=".ctD8Kpis{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px;margin-bottom:12px}.ctD8Kpi{background:#fff;border:1px solid #e5eaf0;border-radius:12px;padding:10px 12px;min-width:0}.ctD8Kpi span{display:block;font-size:9px;color:#7d8b9d;font-weight:800}.ctD8Kpi b{display:block;margin-top:4px;font-size:16px;white-space:nowrap}.ctD8Kpi small{display:block;margin-top:3px;font-size:8px;color:#98a2b3}"
          new=".ctD8Kpis{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:7px;margin-bottom:9px}.ctD8Kpi{background:#fff;border:1px solid #e5eaf0;border-radius:11px;padding:9px 11px;min-width:0}.ctD8Kpi span{display:block;font-size:10px;color:#667085;font-weight:850}.ctD8Kpi b{display:block;margin-top:4px;font-size:17px;white-space:nowrap}.ctD8Kpi small{display:block;margin-top:3px;font-size:9px;color:#98a2b3}"
          if old not in s: raise SystemExit('tablet kpi css missing')
          s=s.replace(old,new,1)
          old=".ctD8Rows{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.ctD8Row{background:#fff;border:1px solid #e5eaf0;border-radius:12px;padding:10px 12px;min-width:0}.ctD8Top{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}.ctD8Name{font-size:12px;font-weight:900;min-width:0}.ctD8Meta{font-size:8px;color:#98a2b3;margin-top:2px}.ctD8Now{text-align:right;font-size:9px;color:#667085;white-space:nowrap}.ctD8Money{display:grid;grid-template-columns:1fr 1fr;gap:5px 10px;margin-top:8px;padding-top:7px;border-top:1px solid #eef2f6}.ctD8Money div{font-size:9px;color:#667085}.ctD8Money b{display:block;font-size:11px;margin-top:2px}.gain{color:#d92d20!important}.loss{color:#175cd3!important}.neutral{color:#667085!important}.ctD8Empty{padding:18px;border:1px dashed #d0d5dd;border-radius:12px;background:#fff;color:#667085;text-align:center}"
          new=".ctD8Rows{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:7px}.ctD8Row{background:#fff;border:1px solid #e1e7ef;border-radius:11px;padding:9px 10px;min-width:0}.ctD8Top{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}.ctD8Name{font-size:14px;line-height:1.25;font-weight:900;min-width:0}.ctD8Meta{font-size:10px;line-height:1.3;color:#7d8b9d;margin-top:2px}.ctD8Now{text-align:right;font-size:10px;line-height:1.25;color:#475467;white-space:nowrap}.ctD8Money{display:grid;grid-template-columns:1fr 1fr;gap:4px 8px;margin-top:7px;padding-top:6px;border-top:1px solid #eef2f6}.ctD8Money div{font-size:11px;line-height:1.25;color:#667085}.ctD8Money b{display:block;font-size:13px;line-height:1.2;margin-top:2px}.gain{color:#d92d20!important}.loss{color:#175cd3!important}.neutral{color:#667085!important}.ctD8Empty{padding:16px;border:1px dashed #d0d5dd;border-radius:11px;background:#fff;color:#667085;text-align:center}"
          if old not in s: raise SystemExit('tablet rows css missing')
          s=s.replace(old,new,1)
          s=s.replace("@media(min-width:768px) and (max-width:1050px){.ctD8Kpis{grid-template-columns:repeat(3,minmax(0,1fr))}.ctD8Rows{grid-template-columns:1fr}.ctP8Grid{grid-template-columns:repeat(2,minmax(0,1fr))}}","@media(min-width:768px) and (max-width:1050px){.ctD8Kpis{grid-template-columns:repeat(3,minmax(0,1fr))}.ctD8Rows{grid-template-columns:repeat(2,minmax(0,1fr))}.ctP8Grid{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(min-width:1051px) and (max-width:1250px){.ctD8Rows{grid-template-columns:repeat(2,minmax(0,1fr))}}",1)
          old="const ensure=(ticker,name)=>{const k=sym(ticker);if(!k)return null;if(!map.has(k))map.set(k,{ticker:k,name:name||k,accounts:new Set(),trades:0,buy:0,sell:0,lastTs:0,currency:'KRW',realized:0,realizedKnown:false,open:0,openKnown:false,missed:0,avoided:0,pending:0,pendingCount:0,current:null});return map.get(k)};"
          new="const ensure=(ticker,name)=>{const k=sym(ticker);if(!k)return null;const incoming=String(name||'').trim();if(!map.has(k))map.set(k,{ticker:k,name:(incoming&&sym(incoming)!==k?incoming:k),accounts:new Set(),trades:0,buy:0,sell:0,lastTs:0,currency:'KRW',realized:0,realizedKnown:false,open:0,openKnown:false,missed:0,avoided:0,pending:0,pendingCount:0,current:null});const x=map.get(k);const cur=String(x.name||'').trim();if(incoming&&incoming!==k&&sym(incoming)!==k&&(cur===k||sym(cur)===k||/\\.(KS|KQ)$/i.test(cur)))x.name=incoming;return x};"
          if old not in s: raise SystemExit('trade ensure missing')
          s=s.replace(old,new,1)
          p.write_text(s,encoding='utf-8')

          # COST V1 billing numbers were unverified/native-currency but labeled USD. Fail closed until V2 verifies currency.
          p=Path('cost-bridge.js'); s=p.read_text(encoding='utf-8')
          s=s.replace("const money=v=>n(v)==null?'—':'$'+n(v).toFixed(n(v)<10?2:1);","const moneyUsd=v=>n(v)==null?'—':'$'+n(v).toFixed(Math.abs(n(v))<10?2:1);\nconst moneyNative=(v,c)=>{const x=n(v),cc=String(c||'').toUpperCase();if(x==null)return '—';if(cc==='USD')return moneyUsd(x);if(cc==='KRW')return '₩'+Math.round(x).toLocaleString('ko-KR');return x.toLocaleString('en-US',{maximumFractionDigits:2})+(cc?' '+cc:'')};",1)
          s=s.replace("const estimate=(n(rt.estimated_usd_today)||0)+(n(ai.estimated_usd_today)||0);","const estimate=(n(rt.estimated_usd_today)||0)+(n(ai.estimated_usd_today)||0);\n const billingSafe=String(c.schema||'')==='AUTOBOT_COST_V2'&&bill.currency_verified===true&&!!String(bill.currency||'').trim();\n const billMoney=v=>billingSafe?moneyNative(v,bill.currency):'검증 대기';",1)
          s=s.replace("<div class=\"ctCostKpi\"><div class=\"ctCostLabel\">오늘 예상</div><div class=\"ctCostValue\">${money(estimate)}</div>","<div class=\"ctCostKpi\"><div class=\"ctCostLabel\">오늘 예상</div><div class=\"ctCostValue\">${moneyUsd(estimate)}</div>",1)
          s=s.replace("<div class=\"ctCostKpi\"><div class=\"ctCostLabel\">Google 실제</div><div class=\"ctCostValue\">${money(bill.actual_today_usd)}</div>","<div class=\"ctCostKpi\"><div class=\"ctCostLabel\">Google 실제</div><div class=\"ctCostValue\">${billMoney(bill.actual_today??bill.actual_today_usd)}</div>",1)
          s=s.replace("<div class=\"ctCostKpi\"><div class=\"ctCostLabel\">월 누적</div><div class=\"ctCostValue\">${money(bill.month_to_date_usd)}</div><div class=\"ctCostMini\">BigQuery actual</div></div>","<div class=\"ctCostKpi\"><div class=\"ctCostLabel\">월 누적</div><div class=\"ctCostValue\">${billMoney(bill.month_to_date??bill.month_to_date_usd)}</div><div class=\"ctCostMini\">${billingSafe?'BigQuery actual':'통화 원천 미검증 · 숫자 차단'}</div></div>",1)
          s=s.replace("<div class=\"ctCostKpi\"><div class=\"ctCostLabel\">월말 예상</div><div class=\"ctCostValue\">${money(fc.month_end_usd)}</div><div class=\"ctCostMini\">Budget ${money(fc.budget_usd)} · ${pct(fc.budget_pct)}</div><div class=\"ctCostBar\"><i style=\"width:${bar}%\"></i></div></div>","<div class=\"ctCostKpi\"><div class=\"ctCostLabel\">월말 예상</div><div class=\"ctCostValue\">${billingSafe?moneyNative(fc.month_end,bill.currency):'검증 대기'}</div><div class=\"ctCostMini\">${billingSafe&&fc.budget_comparable===true?'Budget '+moneyUsd(fc.budget_usd)+' · '+pct(fc.budget_pct):'예산 비교 차단 · 통화 검증 필요'}</div>${billingSafe&&fc.budget_comparable===true?`<div class=\"ctCostBar\"><i style=\"width:${bar}%\"></i></div>`:''}</div>",1)
          s=s.replace("${row('오늘 예상비용',money(rt.estimated_usd_today))}","${row('오늘 예상비용',moneyUsd(rt.estimated_usd_today))}",1)
          s=s.replace("${row('오늘 AI 비용',money(ai.estimated_usd_today))}","${row('오늘 AI 비용',moneyUsd(ai.estimated_usd_today))}",1)
          s=s.replace("${row('오늘 실제비용',money(bill.actual_today_usd))}${row('월 누적비용',money(bill.month_to_date_usd))}${row('Billing lag',ageText(bill.lag_minutes))}${row('Currency',bill.currency||'USD')}","${row('오늘 실제비용',billMoney(bill.actual_today??bill.actual_today_usd))}${row('월 누적비용',billMoney(bill.month_to_date??bill.month_to_date_usd))}${row('Billing lag',ageText(bill.lag_minutes))}${row('Currency',billingSafe?bill.currency:'UNVERIFIED')}",1)
          s=s.replace("${alerts.length?alerts.map(x=>`<div class=\"ctCostAlert\">${String(x)}</div>`).join(''):`<div class=\"ctCostOk\">비용 이상징후 없음</div>`}","${!billingSafe?`<div class=\"ctCostAlert\">Google Billing 통화/원천이 검증되지 않아 실제·월누적·월말예상 숫자를 차단했습니다.</div>`:alerts.length?alerts.map(x=>`<div class=\"ctCostAlert\">${String(x)}</div>`).join(''):`<div class=\"ctCostOk\">비용 이상징후 없음</div>`}",1)
          p.write_text(s,encoding='utf-8')

          # Cache-bust tablet runtime and loader.
          p=Path('trade-review-loader.js'); s=p.read_text(encoding='utf-8')
          s=s.replace("version:'14.15'","version:'14.17'",1)
          s=s.replace("tablet-runtime-v8.js?v=8.0","tablet-runtime-v8.js?v=8.3",1)
          p.write_text(s,encoding='utf-8')
          p=Path('index.html'); s=p.read_text(encoding='utf-8')
          s=s.replace('trade-review-loader.js?v=14.15','trade-review-loader.js?v=14.17',1)
          p.write_text(s,encoding='utf-8')

          # Static assertions.
          t=Path('tablet-runtime-v8.js').read_text(encoding='utf-8')
          assert "version:'8.3'" in t and 'repeat(3,minmax(0,1fr))' in t and 'incoming&&incoming!==k' in t
          c=Path('cost-bridge.js').read_text(encoding='utf-8')
          assert "billingSafe" in c and "'검증 대기'" in c and 'moneyUsd' in c
          PY
          node --check tablet-runtime-v8.js
          node --check cost-bridge.js
          node --check trade-review-loader.js
          git config user.name 'jjooni-automation'
          git config user.email 'actions@users.noreply.github.com'
          git add tablet-runtime-v8.js cost-bridge.js trade-review-loader.js index.html
          git commit -m 'fix: improve trade readability and fail closed on unverified billing currency'
          git push origin HEAD:fix/readability-cost-trades-20260908
