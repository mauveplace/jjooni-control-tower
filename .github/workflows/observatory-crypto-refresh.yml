name: Observatory BTC ETH Quote Refresh

on:
  pull_request:
    paths:
      - tools/add_observatory_equities.py
      - tests/test_observatory_crypto.py
      - .github/workflows/observatory-crypto-refresh.yml
  push:
    branches: [main]
    paths:
      - tools/refresh_observatory_crypto.py
      - tools/add_observatory_equities.py
      - .github/workflows/observatory-crypto-refresh.yml
  workflow_dispatch:
  # Independent best-effort heartbeat: the Daily workflow's 15-minute
  # schedule has been dropped for hours despite successful downstream runs.
  # Stagger away from :00 and Daily's :07/:22/:37/:52 slots.
  # This does not guarantee 60-minute quote freshness: GitHub schedules
  # can be delayed/dropped. Runtime quote timestamps remain authoritative.
  schedule:
    - cron: '12,42 * * * *'

permissions:
  contents: write

concurrency:
  group: observatory-crypto-quote-writer
  cancel-in-progress: false

jobs:
  provider_probe:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate BTC ETH source timestamps and fallback contracts
        run: python -m unittest discover -s tests -p 'test_observatory_crypto.py' -v
      - name: Verify actual CoinGecko USD spot and provider timestamps
        run: |
          python - <<'PY'
          import sys
          sys.path.insert(0, 'tools')
          from add_observatory_equities import coingecko_spot_observations
          observations = coingecko_spot_observations()
          assert set(observations) == {'BTCUSD', 'ETHUSD'}, 'COINGECKO_LIVE_PROBE_INCOMPLETE'
          for key, (rows, snapshot) in observations.items():
              assert snapshot['status'] == 'LIVE', (key, snapshot)
              assert rows[-1]['value'] == snapshot['price'], key
              print('COINGECKO_LIVE_PROBE=PASS', key, snapshot['quote_as_of_kst'])
          PY

  crypto:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate crypto time basis and source failure retention
        run: python -m unittest discover -s tests -p 'test_observatory_crypto.py' -v
      - name: Collect and validate actual BTC ETH quotes
        run: python tools/refresh_observatory_crypto.py
      - name: Publish crypto observations with concurrent quote merge
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          python tools/publish_observatory_data.py --message 'data(observatory): refresh BTC ETH spot quotes' market-observatory/data/observatory.json
