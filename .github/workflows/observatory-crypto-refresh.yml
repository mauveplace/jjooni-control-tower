name: Observatory BTC ETH Quote Refresh

on:
  push:
    branches: [main]
    paths:
      - tools/refresh_observatory_crypto.py
      - tools/add_observatory_equities.py
      - .github/workflows/observatory-crypto-refresh.yml
  workflow_dispatch:
  # Independent best-effort heartbeat: the Daily workflow's 15-minute
  # schedule has been dropped for hours despite successful downstream runs.
  # Stagger away from :00 and Daily's :07/:22/:37/:52 slots.
  # This does not guarantee 60-minute quote freshness: GitHub schedules
  # can be delayed/dropped. Runtime quote timestamps remain authoritative.
  schedule:
    - cron: '12,42 * * * *'

permissions:
  contents: write

concurrency:
  group: observatory-crypto-quote-writer
  cancel-in-progress: false

jobs:
  crypto:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate crypto time basis and source failure retention
        run: python -m unittest discover -s tests -p 'test_observatory_crypto.py' -v
      - name: Collect and validate actual BTC ETH quotes
        run: python tools/refresh_observatory_crypto.py
      - name: Publish crypto observations with concurrent quote merge
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          python tools/publish_observatory_data.py --message 'data(observatory): refresh BTC ETH spot quotes' market-observatory/data/observatory.json
