name: Observatory BTC ETH Quote Refresh

on:
  pull_request:
    paths:
      - tools/add_observatory_equities.py
      - tests/test_observatory_crypto.py
      - tests/test_observatory_binance_basis.py
      - tools/refresh_observatory_crypto.py
      - tools/probe_observatory_runtime.py
      - tests/test_observatory_runtime_probe.py
      - .github/workflows/observatory-crypto-refresh.yml
  push:
    branches: [main]
    paths:
      - tools/probe_observatory_runtime.py
      - tools/refresh_observatory_crypto.py
      - tools/add_observatory_equities.py
      - .github/workflows/observatory-crypto-refresh.yml
  workflow_dispatch:
  # Independent best-effort heartbeat: the Daily workflow's 15-minute
  # schedule has been dropped for hours despite successful downstream runs.
  # Stagger away from :00 and Daily's :07/:22/:37/:52 slots.
  # This does not guarantee 60-minute quote freshness: GitHub schedules
  # can be delayed/dropped. Runtime quote timestamps remain authoritative.
  schedule:
    - cron: '12,42 * * * *'

permissions:
  contents: write

concurrency:
  group: observatory-crypto-quote-writer
  cancel-in-progress: false

jobs:
  provider_probe:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate BTC ETH source timestamps and fallback contracts
        run: |
          python -m unittest discover -s tests -p 'test_observatory_crypto.py' -v
          python -m unittest discover -s tests -p 'test_observatory_binance_basis.py' -v
          python -m unittest discover -s tests -p 'test_observatory_runtime_probe.py' -v
      - name: Verify Binance market-data endpoint and timestamped BTC ETH quotes
        run: |
          python - <<'PY'
          import sys
          sys.path.insert(0, 'tools')
          from add_observatory_equities import binance_spot_observations
          observations = binance_spot_observations()
          assert set(observations) == {'BTCUSD', 'ETHUSD'}, 'BINANCE_LIVE_PROBE_INCOMPLETE'
          for key, (rows, snapshot) in observations.items():
              assert snapshot['status'] == 'LIVE', (key, snapshot)
              assert snapshot['quote_currency'] == 'USDT', key
              assert rows[-1]['value'] == snapshot['price'], key
              print('BINANCE_LIVE_PROBE=PASS', key, snapshot['quote_as_of_kst'])
          PY

  crypto:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate crypto time basis and source failure retention
        run: |
          python -m unittest discover -s tests -p 'test_observatory_crypto.py' -v
          python -m unittest discover -s tests -p 'test_observatory_binance_basis.py' -v
          python -m unittest discover -s tests -p 'test_observatory_runtime_probe.py' -v
      - name: Collect and validate actual BTC ETH quotes
        id: collect
        continue-on-error: true
        run: python tools/refresh_observatory_crypto.py
      # The 30-second card must not be older than the crypto snapshot when
      # they share a release. One producer builds both from the same local
      # observation and the publisher commits both in a single source update.
      # A broken unrelated TRI-POD/card must not prevent crypto collection.
      - name: Rebuild Daily Glance using just-collected crypto observations
        id: glance
        continue-on-error: true
        run: python tools/build_daily_glance.py
      - name: Publish crypto and matching card in one atomic commit
        env:
          GLANCE_OUTCOME: ${{ steps.glance.outcome }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          files=(market-observatory/data/observatory.json)
          if [ "$GLANCE_OUTCOME" = success ]; then
            files+=(market-observatory/data/daily-glance.json)
          else
            echo "::warning title=Daily Glance unavailable::Crypto is published independently; Daily Glance rebuild failed."
          fi
          python tools/publish_observatory_data.py --message 'data(observatory): refresh BTC ETH and same-snapshot glance' "${files[@]}"
      # Deployment visibility is monitored, not a collection failure. With many
      # data writers pushing to main, GitHub Pages builds are queued/superseded
      # and routinely exceed the probe's 150s budget even though the quotes were
      # committed. A red run (and email) must mean "BTC/ETH were not collected".
      - name: Verify public API and actual deployed Pages observations (advisory)
        id: runtime_probe
        continue-on-error: true
        run: python tools/probe_observatory_runtime.py
      - name: Report deployment lag as a warning
        if: steps.runtime_probe.outcome == 'failure'
        run: echo "::warning title=Pages deployment lag::BTC/ETH quotes were committed; the deployed Pages copy or quotes API did not confirm them within the probe budget."
      - name: Require both symbols healthy after publishing isolated results
        if: always()
        env:
          COLLECTION_OUTCOME: ${{ steps.collect.outcome }}
        run: |
          test "$COLLECTION_OUTCOME" = success
