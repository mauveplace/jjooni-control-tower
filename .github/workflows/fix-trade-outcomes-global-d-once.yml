name: Fix Trade Outcomes Global D Once

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/fix-trade-outcomes-global-d-once.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Repair D.human.trades access and bump module version
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          p=Path('trade-review-outcomes-v26.js')
          s=p.read_text(encoding='utf-8')
          old="""function collectTrades(){
           const out=[];
           try{if(window.D?.human&&Array.isArray(D.human.trades))out.push(...D.human.trades)}catch(_){}
           try{if(window.D?.ai?.latest&&Array.isArray(D.ai.latest.trades))out.push(...D.ai.latest.trades.map(x=>({...x,account:x.account||'AI'})))}catch(_){}
"""
          new="""function collectTrades(){
           const out=[];
           let d=null;
           try{d=(typeof D!=='undefined'&&D)?D:window.D}catch(_){d=window.D||null}
           try{if(d?.human&&Array.isArray(d.human.trades))out.push(...d.human.trades)}catch(_){}
           try{if(d?.ai?.latest&&Array.isArray(d.ai.latest.trades))out.push(...d.ai.latest.trades.map(x=>({...x,account:x.account||'AI'})))}catch(_){}
"""
          # Source is intentionally compact; normalize leading single-space differences.
          if "let d=null;" not in s:
              target="function collectTrades(){\n const out=[];\n try{if(window.D?.human&&Array.isArray(D.human.trades))out.push(...D.human.trades)}catch(_){}\n try{if(window.D?.ai?.latest&&Array.isArray(D.ai.latest.trades))out.push(...D.ai.latest.trades.map(x=>({...x,account:x.account||'AI'})))}catch(_){}\n"
              replacement="function collectTrades(){\n const out=[];\n let d=null;\n try{d=(typeof D!=='undefined'&&D)?D:window.D}catch(_){d=window.D||null}\n try{if(d?.human&&Array.isArray(d.human.trades))out.push(...d.human.trades)}catch(_){}\n try{if(d?.ai?.latest&&Array.isArray(d.ai.latest.trades))out.push(...d.ai.latest.trades.map(x=>({...x,account:x.account||'AI'})))}catch(_){}\n"
              if target not in s:
                  raise SystemExit('TRADE_OUTCOMES_COLLECT_TARGET_MISSING')
              s=s.replace(target,replacement,1)
          s=s.replace("version:'26.0'","version:'26.1'",1)
          p.write_text(s,encoding='utf-8')

          q=Path('trade-review-loader.js')
          t=q.read_text(encoding='utf-8')
          t=t.replace("trade-review-outcomes-v26.js?v=26.0","trade-review-outcomes-v26.js?v=26.1",1)
          q.write_text(t,encoding='utf-8')
          print('CT_TRADE_OUTCOMES_GLOBAL_D_FIX=PASS')
          PY
          if git diff --quiet -- trade-review-outcomes-v26.js trade-review-loader.js; then
            echo 'CT_TRADE_OUTCOMES_GLOBAL_D_FIX=NO_CHANGE'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add trade-review-outcomes-v26.js trade-review-loader.js
          git commit -m 'fix(ct-ui): read lexical D in trade outcomes v26.1'
          git push origin HEAD:main
