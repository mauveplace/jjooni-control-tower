name: ROY Fork Commit and PR Probe

# Manual only; never runs on PRs, pushes, reviews, or schedules.
on:
  workflow_dispatch:
    inputs:
      operation:
        description: Execute one explicitly selected isolated diagnostic
        required: true
        type: choice
        options:
          - verify_only
          - fork_commit
          - upstream_pr
        default: verify_only

permissions:
  contents: read

concurrency:
  group: roy-fork-commit-pr-probe
  cancel-in-progress: false

jobs:
  prove-bot-isolation:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Verify bot and run selected diagnostic only
        shell: bash
        env:
          ROY_FORK_TOKEN: ${{ secrets.ROY_FORK_TOKEN }}
          PROBE_OPERATION: ${{ inputs.operation }}
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF" == 'refs/heads/main' ]] || {
            echo '::error::Only the trusted upstream main workflow is permitted'
            exit 1
          }
          [[ "$GITHUB_ACTOR" == 'mauveplace' ]] || {
            echo '::error::Only the owner may dispatch a credential diagnostic'
            exit 1
          }
          [[ -n "${ROY_FORK_TOKEN:-}" ]] || {
            echo '::error::ROY_FORK_TOKEN secret missing'
            exit 1
          }
          case "$PROBE_OPERATION" in
            verify_only|fork_commit|upstream_pr) ;;
            *) echo '::error::Invalid operation'; exit 1 ;;
          esac
          # Fixed targets. No checkout or execution of fork/PR-supplied code.
          fork_api='https://api.github.com/repos/mauvenation-crypto/roy-bot-jjooni'
          upstream_api='https://api.github.com/repos/mauveplace/jjooni-control-tower'
          branch='roy/auth-probe-20261109'
          path='ai-collab/roy-probes/20261109-fork-commit-proof.md'
          response_file="$(mktemp)"
          trap 'rm -f "$response_file"' EXIT
          api() {
            curl --fail-with-body --silent --show-error --max-time 30 \
              -H 'Accept: application/vnd.github+json' \
              -H 'X-GitHub-Api-Version: 2022-11-28' \
              -H "Authorization: Bearer ${ROY_FORK_TOKEN}" "$@"
          }
          status_api() {
            curl --silent --show-error --max-time 30 \
              -o "$response_file" -w '%{http_code}' \
              -H 'Accept: application/vnd.github+json' \
              -H 'X-GitHub-Api-Version: 2022-11-28' \
              -H "Authorization: Bearer ${ROY_FORK_TOKEN}" "$@"
          }
          bot="$(api https://api.github.com/user)"
          [[ "$(jq -r '.login' <<< "$bot")" == mauvenation-crypto ]] &&
          [[ "$(jq -r '.id' <<< "$bot")" == 354357400 ]] || {
            echo '::error::Wrong authenticated GitHub account'
            exit 1
          }
          fork="$(api "$fork_api")"
          upstream="$(api "$upstream_api")"
          [[ "$(jq -r '.fork' <<< "$fork")" == true ]] &&
          [[ "$(jq -r '.parent.full_name' <<< "$fork")" == mauveplace/jjooni-control-tower ]] &&
          [[ "$(jq -r '.permissions.push' <<< "$fork")" == true ]] &&
          [[ "$(jq -r '.permissions.push' <<< "$upstream")" != true ]] || {
            echo '::error::Unexpected fork or upstream write permissions'
            exit 1
          }
          echo 'ROY_AUTH_SCOPE=PASS bot=mauvenation-crypto fork_write=true upstream_write=false'
          [[ "$PROBE_OPERATION" != verify_only ]] || exit 0
          ref="$(api "$fork_api/git/ref/heads/$branch")"
          [[ "$(jq -r '.ref' <<< "$ref")" == "refs/heads/$branch" ]] || {
            echo '::error::Fork test branch missing'
            exit 1
          }

          if [[ "$PROBE_OPERATION" == fork_commit ]]; then
            code="$(status_api "$fork_api/contents/$path?ref=$branch")"
            case "$code" in
              200) echo 'ROY_FORK_COMMIT=ALREADY_EXISTS (no mutation)'; exit 0 ;;
              404) ;;
              *) echo "::error::Fork content preflight HTTP=$code"; exit 1 ;;
            esac
            proof='ROY-FORK-AUTH-PROBE\nOwner-authorized GitHub Actions fork-only write test.\nNo trading, customer data, production pipeline changes or secrets.\n'
            content="$(printf '%b' "$proof" | base64 -w0)"
            payload="$(jq -nc --arg message 'test(ai-collab): prove ROY fork-only file commit' \
              --arg content "$content" --arg branch "$branch" \
              '{message:$message,content:$content,branch:$branch}')"
            code="$(status_api -X PUT --data "$payload" "$fork_api/contents/$path")"
            [[ "$code" == 201 ]] || {
              echo "::error::Fork content commit failed HTTP=$code"
              exit 1
            }
            commit_sha="$(jq -r '.commit.sha' "$response_file")"
            [[ "$commit_sha" =~ ^[a-f0-9]{40}$ ]] || {
              echo '::error::Commit SHA missing'; exit 1
            }
            details="$(api "$fork_api/commits/$commit_sha")"
            [[ "$(jq -r '.committer.id' <<< "$details")" == 354357400 ]] || {
              echo '::error::Commit exists but bot committer identity not verified'
              exit 1
            }
            echo "ROY_FORK_COMMIT=PASS sha=$commit_sha path=$path"
            exit 0
          fi

          # upstream_pr: require the exact previously written file, no other diffs.
          code="$(status_api "$fork_api/contents/$path?ref=$branch")"
          [[ "$code" == 200 ]] || {
            echo '::error::Run fork_commit successfully first'
            exit 1
          }
          actual="$(jq -r '.content' "$response_file" | base64 -d)"
          expected='ROY-FORK-AUTH-PROBE\nOwner-authorized GitHub Actions fork-only write test.\nNo trading, customer data, production pipeline changes or secrets.\n'
          [[ "$actual" == "$(printf '%b' "$expected")" ]] || {
            echo '::error::Unexpected fork file content'; exit 1
          }
          compare="$(api "$fork_api/compare/main...$branch")"
          [[ "$(jq -r '.files | length' <<< "$compare")" == 1 ]] &&
          [[ "$(jq -r '.files[0].filename' <<< "$compare")" == "$path" ]] &&
          [[ "$(jq -r '.files[0].status' <<< "$compare")" == added ]] || {
            echo '::error::Unapproved files in fork branch'; exit 1
          }
          # GitHub Compare API has commits[], not head_commit.
          [[ "$(jq -r '.ahead_by' <<< "$compare")" == 1 ]] &&
          [[ "$(jq -r '.total_commits' <<< "$compare")" == 1 ]] || {
            echo '::error::Expected exactly one fork-only probe commit'; exit 1
          }
          sha="$(jq -r '.commits[-1].sha // empty' <<< "$compare")"
          [[ "$sha" =~ ^[a-f0-9]{40}$ ]] &&
          [[ "$sha" == "$(jq -r '.object.sha' <<< "$ref")" ]] || {
            echo '::error::Fork branch SHA changed during preflight'; exit 1
          }
          head="$(api "$fork_api/commits/$sha")"
          [[ "$(jq -r '.committer.id' <<< "$head")" == 354357400 ]] || {
            echo '::error::Fork branch head is not bot-committed'; exit 1
          }
          pr_body='Authentication test only. Bot fork commit, no production changes. DO NOT MERGE.'
          payload="$(jq -nc \
            --arg title '[ROY-PROBE] fork-authored PR - DO NOT MERGE' \
            --arg body "$pr_body" \
            --arg head 'mauvenation-crypto:roy/auth-probe-20261109' \
            --arg base 'main' \
            '{title:$title,body:$body,head:$head,base:$base,draft:true,maintainer_can_modify:false}')"
          code="$(status_api -X POST --data "$payload" "$upstream_api/pulls")"
          [[ "$code" == 201 ]] || {
            echo "::error::ROY_UPSTREAM_PR=BLOCKED HTTP=$code (no owner-token fallback)"
            exit 1
          }
          number="$(jq -r '.number' "$response_file")"
          [[ "$number" =~ ^[0-9]+$ ]] || {
            echo '::error::Missing PR number'; exit 1
          }
          pr="$(api "$upstream_api/pulls/$number")"
          [[ "$(jq -r '.user.id' <<< "$pr")" == 354357400 ]] &&
          [[ "$(jq -r '.head.repo.full_name' <<< "$pr")" == mauvenation-crypto/roy-bot-jjooni ]] &&
          [[ "$(jq -r '.base.repo.full_name' <<< "$pr")" == mauveplace/jjooni-control-tower ]] &&
          [[ "$(jq -r '.draft' <<< "$pr")" == true ]] || {
            echo '::error::PR created but author/draft/fork identity verification failed'
            exit 1
          }
          echo "ROY_UPSTREAM_PR=PASS number=$number author=mauvenation-crypto draft=true"
