name: Patch Verified Trade Security Names Once

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/bump-master-trade-loader-once.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Correct verified security identities and bump UI modules
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('trade-review-outcomes-v26.js')
          s=p.read_text(encoding='utf-8')
          marker="const ticker=t=>sym(t?.ticker||t?.symbol);\n"
          overrides="\n".join([
              "const VERIFIED_SECURITY_NAMES={",
              " 'IBBQ':'Invesco Nasdaq Biotechnology ETF',",
              " 'XLV':'State Street Health Care Select Sector SPDR ETF',",
              " 'KO':'The Coca-Cola Company',",
              " '066570':'LG전자',",
              " 'SPCX':'The SPAC and New Issue ETF',",
              " '491010':'TIGER 글로벌AI전력인프라액티브'",
              "};",
              "",
          ])
          if 'const VERIFIED_SECURITY_NAMES=' not in s:
              if marker not in s:
                  raise SystemExit('TICKER_MARKER_MISSING')
              s=s.replace(marker,marker+overrides,1)
          old=" const tk=ticker(t),raw=String(t?.name||t?.stock_name||t?.security_name||t?.display_name||'').trim();\n if(raw&&sym(raw)!==tk)return raw;"
          new=" const tk=ticker(t),raw=String(t?.name||t?.stock_name||t?.security_name||t?.display_name||'').trim();\n const verified=String(VERIFIED_SECURITY_NAMES[tk]||'').trim();\n if(verified)return verified;\n if(raw&&sym(raw)!==tk)return raw;"
          if old in s:
              s=s.replace(old,new,1)
          elif 'const verified=String(VERIFIED_SECURITY_NAMES[tk]' not in s:
              raise SystemExit('NAME_RESOLVER_TARGET_MISSING')
          s=s.replace("version:'26.2'","version:'26.3'",1)
          p.write_text(s,encoding='utf-8')
          q=Path('trade-review-loader.js')
          t=q.read_text(encoding='utf-8')
          t=t.replace("version:'14.21'","version:'14.22'",1)
          t=t.replace('trade-review-outcomes-v26.js?v=26.2','trade-review-outcomes-v26.js?v=26.3',1)
          q.write_text(t,encoding='utf-8')
          r=Path('index.html')
          u=r.read_text(encoding='utf-8')
          u=u.replace('trade-review-loader.js?v=14.21','trade-review-loader.js?v=14.22')
          r.write_text(u,encoding='utf-8')
          print('CT_VERIFIED_SECURITY_IDENTITY_PATCH=PASS')
          PY
          if git diff --quiet -- trade-review-outcomes-v26.js trade-review-loader.js index.html; then
            echo 'CT_VERIFIED_SECURITY_IDENTITY_PATCH=NO_CHANGE'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add trade-review-outcomes-v26.js trade-review-loader.js index.html
          git commit -m 'fix(ct-ui): verified security names v26.3'
          git push origin HEAD:main