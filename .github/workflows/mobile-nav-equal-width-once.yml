name: Fix Mobile Nav Equal Width Once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/mobile-nav-equal-width-once.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Lock mobile nav to five equal grid columns
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p=Path('trade-review-v2.js')
          s=p.read_text(encoding='utf-8')
          old="function ensureNav(){\n  const mm=ensureMoreMenu(),tabs=qs('.tabs');if(!tabs||!mm)return;\n  qsa('.tab[data-tab]').forEach(t=>{"
          new="function ensureNav(){\n  const mm=ensureMoreMenu(),tabs=qs('.tabs');if(!tabs||!mm)return;\n  if(window.innerWidth<=767){\n    tabs.style.setProperty('display','grid','important');\n    tabs.style.setProperty('grid-template-columns','repeat(5,minmax(0,1fr))','important');\n    tabs.style.setProperty('width','100%','important');\n    tabs.style.setProperty('max-width','100%','important');\n    tabs.style.setProperty('justify-content','stretch','important');\n    tabs.style.setProperty('align-items','stretch','important');\n  }else{\n    for(const k of ['display','grid-template-columns','width','max-width','justify-content','align-items'])tabs.style.removeProperty(k);\n  }\n  qsa('.tab[data-tab]').forEach(t=>{"
          if old in s:
              s=s.replace(old,new,1)
          elif "tabs.style.setProperty('grid-template-columns','repeat(5,minmax(0,1fr))','important')" not in s:
              raise SystemExit('ENSURE_NAV_PATTERN_NOT_FOUND')
          old="      if(CFG.primary.includes(id))t.style.setProperty('order',String(CFG.primary.indexOf(id)+1),'important');"
          new="      if(CFG.primary.includes(id)){t.style.setProperty('order',String(CFG.primary.indexOf(id)+1),'important');t.style.setProperty('width','100%','important');t.style.setProperty('min-width','0','important');t.style.setProperty('justify-self','stretch','important');}"
          if old in s:
              s=s.replace(old,new,1)
          elif "t.style.setProperty('justify-self','stretch','important')" not in s:
              raise SystemExit('PRIMARY_WIDTH_PATTERN_NOT_FOUND')
          old="if(window.innerWidth<=767){more.style.setProperty('display','flex','important');more.style.setProperty('order','5','important');more.textContent='더보기'}else{more.style.removeProperty('display');more.style.removeProperty('order')}"
          new="if(window.innerWidth<=767){more.style.setProperty('display','flex','important');more.style.setProperty('order','5','important');more.style.setProperty('width','100%','important');more.style.setProperty('min-width','0','important');more.style.setProperty('justify-self','stretch','important');more.textContent='더보기'}else{for(const k of ['display','order','width','min-width','justify-self'])more.style.removeProperty(k)}"
          if old in s:
              s=s.replace(old,new,1)
          elif "more.style.setProperty('justify-self','stretch','important')" not in s:
              raise SystemExit('MORE_WIDTH_PATTERN_NOT_FOUND')
          p.write_text(s,encoding='utf-8')
          assert "grid-template-columns','repeat(5,minmax(0,1fr))" in s
          assert "justify-self','stretch'" in s
          print('MOBILE_NAV_EQUAL_WIDTH_OK')
          PY
      - name: Commit patch and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/mobile-nav-equal-width-once.yml
          git add trade-review-v2.js
          git commit -m 'Lock mobile navigation to five equal-width slots'
          git push
