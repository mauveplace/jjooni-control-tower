name: Fix Control Tower Loader Script Escape

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/fix-loader-script-escape.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Repair premature script termination
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          old="html=html.replace('</body>','<script src=\"live-bridge.js?v=1\"></script></body>');"
          new="html=html.replace('</body>','<script src=\"live-bridge.js?v=1\"><\\/script></body>');"
          if old not in s:
              raise SystemExit('TARGET_NOT_FOUND')
          s=s.replace(old,new,1)
          p.write_text(s,encoding='utf-8')
          print('SCRIPT_ESCAPE_FIX=PASS')
          PY
      - name: Commit repaired loader
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Fix Control Tower loader script escaping'
          git push
