name: Earnings Calendar Contract
on:
  pull_request:
    paths: ['market-observatory/earnings-v1.js','market-observatory/data/earnings.json','tools/validate_earnings.py','tests/earnings*','tests/test_earnings_contract.py','.github/workflows/earnings-contract.yml']
  push:
    branches: [main]
    paths: ['market-observatory/data/earnings.json']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python tools/validate_earnings.py
      - run: python -m unittest discover -s tests -p test_earnings_contract.py
      - run: node --test tests/earnings.test.cjs
      - run: npm install --no-save --no-package-lock playwright@1.55.0
      - run: npx playwright install chromium --only-shell
      - run: node tests/earnings-ui-e2e.cjs
      - uses: actions/upload-artifact@v4
        with:
          name: earnings-mobile-preview
          path: /tmp/earnings-*.png
