name: Hotfix Five Account Browser Boot 20261009

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/hotfix-five-account-browser-boot-20261009.yml'

permissions:
  contents: write

jobs:
  hotfix:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply deterministic five-account browser patch
        run: |
          python3 ops/hotfix_five_account_browser_20261009.py
          python3 ops/cleanup_retired_account_runtime_v2_20261009.py

      - name: Validate active JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          files=(
            canonical-metrics.js live-bridge.js mobile-stability-v4.js trade-review-loader.js
            fast-refresh-v32.js market-state-bridge.js ui-refactor.js data-integrity-v4.js
            trade-review-v2.js trade-review-readable-v3.js decision-impact-v5.js realized-ledger-v7.js
            trade-money-v6.js trade-review-outcomes-v26.js account-source-truth-v22.js human-ui-v6.js
            tablet-runtime-v8.js tablet-accounts-v8.js recent-trade-metric-drilldown-v9.js
            fx-attribution-v16.js metric-drilldown-router-v12.js daily-performance-alias-v23.js
            runtime-integrity-v15.js account-integrity-v17.js source-authority-guard-v24.js
            position-completeness-v25.js
          )
          for f in "${files[@]}"; do node --check "$f"; done

      - name: Run focused five-account regression contracts
        shell: bash
        run: |
          set -euo pipefail
          node --test tests/canonical-contract.test.cjs
          node --test tests/browser-authoritative-total-nav-v45.test.cjs
          node --test tests/runtime-loader-contract.test.cjs
          node --test tests/overview-5nav-v45.test.cjs
          echo 'FIVE_ACCOUNT_BROWSER_BOOT=PASS'

      - name: Audit loaded runtime for retired account residues
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          files=[
            'canonical-metrics.js','live-bridge.js','mobile-stability-v4.js','trade-review-loader.js',
            'fast-refresh-v32.js','market-state-bridge.js','ui-refactor.js','data-integrity-v4.js',
            'trade-review-v2.js','trade-review-readable-v3.js','decision-impact-v5.js','realized-ledger-v7.js',
            'trade-money-v6.js','trade-review-outcomes-v26.js','account-source-truth-v22.js','human-ui-v6.js',
            'viewport-bottom-guard-v5.js','tablet-runtime-v8.js','tablet-accounts-v8.js','recent-trade-metric-drilldown-v9.js',
            'canonical-valuation-fix-v13.js','fx-attribution-v16.js','metric-drilldown-router-v12.js','daily-performance-alias-v23.js',
            'runtime-integrity-v15.js','account-integrity-v17.js','irp-trade-unit-guard-v18.js','drilldown-readability-v19.js',
            'market-context-v20.js','overview-consistency-v21.js','source-authority-guard-v24.js','position-completeness-v25.js',
            'tablet-stability-v37.js'
          ]
          pats={
            'visible retired label':re.compile(r'AI BOT|AI Bot',re.I),
            'retired account object':re.compile(r'(?:CANON\.)?accounts\.AI|(?:D|d)\.ai'),
            'six-account contract':re.compile(r'ACCOUNT_SUM_6|FAST_EFFECTIVE_SUM_6_ACCOUNT_NAV|SIX_NAV_SOURCES|6계좌'),
            'retired audit module':re.compile(r'autobot-audit-board-v1|ctAutobotAuditBoardV1Script',re.I),
          }
          bad=[]
          for f in files:
            text=Path(f).read_text(encoding='utf-8')
            for label,pat in pats.items():
              for m in pat.finditer(text):
                line=text.count('\n',0,m.start())+1
                bad.append(f'{f}:{line}: {label}: {m.group(0)}')
          if bad:
            print('\n'.join(bad[:200]))
            raise SystemExit(f'ACTIVE_RUNTIME_RETIRED_ACCOUNT_RESIDUE=FAIL count={len(bad)}')
          print('ACTIVE_RUNTIME_RETIRED_ACCOUNT_RESIDUE=PASS')
          PY

      - name: Commit browser hotfix
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import subprocess
          names=subprocess.check_output(['git','diff','--name-only'],text=True).splitlines()
          for name in names:
            p=Path(name)
            if not p.is_file(): continue
            try: text=p.read_text(encoding='utf-8')
            except UnicodeDecodeError: continue
            cleaned='\n'.join(line.rstrip() for line in text.splitlines()) + ('\n' if text.endswith('\n') else '')
            p.write_text(cleaned,encoding='utf-8')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -u
          git diff --cached --check
          git commit -m 'fix: restore five-account verified browser boot'
          git push origin HEAD:main
