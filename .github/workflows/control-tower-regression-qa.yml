name: Control Tower Regression QA

on:
  push:
    branches: [main]
    paths:
      - '*.js'
      - 'tests/*.test.cjs'
      - '.github/workflows/control-tower-regression-qa.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: control-tower-regression-qa
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Run Control Tower regression suite
        shell: bash
        run: |
          set -euo pipefail
          node --test tests/*.test.cjs
          echo CONTROL_TOWER_REGRESSION=PASS
