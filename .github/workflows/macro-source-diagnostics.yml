name: Macro Source Diagnostics
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [tools/probe_macro_sources.py]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install beautifulsoup4 pypdf
      - run: python -u tools/probe_macro_sources.py
