name: Research TRI-POD Bond Backtest

on:
  push:
    branches:
      - research/tripod-bond-backtest-261011
    paths:
      - 'research/tripod_bond_backtest_v2.py'
      - 'research/tripod_bond_actual_etf_check.py'
      - '.github/workflows/research-tripod-bond-backtest.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/tripod-bond-backtest-261011
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run full-history synthetic-duration backtest
        run: python research/tripod_bond_backtest_v2.py
      - name: Run actual IEF and TLT validation
        run: python research/tripod_bond_actual_etf_check.py
      - name: Commit reproducible output
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add research-output/tripod_bond_backtest_v2.json research-output/tripod_bond_backtest_v2.md research-output/tripod_bond_actual_etf_check.json research-output/tripod_bond_actual_etf_check.md
          if git diff --cached --quiet; then
            echo 'No output changes'
          else
            git commit -m 'research: validate TRI-POD cash sleeve with IEF TLT [skip ci]'
            git push origin HEAD:research/tripod-bond-backtest-261011
          fi
