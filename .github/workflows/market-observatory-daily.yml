name: Market Observatory Daily + Calendar

on:
  push:
    branches: [main]
    paths:
      - tools/build_market_observatory.py
      - tools/build_observatory_sector_etf.py
      - tools/build_fed_watch.py
      - tools/postprocess_market_observatory.py
      - tools/backfill_market_history_30y.py
      - tools/enrich_economic_calendar.py
      - tools/persist_calendar_history.py
      - tools/archive_calendar_actuals.py
      - tools/add_observatory_equities.py
      - market-observatory/index.html
      - market-observatory/observatory-v2.js
      - market-observatory/calendar-editor-v1.js
      - market-observatory/latest-board-v1.js
      - market-observatory/sector-etf-v1.js
      - market-observatory/fed-watch-v1.js
      - market-observatory/data/ai-read-contract.json
      - market-observatory/data/calendar-manual-overrides.json
      - .github/workflows/market-observatory-daily.yml
  schedule:
    # 07:25 KST: completed US session + latest official bond/calendar data.
    - cron: '25 22 * * *'
    # 08:05 KST: retry/safety refresh in case GitHub scheduled execution is delayed or skipped.
    - cron: '5 23 * * *'
    # 16:10 KST: Korea market close refresh for KOSPI/KOSDAQ and KR reference data.
    - cron: '10 7 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: market-observatory-daily
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Preserve previous calendar observations
        shell: bash
        run: |
          set -euo pipefail
          cp market-observatory/data/economic-calendar.json /tmp/economic-calendar-prev.json
          echo CALENDAR_PREVIOUS_SNAPSHOT=PASS
      - name: Build read-only market observatory data
        env:
          BOK_ECOS_API_KEY: ${{ secrets.BOK_ECOS_API_KEY || 'sample' }}
          TRADING_ECONOMICS_API_KEY: ${{ secrets.TRADING_ECONOMICS_API_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --quiet 'curl_cffi>=0.7,<1'
          python -m py_compile tools/build_market_observatory.py tools/build_observatory_sector_etf.py tools/build_fed_watch.py tools/postprocess_market_observatory.py tools/backfill_market_history_30y.py tools/enrich_economic_calendar.py tools/persist_calendar_history.py tools/archive_calendar_actuals.py tools/calendar_market_events.py tools/add_observatory_equities.py tests/test_market_observatory_completed_session.py tests/test_calendar_market_semantics.py tests/test_calendar_data_quality.py
          python tests/test_market_observatory_completed_session.py
          python tests/test_calendar_market_semantics.py
          python tools/build_market_observatory.py
          python tools/calendar_market_events.py seed
          python tools/postprocess_market_observatory.py
          python tools/backfill_market_history_30y.py
          python tools/enrich_economic_calendar.py
          python tools/persist_calendar_history.py /tmp/economic-calendar-prev.json
          python tools/build_fed_watch.py
          python tools/calendar_market_events.py refresh
          python tools/archive_calendar_actuals.py
          python tests/test_calendar_data_quality.py
          python tools/add_observatory_equities.py
          python tools/build_observatory_sector_etf.py
      - name: Install Observatory UI runtimes and optimize bootstrap
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p=Path('market-observatory/index.html')
          s=p.read_text(encoding='utf-8')
          zoom='<script src="https://cdn.jsdelivr.net/npm/hammerjs@2.0.8/hammer.min.js"></script><script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-zoom@2.2.0/dist/chartjs-plugin-zoom.min.js"></script>'
          if 'chartjs-plugin-zoom@2.2.0' not in s:s=s.replace('</head>',zoom+'</head>',1)
          bridge='<script src="./observatory-v2.js?v=2.6.0"></script>'
          if 'observatory-v2.js' not in s:s=s.replace('</body>',bridge+'</body>',1)
          editor='<script src="./calendar-editor-v1.js?v=1.1"></script>'
          if 'calendar-editor-v1.js' not in s:s=s.replace('</body>',editor+'</body>',1)
          board='<script src="./latest-board-v1.js?v=1.0"></script>'
          if 'latest-board-v1.js' not in s:s=s.replace('</body>',board+'</body>',1)
          sector='<script src="./sector-etf-v1.js?v=1.0"></script>'
          if 'sector-etf-v1.js' not in s:s=s.replace('</body>',sector+'</body>',1)
          fedwatch='<script src="./fed-watch-v1.js?v=1.0"></script>'
          if 'fed-watch-v1.js' not in s:s=s.replace('</body>',fedwatch+'</body>',1)
          s=s.replace('Macro · Rates · FX · Energy · Sector ETF · TRI-POD · Event Calendar','Macro · Rates · FedWatch · FX · Energy · Sector ETF · TRI-POD · Event Calendar')

          old="Promise.all([fetch('./data/observatory.json?'+Date.now(),{cache:'no-store'}).then(r=>r.json()),fetch('./data/economic-calendar.json?'+Date.now(),{cache:'no-store'}).then(r=>r.json())]).then(([d,c])=>{DATA=d;CAL=c;render();renderCalendar()}).catch(e=>{console.error(e);$('#pulse').innerHTML='<span class=\"chip\">데이터 로딩 대기</span>'});"
          new="const loadObsJson=u=>fetch(u,{cache:'no-cache'}).then(r=>{if(!r.ok)throw new Error(u+' '+r.status);return r.json()});let CAL_PROMISE=null;function loadCalendar(){if(CAL)return Promise.resolve(CAL);if(CAL_PROMISE)return CAL_PROMISE;CAL_PROMISE=loadObsJson('./data/economic-calendar.json').then(c=>{CAL=c;renderCalendar();return c}).finally(()=>{CAL_PROMISE=null});return CAL_PROMISE}loadObsJson('./data/observatory.json').then(d=>{DATA=d;render()}).catch(e=>{console.error(e);$('#pulse').innerHTML='<span class=\"chip\">데이터 로딩 대기</span>'});$('#tabs').addEventListener('click',e=>{const b=e.target.closest('button[data-tab]');if(b?.dataset.tab==='calendar')loadCalendar().catch(err=>console.error('calendar lazy load',err))});"
          if old in s:
              s=s.replace(old,new,1)
          elif "fetch('./data/observatory.json?'+Date.now(),{cache:'no-store'})" in s:
              raise SystemExit('OBSERVATORY_BOOTSTRAP_OPTIMIZER_PATTERN_MISMATCH')
          p.write_text(s,encoding='utf-8')
          print('OBSERVATORY_UI_RUNTIME=PASS')
          print('OBSERVATORY_BOOTSTRAP_CACHE_REVALIDATION=PASS')
          print('OBSERVATORY_CALENDAR_LAZY_LOAD=PASS')
          print('OBSERVATORY_FEDWATCH_RUNTIME=PASS')
          PY
      - name: Acceptance contract
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          o=json.load(open('market-observatory/data/observatory.json'))
          c=json.load(open('market-observatory/data/economic-calendar.json'))
          h=json.load(open('market-observatory/data/history-30y.json'))
          s=json.load(open('market-observatory/data/sector-etf.json'))
          f=json.load(open('market-observatory/data/fed-watch.json'))
          a=json.load(open('market-observatory/data/ai-read-contract.json'))
          assert o['schema']=='JJOONI_MARKET_OBSERVATORY_V1'
          assert o['read_only'] is True and o['contains_account_data'] is False
          assert o.get('history_target_years')==30
          assert o.get('history_contract')=='IMMUTABLE_30Y_BASE_PLUS_RECENT_INCREMENT'
          assert isinstance(o.get('series'),dict) and len(o['series'])>=10
          for k in ['KOSPI','KOSDAQ','NASDAQ100','SP500','VIX','USDKRW','WTI','BRENT','DXY','US2Y','US10Y_OFFICIAL','JP2Y','JP10Y']:
              assert len(o['series'].get(k) or [])>5,(k,len(o['series'].get(k) or []))
          for k in ['KOSPI','KOSDAQ','US_2S10S','JP_2S10S','KR10Y']:
              assert o.get('latest',{}).get(k) is not None,(k,o.get('latest',{}).get(k))
          us_dates={k:str((o['series'].get(k) or [{}])[-1].get('date',''))[:10] for k in ['NASDAQ100','SP500','VIX']}
          assert all(us_dates.values()),us_dates
          assert len(set(us_dates.values()))==1,us_dates
          assert o.get('us_market_session_contract')=='COMMON_LAST_COMPLETED_US_SESSION_V1'
          assert o.get('us_completed_session_date')==next(iter(set(us_dates.values())))
          assert o.get('equity_enrichment_contract')=='KOSPI_KOSDAQ_DAILY_REFERENCE_V1'
          assert c['schema']=='JJOONI_ECONOMIC_CALENDAR_V1'
          assert c['timezone']=='Asia/Seoul' and c.get('time_contract')=='ALL_TIMES_KST'
          assert str(c.get('enrichment_contract','')).startswith('OFFICIAL_SCHEDULE_PLUS_MARKET_CONSENSUS_ACTUAL')
          assert c.get('retention_contract')=='PERSIST_RELEASED_VALUES_ACROSS_ROLLING_FEEDS_V1'
          assert all(all(k in e for k in ['previous','consensus','actual','market_metrics']) for e in c.get('events',[]))
          assert h.get('schema')=='JJOONI_MARKET_HISTORY_30Y_V1' and h.get('target_years')==30
          assert s.get('schema')=='JJOONI_OBSERVATORY_SECTOR_ETF_V1'
          assert s.get('read_only') is True and s.get('contains_account_data') is False
          assert s.get('universe_version')=='SONG_SECTOR_UNIVERSE_V1'
          classic=next(g['rows'] for g in s.get('groups',[]) if g.get('key')=='classic')
          assert len(classic)==11
          assert s.get('quality',{}).get('classic_priced_count',0)>=9
          for ticker in ['XLK','XLC','XLY','XLF','XLI','XLE','XLB','XLV','XLP','XLU','XLRE','SMH','IGV','XBI','KRE']:
              assert ticker in s.get('series',{}),ticker
          assert f.get('schema')=='JJOONI_FED_WATCH_V1'
          assert f.get('read_only') is True and f.get('contains_account_data') is False
          assert f.get('meeting_date') and f.get('market_data_as_of')
          assert f.get('freshness') in ['LIVE','STALE']
          assert 0 <= float(f.get('hold_probability',0)) <= 1
          assert 0 <= float(f.get('hike_any_probability',0)) <= 1
          assert 0 <= float(f.get('cut_any_probability',0)) <= 1
          assert abs(sum(float(x.get('probability',0)) for x in f.get('outcomes',[]))-1.0) < 0.01
          from datetime import datetime
          from zoneinfo import ZoneInfo
          fomc_date=datetime.fromisoformat(f['meeting_date']+'T14:00:00').replace(tzinfo=ZoneInfo('America/New_York')).astimezone(ZoneInfo('Asia/Seoul')).date().isoformat()
          fomc=next(e for e in c.get('events',[]) if e.get('country')=='US' and e.get('title')=='FOMC 정책결정' and str(e.get('datetime_kst','')).startswith(fomc_date))
          metrics={m.get('key'):m for m in fomc.get('market_metrics',[])}
          rate=metrics.get('fed_rate') or {}
          fw=metrics.get('fedwatch_hike_25bp') or {}
          assert rate.get('previous') and rate.get('consensus') and rate.get('actual') is None,rate
          assert fw.get('previous') and fw.get('consensus') and fw.get('actual') is None,fw
          assert fw.get('metric_type')=='market_probability_snapshot' and fw.get('value_role')=='market_forecast',fw
          assert a.get('schema')=='JJOONI_MARKET_OBSERVATORY_AI_READ_CONTRACT_V1'
          assert any(x.get('path')=='./fed-watch.json' and x.get('required') for x in a.get('required_reads',[]))
          html=Path('market-observatory/index.html').read_text(encoding='utf-8')
          for token in ['chartjs-plugin-zoom@2.2.0','observatory-v2.js','calendar-editor-v1.js','latest-board-v1.js','sector-etf-v1.js','fed-watch-v1.js']:
              assert token in html,token
          assert "fetch('./data/observatory.json?'+Date.now(),{cache:'no-store'})" not in html
          assert "loadCalendar()" in html and "economic-calendar.json" in html
          sector=Path('market-observatory/sector-etf-v1.js').read_text(encoding='utf-8')
          for token in ['송팀장 Sector Observatory','RS vs SPY 1M','sector-etf.json','READY_LAZY']:
              assert token in sector,token
          board=Path('market-observatory/latest-board-v1.js').read_text(encoding='utf-8')
          for token in ['KOSPI','KOSDAQ','US10Y_OFFICIAL','KR10Y','WTI','latestBoardGenerated','refDate']:
              assert token in board,token
          fedjs=Path('market-observatory/fed-watch-v1.js').read_text(encoding='utf-8')
          for token in ['FOMC Market Pricing · FedWatch','fed-watch.json','hike_25bp_probability','change_1w_pctpt']:
              assert token in fedjs,token
          print('MARKET_OBSERVATORY_ACCEPTANCE=PASS')
          print('us_source_dates=',us_dates)
          print('fedwatch=',f['meeting_date'],f['market_data_as_of'],f['hike_any_probability'],f['freshness'])
          print('series=',len(o['series']),'KOSPI=',o['latest']['KOSPI'],'KOSDAQ=',o['latest']['KOSDAQ'],'calendar=',len(c['events']),'sector_classic=',len(classic),'sector_priced=',s['summary']['priced_count'])
          PY
      - name: Publish Observatory data and UI
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add market-observatory/data/observatory.json market-observatory/data/economic-calendar.json market-observatory/data/history-30y.json market-observatory/data/sector-etf.json market-observatory/data/fed-watch.json market-observatory/data/ai-read-contract.json market-observatory/data/calendar-manual-overrides.json market-observatory/index.html
          if git diff --cached --quiet; then
            echo MARKET_OBSERVATORY_NO_CHANGE
            exit 0
          fi
          git commit -m 'data(observatory): refresh latest market board calendar sectors and FedWatch'
          for attempt in 1 2 3; do
            git fetch origin main
            git rebase -X theirs origin/main
            if git push origin HEAD:main; then exit 0; fi
            echo "MARKET_OBSERVATORY_PUSH_RETRY=$attempt"
          done
          exit 1
