name: Market Observatory Daily + Calendar

on:
  push:
    branches: [main]
    paths:
      - tools/requirements-observatory.txt
      - tools/build_market_observatory.py
      - tools/tripod_rules.py
      - tools/observatory_session.py
      - tools/crypto_heartbeat_gate.py
      - tests/test_crypto_heartbeat_gate.py
      - tests/test_observatory_session.py
      - tools/publish_observatory_data.py
      - tools/build_observatory_sector_etf.py
      - tools/build_fed_watch.py
      - tools/postprocess_market_observatory.py
      - tools/backfill_market_history_30y.py
      - tools/add_observatory_equities.py
      - tests/test_observatory_crypto.py
      - market-observatory/index.html
      - market-observatory/observatory-v2.js
      - market-observatory/calendar-editor-v1.js
      - market-observatory/latest-board-v1.js
      - market-observatory/sector-etf-v1.js
      - market-observatory/fed-watch-v1.js
      - market-observatory/data/ai-read-contract.json
      - market-observatory/data/calendar-manual-overrides.json
      - .github/workflows/market-observatory-daily.yml
  workflow_run:
    # Opportunistic heartbeats from already-running workflows.
    # A failed calendar/optional source must still trigger the independent freshness check.
    # The gate below rebuilds only when the market snapshot itself is stale.
    workflows:
      - "pages build and deployment"
      - "Economic Calendar Light Refresh"
      - "Market Observatory Calendar Actual Capture"
      - "Market Observatory Verified Calendar"
      - "Public Market + TRI-POD Daily Sidecar"
      - "Market Observatory Official Macro"
    types: [completed]
  schedule:
    # Redundant hourly watchdog. GitHub scheduled runs can be delayed/dropped,
    # so check four off-peak minutes per hour and rebuild only when data is stale.
    - cron: '7,22,37,52 * * * *'
    # US regular-session close +20m, DST-safe candidate slots.
    # Sunday ET candidate refreshes the last completed US session for Monday KST.
    # 20:20 UTC = 05:20 KST while New York is on EDT; 21:20 UTC = 06:20 KST while on EST.
    # Sunday UTC candidate intentionally refreshes Monday KST using the last completed Friday US session.
    # us_close_gate permits execution after 16:20 so delayed scheduled runs still collect.
    - cron: '20 20,21 * * 0-5'
    # 16:10 KST: Korea market close refresh for KOSPI/KOSDAQ and KR reference data.
    - cron: '10 7 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  us_close_gate:
    if: ${{ github.event_name == 'schedule' && github.event.schedule == '20 20,21 * * 0-5' }}
    runs-on: ubuntu-latest
    outputs:
      should_run: ${{ steps.close.outputs.should_run }}
      ny_time: ${{ steps.close.outputs.ny_time }}
    steps:
      - id: close
        name: Gate US close refresh with scheduler delay tolerance
        shell: bash
        run: |
          set -euo pipefail
          ny_time="$(TZ=America/New_York date +%H%M)"
          echo "ny_time=$ny_time" >> "$GITHUB_OUTPUT"
          if [ "$ny_time" -ge "1620" ]; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
            echo "US_CLOSE_PLUS_20_GATE=PASS ny_time=$ny_time"
          else
            echo "should_run=false" >> "$GITHUB_OUTPUT"
            echo "US_CLOSE_PLUS_20_GATE=SKIP ny_time=$ny_time"
          fi

  hourly_gate:
    if: ${{ (github.event_name == 'schedule' && github.event.schedule == '7,22,37,52 * * * *') || (github.event_name == 'workflow_run' && (github.event.workflow_run.conclusion == 'success' || github.event.workflow_run.conclusion == 'failure')) }}
    runs-on: ubuntu-latest
    outputs:
      should_refresh: ${{ steps.fresh.outputs.should_refresh }}
      age_min: ${{ steps.fresh.outputs.age_min }}
      crypto_should_refresh: ${{ steps.fresh.outputs.crypto_should_refresh }}
    steps:
      - uses: actions/checkout@v4
      - id: fresh
        name: Check Observatory freshness
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          from datetime import datetime, timezone
          from pathlib import Path
          import sys
          sys.path.insert(0,'tools')
          from observatory_session import refresh_decision
          def load(path):
              try:return json.loads(Path(path).read_text(encoding='utf-8'))
              except Exception:return {}
          result=refresh_decision(load('market-observatory/data/observatory.json'),load('market-observatory/data/daily-market-pulse.json'),load('public-market-daily.json'))
          print(f"should_refresh={str(result['should_refresh']).lower()}")
          print(f"age_min={result['age_min']}")
          print(f"expected_session={result['expected_session']}")
          PY
          # Quote freshness is independent of the last completed US cash session.
          # Reuse this existing heartbeat: no new cron or Scheduler resource.
          python tools/crypto_heartbeat_gate.py >> "$GITHUB_OUTPUT"

  crypto_recovery:
    # Only recover stale quotes, and recheck after checkout to avoid racing
    # the standalone BTC/ETH collector. Same cross-workflow writer lock.
    needs: hourly_gate
    if: ${{ needs.hourly_gate.result == 'success' && needs.hourly_gate.outputs.crypto_should_refresh == 'true' }}
    concurrency:
      group: observatory-crypto-quote-writer
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - id: recheck
        name: Recheck latest quote timestamps after writer lock
        shell: bash
        run: python tools/crypto_heartbeat_gate.py >> "$GITHUB_OUTPUT"
      - name: Validate and collect only if still stale
        if: ${{ steps.recheck.outputs.crypto_should_refresh == 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest discover -s tests -p 'test_crypto_heartbeat_gate.py' -v
          python -m unittest discover -s tests -p 'test_observatory_crypto.py' -v
          python tools/refresh_observatory_crypto.py
      - name: Publish only freshly verified quotes
        if: ${{ steps.recheck.outputs.crypto_should_refresh == 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          python tools/publish_observatory_data.py --message 'data(observatory): recover stale BTC ETH spot quotes' market-observatory/data/observatory.json

  hourly_refresh:
    concurrency:
      group: economic-calendar-canonical-writer
      cancel-in-progress: false
    needs: hourly_gate
    if: ${{ needs.hourly_gate.result == 'success' && needs.hourly_gate.outputs.should_refresh == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install official document parser and run regression tests
        run: |
          python -m pip install -r tools/requirements-observatory.txt
          python -m unittest discover -s tests -p 'test*.py' -v
      - name: Build lightweight market snapshot
        env:
          BOK_ECOS_API_KEY: ${{ secrets.BOK_ECOS_API_KEY || 'sample' }}
        shell: bash
        run: |
          set -euo pipefail
          cp market-observatory/data/economic-calendar.json /tmp/economic-calendar.json
          python -m py_compile tools/build_market_observatory.py tools/postprocess_market_observatory.py tools/backfill_market_history_30y.py tools/add_observatory_equities.py
          python tools/build_market_observatory.py
          python tools/postprocess_market_observatory.py
          cp /tmp/economic-calendar.json market-observatory/data/economic-calendar.json
          python tools/backfill_market_history_30y.py
          python -m unittest discover -s tests -p 'test_observatory_crypto.py'
          python tools/add_observatory_equities.py
          python - <<'PY'
          import sys
          sys.path.insert(0,'tools')
          from publish_observatory_data import materialize_market_dependents, MARKET_BUNDLE
          materialize_market_dependents(MARKET_BUNDLE)
          PY
      - name: Hourly acceptance
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from datetime import datetime, timezone
          o=json.load(open('market-observatory/data/observatory.json'))
          import sys
          sys.path.insert(0,'tools')
          from observatory_session import require_current
          require_current(o,json.load(open('market-observatory/data/daily-market-pulse.json')),json.load(open('public-market-daily.json')))
          dt=datetime.fromisoformat(o['generated_kst'])
          age=(datetime.now(timezone.utc)-dt.astimezone(timezone.utc)).total_seconds()/60
          assert age < 10, age
          for k in ['KOSPI','KOSDAQ','NASDAQ100','SP500','VIX','USDKRW','WTI','US3M','US2Y','US10Y_OFFICIAL','US30Y_OFFICIAL']:
              assert len(o.get('series',{}).get(k) or []) > 5,(k,len(o.get('series',{}).get(k) or []))
          assert o.get('history_contract')=='IMMUTABLE_30Y_BASE_PLUS_RECENT_INCREMENT'
          print('OBSERVATORY_HOURLY_ACCEPTANCE=PASS generated_kst='+o['generated_kst'])
          PY
      - name: Publish hourly market snapshot
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          python tools/publish_observatory_data.py --message 'data(observatory): hourly market refresh' market-observatory/data/observatory.json market-observatory/data/daily-market-pulse.json public-market-daily.json

  build:
    concurrency:
      group: economic-calendar-canonical-writer
      cancel-in-progress: false
    needs: [us_close_gate]
    if: ${{ always() && github.event_name != 'workflow_run' && (github.event_name != 'schedule' || github.event.schedule != '7,22,37,52 * * * *') && (github.event_name != 'schedule' || github.event.schedule != '20 20,21 * * 0-5' || needs.us_close_gate.outputs.should_run == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Preserve previous calendar observations
        shell: bash
        run: |
          set -euo pipefail
          cp market-observatory/data/economic-calendar.json /tmp/economic-calendar-prev.json
          echo CALENDAR_PREVIOUS_SNAPSHOT=PASS
      - name: Build read-only market observatory data
        env:
          BOK_ECOS_API_KEY: ${{ secrets.BOK_ECOS_API_KEY || 'sample' }}
          TRADING_ECONOMICS_API_KEY: ${{ secrets.TRADING_ECONOMICS_API_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --quiet 'curl_cffi>=0.7,<1' -r tools/requirements-observatory.txt
          python -m unittest discover -s tests -p 'test*.py' -v
          python -m py_compile tools/build_market_observatory.py tools/build_observatory_sector_etf.py tools/build_fed_watch.py tools/postprocess_market_observatory.py tools/backfill_market_history_30y.py tools/enrich_economic_calendar.py tools/refresh_official_central_bank_actuals.py tools/persist_calendar_history.py tools/archive_calendar_actuals.py tools/calendar_market_events.py tools/add_observatory_equities.py tests/test_market_observatory_completed_session.py tests/test_calendar_market_semantics.py tests/test_calendar_data_quality.py
          python tests/test_market_observatory_completed_session.py
          python tests/test_calendar_market_semantics.py
          python tools/build_market_observatory.py
          python tools/postprocess_market_observatory.py
          python tools/backfill_market_history_30y.py
          python tools/build_fed_watch.py
          python tools/refresh_calendar_pipeline.py --seed --previous /tmp/economic-calendar-prev.json
          python -m unittest discover -s tests -p 'test_observatory_crypto.py'
          python tools/add_observatory_equities.py
          python tools/build_observatory_sector_etf.py
          python - <<'PY'
          import sys
          sys.path.insert(0,'tools')
          from publish_observatory_data import materialize_market_dependents, MARKET_BUNDLE
          materialize_market_dependents(MARKET_BUNDLE)
          PY
      - name: Acceptance contract
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from datetime import datetime, timedelta
          from pathlib import Path
          from zoneinfo import ZoneInfo
          o=json.load(open('market-observatory/data/observatory.json'))
          import sys
          sys.path.insert(0,'tools')
          from observatory_session import require_current
          require_current(o,json.load(open('market-observatory/data/daily-market-pulse.json')),json.load(open('public-market-daily.json')))
          c=json.load(open('market-observatory/data/economic-calendar.json'))
          h=json.load(open('market-observatory/data/history-30y.json'))
          s=json.load(open('market-observatory/data/sector-etf.json'))
          f=json.load(open('market-observatory/data/fed-watch.json'))
          a=json.load(open('market-observatory/data/ai-read-contract.json'))
          assert o['schema']=='JJOONI_MARKET_OBSERVATORY_V1'
          assert o['read_only'] is True and o['contains_account_data'] is False
          assert o.get('history_target_years')==30
          assert o.get('history_contract')=='IMMUTABLE_30Y_BASE_PLUS_RECENT_INCREMENT'
          assert isinstance(o.get('series'),dict) and len(o['series'])>=10
          for k in ['KOSPI','KOSDAQ','NASDAQ100','SP500','VIX','USDKRW','WTI','BRENT','DXY','US3M','US2Y','US10Y_OFFICIAL','US30Y_OFFICIAL','JP2Y','JP5Y','JP10Y','JP30Y']:
              assert len(o['series'].get(k) or [])>5,(k,len(o['series'].get(k) or []))
          for k in ['KOSPI','KOSDAQ','US_2S10S','JP_2S10S','KR10Y','FEAR_GREED']:
              assert o.get('latest',{}).get(k) is not None,(k,o.get('latest',{}).get(k))
          assert len(o.get('series',{}).get('FEAR_GREED') or [])>1
          today=o.get('today_strategy') or {}
          assert today.get('read_only') is True and today.get('autobot_direct_trade_trigger') is False,today
          us_dates={k:str((o['series'].get(k) or [{}])[-1].get('date',''))[:10] for k in ['NASDAQ100','SP500','VIX']}
          assert all(us_dates.values()),us_dates
          assert len(set(us_dates.values()))==1,us_dates
          assert o.get('us_market_session_contract')=='COMMON_LAST_COMPLETED_US_SESSION_V1'
          assert o.get('us_completed_session_date')==next(iter(set(us_dates.values())))
          assert o.get('equity_enrichment_contract')=='KOSPI_KOSDAQ_DAILY_REFERENCE_V1'
          assert c['schema']=='JJOONI_ECONOMIC_CALENDAR_V1'
          assert c['timezone']=='Asia/Seoul' and c.get('time_contract')=='ALL_TIMES_KST'
          assert str(c.get('enrichment_contract','')).startswith('OFFICIAL_SCHEDULE_PLUS_MARKET_CONSENSUS_ACTUAL')
          assert c.get('retention_contract')=='PERSIST_RELEASED_VALUES_ACROSS_ROLLING_FEEDS_V1'
          assert c.get('official_actual_contract')=='OFFICIAL_REGISTRY_BACKFILL_V2'
          assert (c.get('actual_freshness') or {}).get('status') in ['LIVE','PENDING','DEGRADED']
          assert all(all(k in e for k in ['previous','consensus','actual','market_metrics']) for e in c.get('events',[]))
          assert h.get('schema')=='JJOONI_MARKET_HISTORY_30Y_V1' and h.get('target_years')==30
          assert s.get('schema')=='JJOONI_OBSERVATORY_SECTOR_ETF_V1'
          assert s.get('read_only') is True and s.get('contains_account_data') is False
          assert s.get('universe_version')=='SONG_SECTOR_UNIVERSE_V2_COUNTRY'
          classic=next(g['rows'] for g in s.get('groups',[]) if g.get('key')=='classic')
          assert len(classic)==11
          assert s.get('quality',{}).get('classic_priced_count',0)>=9
          for ticker in ['XLK','XLC','XLY','XLF','XLI','XLE','XLB','XLV','XLP','XLU','XLRE','SMH','IGV','XBI','KRE','SPY','EWY','EWJ','MCHI','EWT','INDA','EWZ','VGK']:
              assert ticker in s.get('series',{}),ticker
          country=next(g['rows'] for g in s.get('groups',[]) if g.get('key')=='country')
          assert [r.get('ticker') for r in country]==['SPY','EWY','EWJ','MCHI','EWT','INDA','EWZ','VGK']
          assert f.get('schema')=='JJOONI_FED_WATCH_V1'
          assert f.get('read_only') is True and f.get('contains_account_data') is False
          assert f.get('meeting_date') and f.get('market_data_as_of')
          assert f.get('freshness') in ['LIVE','STALE','LAGGING']
          assert 0 <= float(f.get('hold_probability',0)) <= 1
          assert 0 <= float(f.get('hike_any_probability',0)) <= 1
          assert 0 <= float(f.get('cut_any_probability',0)) <= 1
          assert abs(sum(float(x.get('probability',0)) for x in f.get('outcomes',[]))-1.0) < 0.01
          KST=ZoneInfo('Asia/Seoul')
          fomc_date=datetime.fromisoformat(f['meeting_date']+'T14:00:00').replace(tzinfo=ZoneInfo('America/New_York')).astimezone(KST).date().isoformat()
          fomc=next(e for e in c.get('events',[]) if e.get('country')=='US' and e.get('title')=='FOMC 정책결정' and str(e.get('datetime_kst','')).startswith(fomc_date))
          metrics={m.get('key'):m for m in fomc.get('market_metrics',[])}
          rate=metrics.get('fed_rate') or {}
          fw=metrics.get('fedwatch_hike_25bp') or {}
          # Optional vendor enrichment must never block publication of fresh market data.
          # Structural semantics remain hard requirements; unavailable values are surfaced as warnings.
          for key in ['previous','consensus','actual']:
              assert key in rate,(key,rate)
          fomc_dt=datetime.fromisoformat(fomc['datetime_kst'])
          now=datetime.now(KST)
          if not rate.get('previous') or not rate.get('consensus'):
              print('MARKET_OBSERVATORY_WARN=FOMC_RATE_REFERENCE_MISSING',rate)
          if fomc_dt <= now-timedelta(minutes=45):
              freshness=c.get('actual_freshness') or {}
              if rate.get('actual') is None:
                  assert freshness.get('status') in ['PENDING','DEGRADED'],(rate,freshness)
          # FedWatch is a dated market-probability snapshot, not a release with
          # a prior-period actual. Its previous field is optional after FOMC rollover.
          for key in ['consensus','actual','source','observed_date']:
              assert key in fw,(key,fw)
          if not fw.get('consensus'):
              print('MARKET_OBSERVATORY_WARN=FEDWATCH_CONSENSUS_MISSING',fw)
          else:
              assert fw.get('source') and fw.get('observed_date'),fw
          assert fw.get('actual') is None,fw
          assert fw.get('metric_type')=='market_probability_snapshot' and fw.get('value_role')=='market_forecast',fw
          assert a.get('schema')=='JJOONI_MARKET_OBSERVATORY_AI_READ_CONTRACT_V1'
          assert any(x.get('path')=='./fed-watch.json' and x.get('required') for x in a.get('required_reads',[]))
          html=Path('market-observatory/index.html').read_text(encoding='utf-8')
          for token in ['chartjs-plugin-zoom@2.2.0','observatory-v2.js','calendar-editor-v1.js','latest-board-v1.js','sector-etf-v1.js','fed-watch-v1.js']:
              assert token in html,token
          assert "fetch('./data/observatory.json?'+Date.now(),{cache:'no-store'})" not in html
          assert "loadCalendar()" in html and "economic-calendar.json" in html
          sector=Path('market-observatory/sector-etf-v1.js').read_text(encoding='utf-8')
          for token in ['송팀장 Sector Observatory','RS vs SPY 1M','sector-etf.json','READY_LAZY',"version:'1.7'","JjooniDataReads.read('./data/sector-etf.json')"]:
              assert token in sector,token
          from tools.observatory_ui_assets import require_runtime
          require_runtime(html, 'sector-etf-v1.js')
          board=Path('market-observatory/latest-board-v1.js').read_text(encoding='utf-8')
          for token in ['KOSPI','KOSDAQ','US10Y_OFFICIAL','KR10Y','WTI','latestBoardGenerated','refDate']:
              assert token in board,token
          fedjs=Path('market-observatory/fed-watch-v1.js').read_text(encoding='utf-8')
          for token in ['FOMC Market Pricing · FedWatch','fed-watch.json','hike_25bp_probability','change_1w_pctpt']:
              assert token in fedjs,token
          obsui=Path('market-observatory/observatory-v2.js').read_text(encoding='utf-8')
          for token in ['MATURITY_TIME_SERIES','RANGE_ORDER','filtered(labels,sets,range)']:
              assert token in obsui,token
          for token in ['미국 국채금리 추세','3개월물','2년물','10년물','30년물']:
              assert token in html,token
          assert "common(['US3M','US2Y','US10Y_OFFICIAL','US30Y_OFFICIAL'])" in html
          assert 'observatory-v2.js?v=' in html
          # The optimized first load uses HTTP revalidation and lazy calendar reads.
          # Do not require the retired cache-busting bootstrap on every data build.
          assert "fetch(url,{cache:'no-store'})" in html and "u+sep+'cb='+Date.now()" in html
          assert "loadObsJson('./data/observatory-recent.json').catch(()=>loadObsJson('./data/observatory.json'))" in html
          assert "CAL_PROMISE=loadObsJson('./data/economic-calendar.json')" in html
          import re
          board_url_version=re.search(r'latest-board-v1\.js\?v=([0-9A-Za-z._-]+)',html)
          board_runtime_version=re.search(r"version:'([0-9A-Za-z._-]+)'",board)
          assert board_url_version and board_runtime_version,'latest board runtime/cache version missing'
          assert board_url_version[1]==board_runtime_version[1],(board_url_version[1],board_runtime_version[1])
          assert 'fed-watch-v1.js?v=2.1' in html
          print('MARKET_OBSERVATORY_ACCEPTANCE=PASS')
          print('us_source_dates=',us_dates)
          print('calendar_actual_freshness=',c.get('actual_freshness'))
          print('fedwatch=',f['meeting_date'],f['market_data_as_of'],f['hike_any_probability'],f['freshness'])
          print('series=',len(o['series']),'KOSPI=',o['latest']['KOSPI'],'KOSDAQ=',o['latest']['KOSDAQ'],'calendar=',len(c['events']),'sector_classic=',len(classic),'sector_priced=',s['summary']['priced_count'])
          PY
      - name: Publish Observatory data and UI
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          python tools/publish_observatory_data.py --message 'data(observatory): refresh latest market board calendar sectors and FedWatch' market-observatory/data/observatory.json market-observatory/data/daily-market-pulse.json public-market-daily.json market-observatory/data/economic-calendar.json market-observatory/data/history-30y.json market-observatory/data/sector-etf.json market-observatory/data/fed-watch.json market-observatory/data/fedwatch-official.json market-observatory/data/ai-read-contract.json market-observatory/data/calendar-manual-overrides.json market-observatory/data/calendar-official-release-cache.json $(find market-observatory/data/fedwatch-history -type f | sort)




