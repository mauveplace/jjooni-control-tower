name: Canonical data and module loading contract
on:
  push:
    branches: [main]
    paths: ['*.js', 'index.html', 'tests/**', '.github/workflows/canonical-contract.yml']
  pull_request:
    paths: ['*.js', 'index.html', 'tests/**', '.github/workflows/canonical-contract.yml']
permissions:
  contents: read
jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/*.test.cjs
