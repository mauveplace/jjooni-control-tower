name: Patch Source Authority V24.2 Once
on:
  push:
    branches: [fix/source-authority-fx-failclosed-20260908]
    paths: ['.github/workflows/patch-source-authority-v24-2-once.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/source-authority-fx-failclosed-20260908
          fetch-depth: 0
      - name: Make USD valuation fail closed without verified FX
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          def rep(path, old, new, count=1):
              p=Path(path); s=p.read_text(encoding='utf-8'); got=s.count(old)
              if got != count: raise SystemExit(f'PATTERN_COUNT:{path}:{got}!={count}:{old[:100]}')
              p.write_text(s.replace(old,new),encoding='utf-8')

          p=Path('source-authority-guard-v24.js'); s=p.read_text(encoding='utf-8')
          if s.count("version:'24.1'")!=1: raise SystemExit('VERSION_PATTERN')
          s=s.replace("version:'24.1'","version:'24.2'")

          old="""  if(ev.ok){a.quality='BROKER_DIRECT_KIS_API';a.account_quality='BROKER_DIRECT_KIS_API';a.holdings_quality='BROKER_DIRECT_KIS_API';a.cash_quality='BROKER_DIRECT_KIS_API';if(!String(a.source||'').toUpperCase().includes('KIS'))a.source='BROKER_DIRECT_KIS_KR+OVERSEAS';}"""
          new="""  if(ev.ok){a.holdings_quality='BROKER_DIRECT_KIS_API';a.cash_quality='BROKER_DIRECT_KIS_API';if(String(a.quality||'').toUpperCase()==='SOURCE_UNVERIFIED'&&String(a.status||'').toUpperCase()==='LIVE')a.quality='LIVE';if(String(a.account_quality||'').toUpperCase()==='SOURCE_UNVERIFIED'&&String(a.status||'').toUpperCase()==='LIVE')a.account_quality='LIVE';if(!String(a.source||'').toUpperCase().includes('KIS'))a.source='BROKER_DIRECT_KIS_KR+OVERSEAS';}"""
          if s.count(old)!=1: raise SystemExit('KIS_SUCCESS_PATTERN')
          s=s.replace(old,new)

          old="""function safeValue(id,a,p){
 let row=p;
 if(p.market_value_contract==='CANONICAL_KRW_V13'){if(isUsd(p)&&window.JjooniMetrics.fx(a,p)==null)return null;row={...p};for(const k of explicitKrwKeys)delete row[k]}
 const value=window.JjooniMetrics.valueKrw(row,a);
 return value==null?null:{value,mode:'DECLARED_CURRENCY',source:'CANONICAL_CONTRACT'};
}"""
          new="""function isUnsafeDerivedKrw(p){return /^CANONICAL_KRW_V13(?:$|_)/.test(String(p?.market_value_contract||''))}
function safeValue(id,a,p){
 const usd=isUsd(p),unsafeDerived=isUnsafeDerivedKrw(p),explicit=firstNumber(p,explicitKrwKeys);
 if(!usd){const value=window.JjooniMetrics.valueKrw(p,a);return value==null?null:{value,mode:'DECLARED_CURRENCY',source:'CANONICAL_CONTRACT'};}
 // Explicit KRW supplied by a non-legacy source is authoritative by field semantics.
 if(explicit&&!unsafeDerived)return{value:explicit.value,mode:'EXPLICIT_KRW',source:explicit.key};
 // USD-native values may only become KRW with account-specific or explicit shared FX.
 const f=fxFor(id,a,p);if(!f)return null;
 const native=firstNumber(p,['value']);
 const q=n(p?.qty??p?.quantity??p?.held_qty??p?.balance_qty),price=px(p);
 const nativeValue=native?.value??(q!=null&&price!=null?q*price:null);
 if(nativeValue==null)return null;
 return{value:nativeValue*f.value,mode:'USD_NATIVE_TO_KRW',source:'VERIFIED_FX',fx:f.value,fx_source:f.source};
}"""
          if s.count(old)!=1: raise SystemExit('SAFE_VALUE_PATTERN')
          s=s.replace(old,new)

          old="""   const wasV13=String(p.market_value_contract||'')==='CANONICAL_KRW_V13';"""
          new="""   const wasV13=isUnsafeDerivedKrw(p);"""
          if s.count(old)!=1: raise SystemExit('V13_CLASSIFIER_PATTERN')
          s=s.replace(old,new)
          p.write_text(s,encoding='utf-8')

          rep('trade-review-loader.js',"version:'14.15'","version:'14.16'")
          rep('trade-review-loader.js','source-authority-guard-v24.js?v=24.1','source-authority-guard-v24.js?v=24.2')
          rep('index.html','trade-review-loader.js?v=14.15','trade-review-loader.js?v=14.16')

          # Contract checks: no implicit universal FX and no old exact-only classifier.
          t=Path('source-authority-guard-v24.js').read_text(encoding='utf-8')
          assert "version:'24.2'" in t
          assert "isUnsafeDerivedKrw" in t
          assert "if(!f)return null" in t
          assert "market_value_contract==='CANONICAL_KRW_V13'" not in t
          assert '||1350' not in t
          PY
          node --check source-authority-guard-v24.js
          node --check trade-review-loader.js
          git config user.name 'jjooni-automation'
          git config user.email 'actions@users.noreply.github.com'
          git add source-authority-guard-v24.js trade-review-loader.js index.html
          git commit -m 'fix: fail closed on USD valuation without verified FX'
          git push origin HEAD:fix/source-authority-fx-failclosed-20260908
