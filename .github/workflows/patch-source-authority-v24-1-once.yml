name: Patch Source Authority V24.1 Once

on:
  push:
    branches: [fix/source-authority-v24-1-cache-fx-20260907]
    paths:
      - '.github/workflows/patch-source-authority-v24-1-once.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/source-authority-v24-1-cache-fx-20260907
          fetch-depth: 0
      - name: Apply exact fail-closed patches
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          def rep(path, old, new, expected=1):
              p=Path(path); s=p.read_text(encoding='utf-8'); c=s.count(old)
              if c != expected:
                  raise SystemExit(f'{path}: expected {expected} matches, found {c}: {old[:100]!r}')
              p.write_text(s.replace(old,new),encoding='utf-8')
              print(f'PATCHED {path}: {c}')

          # Bootstrap: force browsers to fetch the current loader contract.
          rep('index.html','trade-review-loader.js?v=3','trade-review-loader.js?v=14.11')

          # Legacy broker identity: AI account is KIS, not KB Securities.
          rep('live-bridge.js',"{id:'AI',label:'AI BOT',type:'AI',broker:'KB증권'}","{id:'AI',label:'AI BOT',type:'AI',broker:'한국투자증권'}")

          # account-integrity may repair the broker label, but must never invent the API source.
          rep('account-integrity-v17.js',"root.accounts.AI.broker=label;root.accounts.AI.broker_name=label;root.accounts.AI.broker_code='KIS';root.accounts.AI.source=root.accounts.AI.source||'KIS_OPEN_API'","root.accounts.AI.broker=label;root.accounts.AI.broker_name=label;root.accounts.AI.broker_code='KIS'")

          # account-source truth: require live backend evidence, not broker_code/source text alone.
          rep('account-source-truth-v22.js',
          "const kisDirect=aiMode.includes('KIS')||aiBrokerCode==='KIS'||aiProvider.includes('KIS_OPEN_API')||aiProvider.includes('KOREA INVESTMENT');",
          "const aiStatus=String(liveA.status||'').toUpperCase();\n const aiNav=n(liveA.nav??ai.nav);\n const kisIdentity=aiMode.includes('KIS')||aiBrokerCode==='KIS'||aiProvider.includes('KIS_OPEN_API')||aiProvider.includes('KOREA INVESTMENT')||liveA.broker_direct===true||String(liveA.position_authority||'').toUpperCase().includes('KIS_OPEN_API_BROKER_BALANCE');\n const kisDirect=aiStatus==='LIVE'&&aiNav!=null&&aiNav>0&&kisIdentity;")

          rep('account-source-truth-v22.js',
          "function fx(){\n const L=window.__JJOONI_LIVE_PAYLOAD||{};\n for(const v of [window.__JJOONI_FX_KRW_PER_USD,(L.accounts||{}).AI?.fx_krw_per_usd,(L.accounts||{}).TRIPOD?.fx]){const x=n(v);if(x&&x>500&&x<3000)return x}\n return 1350;\n}",
          "function fx(id,p){\n const L=window.__JJOONI_LIVE_PAYLOAD||{},C=window.__JJOONI_CANONICAL_SSOT||{};\n const a=(C.accounts||{})[id]||{},live=(L.accounts||{})[id]||{};\n for(const v of [p?.fx_krw_per_usd,p?.fx,a.fx_krw_per_usd,a.fx,live.fx_krw_per_usd,live.fx]){const x=n(v);if(x&&x>500&&x<3000)return x}\n const ref=L.fx_reference||{},x=n(ref.krw_per_usd);\n if(x&&x>500&&x<3000&&String(ref.source||'').toUpperCase()!=='FX_REFERENCE_MISSING')return x;\n return null;\n}")
          rep('account-source-truth-v22.js','function positionValueKrw(p){','function positionValueKrw(id,p){')
          rep('account-source-truth-v22.js',"for(const k of ['market_value','evaluation_amount','eval_amount','valuation','evlu_amt','evaluation_value']){const x=n(p?.[k]);if(x!=null)return currency(p)==='USD'?x*fx():x}","for(const k of ['market_value','evaluation_amount','eval_amount','valuation','evlu_amt','evaluation_value']){const x=n(p?.[k]);if(x!=null){if(currency(p)!=='USD')return x;const f=fx(id,p);return f?x*f:null}}")
          rep('account-source-truth-v22.js',"return currency(p)==='USD'?qty*px*fx():qty*px;","if(currency(p)!=='USD')return qty*px;const f=fx(id,p);return f?qty*px*f:null;")
          rep('account-source-truth-v22.js','.map(positionValueKrw).filter(v=>v!=null);','.map(p=>positionValueKrw(id,p)).filter(v=>v!=null);')
          rep('account-source-truth-v22.js','function patchUi(){','function patchUi(kisDirect){')
          rep('account-source-truth-v22.js',"if(name==='AI BOT')src.textContent='한국투자증권 API';","if(name==='AI BOT')src.textContent=kisDirect?'한국투자증권 API':'한국투자증권 · API 원천 미확인';")
          rep('account-source-truth-v22.js',"if(name==='AI BOT')src.textContent='한국투자증권 API'+(basis?' · 기준 '+basis:'');","if(name==='AI BOT')src.textContent=(kisDirect?'한국투자증권 API':'한국투자증권 · API 원천 미확인')+(basis?' · 기준 '+basis:'');")
          rep('account-source-truth-v22.js',' patchUi();\n const metric=patchMetricRuntime();',' patchUi(direct);\n const metric=patchMetricRuntime();')

          # Lineage Guard is the settled metric owner; only same-account or explicit shared FX is allowed.
          rep('lineage-guard.js',
          "function fxFor(c,p){\n if(String((p||{}).currency||'KRW').toUpperCase()!=='USD')return 1;\n const L=live()||{},A=L.accounts||{};\n for(const v of [p&&p.fx,c&&c.fx,(A.TOSS||{}).fx_krw_per_usd,(A.AI||{}).fx_krw_per_usd,(A.TRIPOD||{}).fx]){\n  const x=validFx(v);if(x!=null)return x;\n }\n return null;\n}",
          "function fxFor(id,c,p){\n if(String((p||{}).currency||'KRW').toUpperCase()!=='USD')return 1;\n const L=live()||{},a=(L.accounts||{})[id]||{};\n for(const v of [p&&p.fx_krw_per_usd,p&&p.fx,c&&c.fx_krw_per_usd,c&&c.fx,a.fx_krw_per_usd,a.fx]){\n  const x=validFx(v);if(x!=null)return x;\n }\n const ref=L.fx_reference||{},x=validFx(ref.krw_per_usd);\n if(x!=null&&String(ref.source||'').toUpperCase()!=='FX_REFERENCE_MISSING')return x;\n return null;\n}")
          rep('lineage-guard.js','const dp=n(p.daily_pnl),dr=n(p.daily_return),fx=fxFor(c,p);','const dp=n(p.daily_pnl),dr=n(p.daily_return),fx=fxFor(id,c,p);')
          rep('lineage-guard.js',"const isUsd=String(p.currency||'KRW').toUpperCase()==='USD',fx=fxFor(c,p);","const isUsd=String(p.currency||'KRW').toUpperCase()==='USD',fx=fxFor(id,c,p);")

          # Tablet runtime: no cross-account AI FX and never multiply USD by a fake 1 KRW rate.
          rep('tablet-runtime-v8.js',"const fxNow=()=>n(window.__JJOONI_FX_KRW_PER_USD)||n((((L().accounts||{}).AI)||{}).fx_krw_per_usd)||1;","const fxNow=()=>{const ref=L().fx_reference||{},x=n(ref.krw_per_usd);return x&&x>500&&x<3000&&String(ref.source||'').toUpperCase()!=='FX_REFERENCE_MISSING'?x:null};")
          rep('tablet-runtime-v8.js',"function toKrw(v,c,fx){const x=n(v);if(x==null)return null;return String(c||'KRW').toUpperCase()==='USD'?x*(n(fx)||fxNow()):x}","function toKrw(v,c,fx){const x=n(v);if(x==null)return null;if(String(c||'KRW').toUpperCase()!=='USD')return x;const f=n(fx)||fxNow();return f&&f>500&&f<3000?x*f:null}")
          rep('tablet-runtime-v8.js',"if(s.includes('BROKER')||s.includes('ACTUAL')||s==='FULL'||s==='LIVE')return 'measured';","if(s.includes('BROKER_DIRECT')||s.includes('BROKER_LIVE')||s.includes('BROKER_API')||s.includes('ACTUAL_BROKER'))return 'measured';")

          # Human trust labels: plain LIVE is freshness, not proof of broker-direct account authority.
          rep('human-ui-v6.js',"if(s.includes('BROKER')||s.includes('ACTUAL')||s==='FULL'||s==='LIVE')return 'measured';","if(s.includes('BROKER_DIRECT')||s.includes('BROKER_LIVE')||s.includes('BROKER_API')||s.includes('ACTUAL_BROKER'))return 'measured';")

          # Tablet accounts: modeled KR accounts never borrow AI USD FX; no `1 KRW/USD` fallback.
          rep('tablet-accounts-v8.js',"function trustKind(raw){const s=String(raw||'').toUpperCase();if(s.includes('BROKER')||s.includes('ACTUAL')||s==='FULL'||s==='LIVE')return '증권사 확인';if(s.includes('MODEL')||s.includes('MODELED')||s.includes('MTM')||s.includes('ACCOUNTING')||s.includes('PARTIAL'))return '계산값';return '참고값'}","function trustKind(raw){const s=String(raw||'').toUpperCase();if(s.includes('BROKER_DIRECT')||s.includes('BROKER_LIVE')||s.includes('BROKER_API')||s.includes('ACTUAL_BROKER'))return '증권사 확인';if(s.includes('MODEL')||s.includes('MODELED')||s.includes('MTM')||s.includes('ACCOUNTING')||s.includes('PARTIAL'))return '계산값';return '참고값'}")
          rep('tablet-accounts-v8.js',"function fx(){return n(window.__JJOONI_FX_KRW_PER_USD)||n((((L().accounts||{}).AI)||{}).fx_krw_per_usd)||1}","function fx(id,a){const live=(L().accounts||{})[id]||{};for(const v of [a?.fx_krw_per_usd,a?.fx,live.fx_krw_per_usd,live.fx]){const x=n(v);if(x&&x>500&&x<3000)return x}const ref=L().fx_reference||{},x=n(ref.krw_per_usd);return x&&x>500&&x<3000&&String(ref.source||'').toUpperCase()!=='FX_REFERENCE_MISSING'?x:null}")
          rep('tablet-accounts-v8.js',"const cards=IDS.map(id=>{const a=c.accounts[id]||{},cash=z(a.cash_krw)+z(a.cash_usd)*fx(),source=trustKind(a.quality||a.source);return", "const cards=IDS.map(id=>{const a=c.accounts[id]||{},krw=n(a.cash_krw),usdCash=['TOSS','AI'].includes(id)?n(a.cash_usd):null,f=fx(id,a);let cash=krw??0,cashKnown=krw!=null,cashFxMissing=false;if(usdCash!=null&&Math.abs(usdCash)>0){if(f){cash+=usdCash*f;cashKnown=true}else cashFxMissing=true}const cashText=cashFxMissing?'환율 미확인':cashKnown?won(cash):'—',source=trustKind(a.quality||a.source);return")
          rep('tablet-accounts-v8.js',"<span>예수금/현금</span><b>${cash?won(cash):'—'}</b>","<span>예수금/현금</span><b>${cashText}</b>")

          # Loader version/guard cache bust.
          rep('trade-review-loader.js',"const BOOT={state:'WAITING_FOR_SSOT',version:'14.10'","const BOOT={state:'WAITING_FOR_SSOT',version:'14.11'")
          rep('trade-review-loader.js',"'source-authority-guard-v24.js?v=24.0'","'source-authority-guard-v24.js?v=24.1'")

          # V24.1: source verification must also control generic quality/source; preserve verified detailed source.
          rep('source-authority-guard-v24.js',"version:'24.0'","version:'24.1'")
          rep('source-authority-guard-v24.js',"const strong=balance.includes('KIS_OPEN_API_BROKER_BALANCE')||position.includes('KIS_OPEN_API_BROKER_BALANCE')||a.broker_direct===true||provider.includes('KOREA INVESTMENT');\n const base=status==='LIVE'&&mode.includes('KIS')&&nav!=null&&nav>0;\n if(base&&(strong||(!balance&&!position&&!provider)))return{ok:true,reason:strong?'LIVE_KIS_BACKEND_AUTHORITY':'LIVE_KIS_MODE_NAV'};","const strong=balance.includes('KIS_OPEN_API_BROKER_BALANCE')||position.includes('KIS_OPEN_API_BROKER_BALANCE')||a.broker_direct===true||provider.includes('KOREA INVESTMENT');\n const identity=mode.includes('KIS')||String(a.broker_code||'').toUpperCase()==='KIS'||String(a.source||'').toUpperCase().includes('KIS')||strong;\n const base=status==='LIVE'&&identity&&nav!=null&&nav>0;\n if(base)return{ok:true,reason:strong?'LIVE_KIS_BACKEND_AUTHORITY':'LIVE_KIS_IDENTITY_NAV'};")
          rep('source-authority-guard-v24.js',"if(ev.ok){a.source='KIS_OPEN_API';a.account_quality='BROKER_DIRECT_KIS_API';a.holdings_quality='BROKER_DIRECT_KIS_API';a.cash_quality='BROKER_DIRECT_KIS_API';}\n  else{a.account_quality='SOURCE_UNVERIFIED';a.holdings_quality='SOURCE_UNVERIFIED';a.cash_quality='SOURCE_UNVERIFIED';if(String(a.source||'').toUpperCase()==='KIS_OPEN_API')a.source='KIS_SOURCE_UNVERIFIED';}","if(ev.ok){a.quality='BROKER_DIRECT_KIS_API';a.account_quality='BROKER_DIRECT_KIS_API';a.holdings_quality='BROKER_DIRECT_KIS_API';a.cash_quality='BROKER_DIRECT_KIS_API';if(!String(a.source||'').toUpperCase().includes('KIS'))a.source='BROKER_DIRECT_KIS_KR+OVERSEAS';}\n  else{a.quality='SOURCE_UNVERIFIED';a.account_quality='SOURCE_UNVERIFIED';a.holdings_quality='SOURCE_UNVERIFIED';a.cash_quality='SOURCE_UNVERIFIED';if(/KIS|BROKER_DIRECT_KIS/.test(String(a.source||'').toUpperCase()))a.source='KIS_SOURCE_UNVERIFIED';}")
          rep('source-authority-guard-v24.js',"const nodes=[...document.querySelectorAll('.ctP8Card,.ctA8Card,.accountCard,.card,[data-account-drill],#accountDrillModal')];","const nodes=[...document.querySelectorAll('.ctP8Card,.ctA8Card,.accountCard,.card,[data-account-drill],#accountDrillModal')];\n const trustRows=[...document.querySelectorAll('.ctTrustRowV6')];for(const row of trustRows){if(String(row.querySelector('b')?.textContent||'').trim()==='AI BOT'){const x=row.querySelector('.ctTrustSourceV6');if(x)x.textContent=ev.ok?'한국투자증권 API':label}}\n for(const card of document.querySelectorAll('#ctDesktopAccountsV8 .ctA8Card')){if(String(card.querySelector('.ctA8Name')?.textContent||'').trim()==='AI BOT'){const x=card.querySelector('.ctA8Source');if(x){const basis=String(x.textContent||'').split('· 기준').slice(1).join('· 기준').trim();x.textContent=(ev.ok?'한국투자증권 API':label)+(basis?' · 기준 '+basis:'')}}}")
          rep('source-authority-guard-v24.js',"document.addEventListener('visibilitychange',()=>{if(!document.hidden)schedule()});","document.addEventListener('visibilitychange',()=>{if(!document.hidden)schedule()});window.addEventListener('resize',schedule,{passive:true});setInterval(()=>{if(!document.hidden)schedule()},1000);")

          PY

          # Static assertions: these exact fail-open patterns must be gone.
          ! grep -q "trade-review-loader.js?v=3" index.html
          ! grep -q "return 1350" account-source-truth-v22.js canonical-valuation-fix-v13.js
          ! grep -q "broker:'KB증권'" live-bridge.js
          ! grep -q "source=root.accounts.AI.source||'KIS_OPEN_API'" account-integrity-v17.js
          grep -q "trade-review-loader.js?v=14.11" index.html
          grep -q "source-authority-guard-v24.js?v=24.1" trade-review-loader.js
          grep -q "FX_REFERENCE_MISSING" lineage-guard.js tablet-runtime-v8.js tablet-accounts-v8.js account-source-truth-v22.js
          grep -q "cashText=cashFxMissing?'환율 미확인'" tablet-accounts-v8.js

          git config user.name 'jjooni-automation'
          git config user.email 'actions@users.noreply.github.com'
          git add index.html live-bridge.js account-integrity-v17.js account-source-truth-v22.js lineage-guard.js tablet-runtime-v8.js human-ui-v6.js tablet-accounts-v8.js trade-review-loader.js source-authority-guard-v24.js
          git commit -m 'fix: close remaining broker and FX source fallbacks'
          git push origin HEAD:fix/source-authority-v24-1-cache-fx-20260907
