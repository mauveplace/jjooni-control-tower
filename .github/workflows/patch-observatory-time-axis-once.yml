name: Patch Observatory Real Time Axis Once

on:
  push:
    paths:
      - '.github/workflows/patch-observatory-time-axis-once.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch all date-series charts to real elapsed-time axis
        shell: python
        run: |
          from pathlib import Path

          p = Path('market-observatory/observatory-v2.js')
          s = p.read_text(encoding='utf-8')

          old = r'''function tickLabel(raw,range){
            const s=String(raw??'');
            if(!/^\d{4}-\d{2}-\d{2}/.test(s))return s;
            if(['1M','3M','6M'].includes(range))return s.slice(5,10);
            if(['1Y','3Y'].includes(range))return s.slice(0,7).replace('-','.');
            return s.slice(0,4);
          }
          function tickLimit(range){
            if(['1M','3M','6M'].includes(range))return 6;
            if(['1Y','3Y'].includes(range))return 7;
            return 6;
          }
          function chartConfig(labels,sets,range='5Y'){
            return{
              type:'line',
              data:{labels,datasets:sets.map(x=>({label:x.label,data:x.data,borderWidth:2,pointRadius:0,tension:.12,spanGaps:true}))},
              options:{
                responsive:true,maintainAspectRatio:false,interaction:{mode:'index',intersect:false},animation:false,
                layout:{padding:{bottom:2}},
                plugins:{
                  legend:{display:true,position:'bottom',labels:{boxWidth:12,font:{size:10}}},
                  zoom:{limits:{x:{min:'original',max:'original'}},pan:{enabled:true,mode:'x'},zoom:{wheel:{enabled:true,speed:.08},pinch:{enabled:true},mode:'x'}}
                },
                scales:{
                  x:{
                    ticks:{display:true,color:'#667085',padding:6,maxTicksLimit:tickLimit(range),maxRotation:0,minRotation:0,font:{size:9},callback:function(v){return tickLabel(this.getLabelForValue(v),range)}},
                    grid:{color:'#eef2f6',drawTicks:true},border:{color:'#cfd8e3'}
                  },
                  y:{ticks:{maxTicksLimit:6,font:{size:9},color:'#667085'},grid:{color:'#e8edf3'},border:{color:'#cfd8e3'}}
                }
              }
            };
          }'''

          new = r'''function dateEpoch(raw){
            const s=String(raw??'').trim();
            if(!/^\d{4}-\d{2}-\d{2}/.test(s))return null;
            const t=Date.parse(s.slice(0,10)+'T00:00:00Z');
            return Number.isFinite(t)?t:null;
          }
          function tickLabel(raw,range){
            const t=Number(raw);
            if(!Number.isFinite(t))return String(raw??'');
            const s=new Date(t).toISOString().slice(0,10);
            if(['1M','3M','6M'].includes(range))return s.slice(5,10);
            if(['1Y','3Y'].includes(range))return s.slice(0,7).replace('-','.');
            return s.slice(0,4);
          }
          function tooltipDate(raw){
            const t=Number(raw);
            return Number.isFinite(t)?new Date(t).toISOString().slice(0,10):String(raw??'');
          }
          function tickLimit(range){
            if(['1M','3M','6M'].includes(range))return 6;
            if(['1Y','3Y'].includes(range))return 7;
            return 6;
          }
          function timeDatasets(labels,sets){
            return (sets||[]).map(series=>({
              label:series.label,
              data:(labels||[]).map((label,i)=>{
                const x=dateEpoch(label);
                return x==null?null:{x,y:(series.data||[])[i]??null};
              }).filter(Boolean),
              borderWidth:2,pointRadius:0,tension:.12,spanGaps:true,parsing:false,normalized:true
            }));
          }
          function chartConfig(labels,sets,range='5Y'){
            return{
              type:'line',
              data:{datasets:timeDatasets(labels,sets)},
              options:{
                responsive:true,maintainAspectRatio:false,interaction:{mode:'index',intersect:false},animation:false,
                layout:{padding:{bottom:2}},
                plugins:{
                  legend:{display:true,position:'bottom',labels:{boxWidth:12,font:{size:10}}},
                  tooltip:{callbacks:{title:items=>items?.length?tooltipDate(items[0].parsed.x):''}},
                  zoom:{limits:{x:{min:'original',max:'original'}},pan:{enabled:true,mode:'x'},zoom:{wheel:{enabled:true,speed:.08},pinch:{enabled:true},mode:'x'}}
                },
                scales:{
                  x:{
                    type:'linear',bounds:'data',
                    ticks:{display:true,color:'#667085',padding:6,maxTicksLimit:tickLimit(range),maxRotation:0,minRotation:0,font:{size:9},callback:v=>tickLabel(v,range)},
                    grid:{color:'#eef2f6',drawTicks:true},border:{color:'#cfd8e3'}
                  },
                  y:{ticks:{maxTicksLimit:6,font:{size:9},color:'#667085'},grid:{color:'#e8edf3'},border:{color:'#cfd8e3'}}
                }
              }
            };
          }'''

          if old not in s:
              raise SystemExit('expected legacy category-axis block not found; refuse blind patch')
          s = s.replace(old, new, 1)
          s = s.replace("version:'2.11-calendar-refresh'", "version:'2.12-real-time-axis'", 1)
          s = s.replace("x_axis_dates:true,calendar_refresh_ms", "x_axis_dates:true,x_axis_contract:'LINEAR_UTC_EPOCH_REAL_ELAPSED_TIME',calendar_refresh_ms", 1)
          p.write_text(s, encoding='utf-8')

          index = Path('market-observatory/index.html')
          html = index.read_text(encoding='utf-8')
          old_src = './observatory-v2.js?v=2.10'
          if old_src not in html:
              raise SystemExit('observatory cache key not found; refuse blind patch')
          html = html.replace(old_src, './observatory-v2.js?v=2.12', 1)
          index.write_text(html, encoding='utf-8')

      - name: Validate syntax and time-axis contract
        run: |
          node --check market-observatory/observatory-v2.js
          python - <<'PY'
          from pathlib import Path
          s = Path('market-observatory/observatory-v2.js').read_text(encoding='utf-8')
          html = Path('market-observatory/index.html').read_text(encoding='utf-8')
          required = [
              "function dateEpoch(raw)",
              "function timeDatasets(labels,sets)",
              "data:{datasets:timeDatasets(labels,sets)}",
              "type:'linear',bounds:'data'",
              "LINEAR_UTC_EPOCH_REAL_ELAPSED_TIME",
              "version:'2.12-real-time-axis'",
          ]
          missing = [x for x in required if x not in s]
          if missing:
              raise SystemExit('missing time-axis contract: '+repr(missing))
          if './observatory-v2.js?v=2.12' not in html:
              raise SystemExit('cache-bust version not updated')
          if "data:{labels,datasets:sets.map(x=>({label:x.label,data:x.data,borderWidth:2,pointRadius:0,tension:.12,spanGaps:true}))}" in s:
              raise SystemExit('legacy category-axis chartConfig still present')
          print('REAL_TIME_AXIS_ACCEPTANCE=PASS')
          PY

      - name: Commit patch
        run: |
          if git diff --quiet -- market-observatory/observatory-v2.js market-observatory/index.html; then
            echo 'No patch required'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add market-observatory/observatory-v2.js market-observatory/index.html
          git commit -m 'fix(observatory): use real elapsed-time x axis for date series'
          git push origin HEAD:main
