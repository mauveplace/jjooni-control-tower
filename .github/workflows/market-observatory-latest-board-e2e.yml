name: Market Observatory Latest Board E2E

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - market-observatory/index.html
      - market-observatory/latest-board-v1.js
      - market-observatory/sector-etf-v1.js
      - market-observatory/data/observatory.json
      - market-observatory/data/sector-etf.json
      - market-observatory/data/economic-calendar.json
      - .github/workflows/market-observatory-latest-board-e2e.yml

permissions:
  contents: read

concurrency:
  group: market-observatory-latest-board-e2e
  cancel-in-progress: true

jobs:
  public-latest-board:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax check latest board
        run: node --check market-observatory/latest-board-v1.js
      - name: Install Playwright Chromium
        run: |
          npm init -y >/dev/null 2>&1
          npm install --silent playwright@1.55.0
          npx playwright install --with-deps chromium >/dev/null
      - name: Verify public tab-scoped indicator boards
        env:
          URL: https://mauveplace.github.io/jjooni-control-tower/market-observatory/
        run: |
          node <<'JS'
          const { chromium } = require('playwright');
          const assert=(v,m)=>{if(!v)throw new Error(m)};
          const sleep=ms=>new Promise(r=>setTimeout(r,ms));
          const expected={
            rates:{title:'금리 주요 지표',must:['미국 2Y','미국 10Y','한국 10Y','일본 10Y','US 2s10s'],mustNot:['USD/KRW','WTI','KOSPI']},
            fx:{title:'환율 주요 지표',must:['USD/KRW','USD/JPY','JPY/KRW','DXY'],mustNot:['미국 10Y','WTI','KOSPI']},
            energy:{title:'원자재 주요 지표',must:['WTI','Brent','Natural Gas','Gold','Silver','Copper'],mustNot:['USD/KRW','미국 10Y','KOSPI']},
            sectors:{title:'섹터·ETF 주요 지표',must:['MA20 상회','1M RS 강세','1M RS 약세','성장-방어','SPY 1M','QQQ 1M'],mustNot:['USD/KRW','미국 10Y']},
            tripod:{title:'TRI-POD 주요 입력',must:['현재 상태','목표 노출','NASDAQ 100','MA250','VIX / VIX10','52주 고점대비'],mustNot:['USD/KRW','WTI']},
            calendar:{title:'경제일정 주요 지표',must:['오늘 일정','향후 7일','다음 일정','다음 ★★★'],mustNot:['USD/KRW','WTI','미국 10Y']}
          };
          async function snapshot(page){return page.evaluate(()=>({
            title:document.querySelector('#latestBoardTitle')?.textContent?.trim()||'',
            labels:[...document.querySelectorAll('#latestBoardGrid .latestTileTop b')].map(e=>e.textContent.trim()),
            values:[...document.querySelectorAll('#latestBoardGrid .latestTile strong')].map(e=>e.textContent.trim()),
            width:document.documentElement.scrollWidth,inner:window.innerWidth,
            contract:window.__JJOONI_LATEST_BOARD?.contract||'',version:window.__JJOONI_LATEST_BOARD?.version||'',
            pulse:[...document.querySelectorAll('#pulse .chip')].map(e=>e.textContent.trim())
          }))}
          async function clickTab(page,tab,title){
            await page.locator(`#tabs button[data-tab="${tab}"]`).click();
            await page.waitForFunction(t=>document.querySelector('#latestBoardTitle')?.textContent?.trim()===t,title,{timeout:15000});
            await page.waitForTimeout(tab==='sectors'||tab==='calendar'?1200:250);
            return snapshot(page);
          }
          (async()=>{
            const browser=await chromium.launch({headless:true});
            let passed=false,last='';
            for(let attempt=1;attempt<=20&&!passed;attempt++){
              const page=await browser.newPage({viewport:{width:390,height:844}});
              const errors=[];page.on('pageerror',e=>errors.push(String(e)));
              try{
                await page.goto(process.env.URL+`?latest_board_e2e=${Date.now()}`,{waitUntil:'networkidle',timeout:120000});
                await page.waitForFunction(()=>window.__JJOONI_LATEST_BOARD?.version==='1.3',{timeout:15000});
                await page.waitForFunction(()=>document.querySelectorAll('#latestBoardGrid .latestTile').length>=21,{timeout:15000});
                let x=await snapshot(page);
                for(const k of ['KOSPI','KOSDAQ','S&P 500','NASDAQ 100','VIX','Fear & Greed','USD/KRW','미국 10Y','한국 10Y','WTI','Gold'])assert(x.labels.includes(k),`overview missing ${k}`);
                assert(x.title==='전체 시장 주요 지표',`overview title ${x.title}`);
                assert(x.contract==='TAB_SCOPED_LATEST_NUMERIC_TOP_BOARD_WITH_SOURCE_DATE',`contract ${x.contract}`);
                assert(x.version==='1.3',`version ${x.version}`);

                for(const [tab,cfg] of Object.entries(expected)){
                  x=await clickTab(page,tab,cfg.title);
                  for(const k of cfg.must)assert(x.labels.includes(k),`${tab} missing ${k}: ${x.labels.join(',')}`);
                  for(const k of cfg.mustNot)assert(!x.labels.includes(k),`${tab} leaked ${k}`);
                  assert(x.pulse.length>0,`${tab} pulse empty`);
                  assert(x.width<=x.inner+3,`${tab} mobile overflow ${x.width}>${x.inner}`);
                }
                assert(errors.length===0,`page errors ${errors.join(' | ')}`);
                console.log('LATEST_BOARD_TAB_SCOPING_E2E=PASS');
                passed=true;
              }catch(e){last=String(e);console.log(`LATEST_BOARD_E2E_RETRY attempt=${attempt} ${last}`)}
              await page.close();
              if(!passed)await sleep(15000);
            }
            await browser.close();
            assert(passed,`public tab-scoped latest board verification failed: ${last}`);
          })().catch(e=>{console.error(e);process.exit(1)});
          JS
