name: Market Observatory Freshness Panel

on:
  push:
    branches: [main]
    paths:
      - tools/build_observatory_freshness.py
      - tools/audit_observatory_data.py
      - tools/fedwatch_trade_calendar.py
      - market-observatory/freshness-core-v1.js
      - market-observatory/freshness-watchdog-v1.js
      - market-observatory/freshness-all-groups-v1.js
      - tests/observatory-crypto-freshness.test.cjs
      - market-observatory/data/watchdog-status.json
      - market-observatory/data/observatory.json
      - market-observatory/data/daily-market-pulse.json
      - public-market-daily.json
      - market-observatory/data/fed-watch.json
      - market-observatory/data/economic-calendar.json
      - market-observatory/data/sector-etf.json
      - market-observatory/data/official-macro.json
      - market-observatory/data/market-regime.json
      - .github/workflows/market-observatory-freshness-ui.yml
  workflow_run:
    workflows:
      - "Market Observatory Daily + Calendar"
      - "Market Observatory Cross-Market Freshness"
      - "Market Observatory Daily Pulse"
      - "Market Observatory FedWatch Matrix V2"
      - "Public Market + TRI-POD Daily Sidecar"
      - "Market Observatory Verified Calendar"
      - "Economic Calendar Light Refresh"
      - "Market Observatory Official Macro"
      - "Market Observatory Close Freshness Watchdog"
    types: [completed]
  pull_request:
    paths:
      - tools/build_observatory_freshness.py
      - market-observatory/freshness-core-v1.js
      - market-observatory/freshness-watchdog-v1.js
      - market-observatory/freshness-all-groups-v1.js
      - tests/observatory-status-core.test.cjs
      - tests/observatory-crypto-freshness.test.cjs
      - .github/workflows/market-observatory-freshness-ui.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: observatory-freshness-panel
  cancel-in-progress: false

jobs:
  refresh:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' || github.event.workflow_run.conclusion == 'failure' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || 'main' }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build full Observatory data audit
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile tools/fedwatch_trade_calendar.py tools/audit_observatory_data.py
          python tools/audit_observatory_data.py

      - name: Build consolidated freshness SSOT
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile tools/build_observatory_freshness.py
          python -m unittest discover -s tests -p 'test_observatory_freshness_status.py' -v
          python tools/build_observatory_freshness.py

      - name: Freshness and full-data audit acceptance
        shell: bash
        run: |
          set -euo pipefail
          node tests/observatory-crypto-freshness.test.cjs
          python - <<'PY'
          import json
          from pathlib import Path
          f=json.load(open('market-observatory/data/freshness-status.json'))
          a=json.load(open('market-observatory/data/data-audit.json'))
          w=json.load(open('market-observatory/data/watchdog-status.json'))
          html=Path('market-observatory/index.html').read_text(encoding='utf-8')
          js=Path('market-observatory/freshness-watchdog-v1.js').read_text(encoding='utf-8')
          alljs=Path('market-observatory/freshness-all-groups-v1.js').read_text(encoding='utf-8')
          assert f.get('schema')=='JJOONI_OBSERVATORY_FRESHNESS_STATUS_V2',f.get('schema')
          assert f.get('read_only') is True
          required=['market','kr_equity','us_supplement','energy','fx','metals','us_rates','kr_rates','jp_rates','crypto','pulse','fear_greed','fedwatch','tripod','sector','official_macro','calendar','audit']
          assert set(required).issubset((f.get('groups') or {}).keys()),set(required)-set((f.get('groups') or {}).keys())
          align=f.get('session_alignment') or {}
          assert align.get('observatory')
          assert 'pulse_aligned' in align and 'tripod_aligned' in align and 'us_supplement_aligned' in align,align
          assert a.get('schema')=='JJOONI_OBSERVATORY_DATA_AUDIT_V2',a.get('schema')
          assert a.get('read_only') is True
          assert int(a.get('critical_count') or 0)==0,a.get('issues')
          for name in ['core_us','us_supplement','kr_equity','fx','energy','metals','us_rates','kr_rates','jp_rates','crypto','sentiment','fedwatch']:
              assert name in (a.get('groups') or {}),name
          assert w.get('schema')=='JJOONI_OBSERVATORY_WATCHDOG_STATUS_V1',w
          assert w.get('manual_dispatch_supported') is True
          assert w.get('force_repair_supported') is True
          from tools.observatory_ui_assets import require_runtime
          require_runtime(html, 'freshness-watchdog-v1.js')
          require_runtime(html, 'freshness-all-groups-v1.js')
          for token in ['DATA FRESHNESS','점검 결과 보기','상태 다시 읽기','obsWatchAnalysis','INLINE_WATCHDOG_ANALYSIS_WITH_SOURCE_EVIDENCE_V2']:
              assert token in js,token
          for token in ['energy','fx','metals','us_rates','kr_rates','jp_rates','crypto','official_macro','ALL_MARKET_FAMILY_FRESHNESS_GRID_V1']:
              assert token in alljs,token
          print('OBSERVATORY_FRESHNESS_PANEL_ACCEPTANCE=PASS overall='+str(f.get('overall'))+' audit='+str(a.get('overall'))+' watchdog='+str(w.get('result')))
          PY
          git diff --exit-code -- market-observatory/index.html

      - name: Publish freshness and full-data audit SSOT
        if: ${{ github.event_name != 'pull_request' }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          python tools/publish_observatory_data.py \
            --message 'data(observatory): refresh freshness and full-data audit' \
            market-observatory/data/freshness-status.json \
            market-observatory/data/data-audit.json
