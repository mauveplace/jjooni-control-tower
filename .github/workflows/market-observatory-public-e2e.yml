name: Market Observatory Public Responsive E2E

on:
  push:
    branches: [main]
    paths:
      - market-observatory/index.html
      - market-observatory/observatory-v2.js
      - market-observatory/calendar-editor-v1.js
      - market-observatory/data/history-lite.json
      - market-observatory/data/calendar-manual-overrides.json
      - .github/workflows/market-observatory-public-e2e.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: market-observatory-public-responsive-e2e
  cancel-in-progress: true

jobs:
  public-responsive:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright Chromium
        run: |
          npm init -y >/dev/null 2>&1
          npm install --silent playwright@1.55.0
          npx playwright install --with-deps chromium >/dev/null
      - name: Wait for Pages and verify ranges + x-axis + calendar editor
        env:
          URL: https://mauveplace.github.io/jjooni-control-tower/market-observatory/
        run: |
          node <<'JS'
          const { chromium } = require('playwright');
          const assert=(v,m)=>{if(!v)throw new Error(m)};
          const sleep=ms=>new Promise(r=>setTimeout(r,ms));
          const yearFrom=s=>Number((String(s||'').match(/(\d{4})/)||[])[1]);
          (async()=>{
            const browser=await chromium.launch({headless:true});
            const cases=[{name:'phone',width:390,height:844},{name:'tablet',width:800,height:1280}];
            for(const tc of cases){
              let passed=false,last='';
              for(let attempt=1;attempt<=10&&!passed;attempt++){
                const page=await browser.newPage({viewport:{width:tc.width,height:tc.height}});
                const errors=[];page.on('pageerror',e=>errors.push(String(e)));
                try{
                  await page.goto(process.env.URL+`?public_e2e=${Date.now()}`,{waitUntil:'networkidle',timeout:120000});
                  await page.waitForFunction(()=>window.__JJOONI_OBSERVATORY_UI?.version==='2.8.0-yield-maturity-trends',{timeout:20000});
                  await page.waitForFunction(()=>window.__JJOONI_CALENDAR_EDITOR?.version==='1.1',{timeout:12000});
                  await page.waitForFunction(()=>typeof DATA!=='undefined'&&DATA?.history_loaded===true,{timeout:20000});
                  await page.waitForTimeout(1200);

                  const base=await page.evaluate(()=>({
                    innerWidth,
                    htmlWidth:document.documentElement.scrollWidth,
                    bodyWidth:document.body.scrollWidth,
                    version:window.__JJOONI_OBSERVATORY_UI?.version,
                    editor:window.__JJOONI_CALENDAR_EDITOR?.version,
                    historyLoaded:typeof DATA!=='undefined'&&DATA?.history_loaded===true,
                    cards:[...document.querySelectorAll('.card')].filter(x=>x.offsetParent!==null).map(x=>{const r=x.getBoundingClientRect();return{left:r.left,right:r.right}})
                  }));
                  assert(base.htmlWidth<=base.innerWidth+3,`${tc.name} html overflow ${base.htmlWidth}>${base.innerWidth}`);
                  assert(base.bodyWidth<=base.innerWidth+3,`${tc.name} body overflow ${base.bodyWidth}>${base.innerWidth}`);
                  assert(base.cards.every(r=>r.left>=-2&&r.right<=base.innerWidth+2),`${tc.name} card outside viewport`);
                  assert(base.historyLoaded,`${tc.name} history cache not loaded`);

                  async function checkRange(range,minStart,maxStart){
                    const sel=`.obsRange[data-for="marketChart"] button[data-range="${range}"]`;
                    await page.click(sel);
                    await page.waitForTimeout(350);
                    const x=await page.evaluate(()=>{
                      const cov=document.querySelector('[data-coverage="marketChart"]')?.textContent||'';
                      const ch=window.Chart?.getChart ? window.Chart.getChart(document.getElementById('marketChart')) : null;
                      return {
                        coverage:cov,
                        labels:(ch?.data?.labels||[]).length,
                        xDisplay:ch?.options?.scales?.x?.ticks?.display!==false,
                        tickLabels:(ch?.scales?.x?.ticks||[]).map(t=>String(t.label??'')).filter(Boolean)
                      };
                    });
                    const start=yearFrom(x.coverage);
                    assert(x.coverage.startsWith(range+' 표시 '),`${tc.name} ${range} coverage stale: ${x.coverage}`);
                    assert(start>=minStart&&start<=maxStart,`${tc.name} ${range} wrong start ${start}: ${x.coverage}`);
                    assert(x.labels>2,`${tc.name} ${range} too few chart labels: ${x.labels}`);
                    assert(x.xDisplay,`${tc.name} ${range} x axis hidden`);
                    assert(x.tickLabels.length>=2,`${tc.name} ${range} x tick labels missing: ${JSON.stringify(x.tickLabels)}`);
                    return x;
                  }

                  const y1=await checkRange('1Y',2025,2026);
                  const y10=await checkRange('10Y',2015,2017);
                  const y30=await checkRange('30Y',1996,1998);

                  await page.click('button[data-tab="rates"]');
                  await page.waitForTimeout(500);
                  const yieldTrend=await page.evaluate(()=> {
                    const ch=window.Chart?.getChart ? window.Chart.getChart(document.getElementById('usCurve')) : null;
                    const buttons=[...document.querySelectorAll('.obsRange[data-for="usCurve"] button[data-range]')].map(b=>b.dataset.range);
                    return {
                      title:document.querySelector('#usCurve')?.closest('.card')?.querySelector('h3')?.textContent||'',
                      datasets:(ch?.data?.datasets||[]).map(d=>d.label),
                      labels:(ch?.data?.labels||[]).length,
                      buttons
                    };
                  });
                  assert(yieldTrend.title.includes('미국 국채금리 추세'),`${tc.name} yield title invalid: ${yieldTrend.title}`);
                  for(const label of ['3개월물','2년물','10년물','30년물']) assert(yieldTrend.datasets.includes(label),`${tc.name} missing yield series ${label}: ${JSON.stringify(yieldTrend.datasets)}`);
                  for(const range of ['1M','3M','6M','1Y','3Y']) assert(yieldTrend.buttons.includes(range),`${tc.name} missing yield range ${range}: ${JSON.stringify(yieldTrend.buttons)}`);
                  assert(yieldTrend.labels>20,`${tc.name} yield trend has too few dates: ${yieldTrend.labels}`);
                  await page.click('.obsRange[data-for="usCurve"] button[data-range="3M"]');
                  await page.waitForTimeout(350);
                  const yield3m=await page.evaluate(()=>({
                    coverage:document.querySelector('[data-coverage="usCurve"]')?.textContent||'',
                    labels:(window.Chart?.getChart ? window.Chart.getChart(document.getElementById('usCurve'))?.data?.labels : [])||[]
                  }));
                  assert(yield3m.coverage.startsWith('3M 표시 '),`${tc.name} yield 3M control stale: ${yield3m.coverage}`);
                  assert(yield3m.labels.length>10,`${tc.name} yield 3M too few labels: ${yield3m.labels.length}`);

                  await page.click('button[data-tab="calendar"]');
                  await page.waitForTimeout(700);
                  const cal=await page.evaluate(()=>({
                    innerWidth,
                    htmlWidth:document.documentElement.scrollWidth,
                    text:document.querySelector('#events')?.innerText||'',
                    editButtons:document.querySelectorAll('#events .obsCalEditBtn').length,
                    seeded:[...document.querySelectorAll('#events .obsCalEditBtn.seeded')].length,
                    events:[...document.querySelectorAll('#calendar .event')].slice(0,10).map(x=>{const r=x.getBoundingClientRect();return{left:r.left,right:r.right}}),
                    metrics:[...document.querySelectorAll('#calendar .obsMetricRow')].slice(0,10).map(x=>{const r=x.getBoundingClientRect();return{left:r.left,right:r.right}})
                  }));
                  assert(cal.htmlWidth<=cal.innerWidth+3,`${tc.name} calendar overflow ${cal.htmlWidth}>${cal.innerWidth}`);
                  assert(cal.events.every(r=>r.left>=-2&&r.right<=cal.innerWidth+2),`${tc.name} event outside viewport`);
                  assert(cal.metrics.every(r=>r.left>=-2&&r.right<=cal.innerWidth+2),`${tc.name} metrics outside viewport`);
                  assert(cal.editButtons>0,`${tc.name} edit buttons missing`);
                  assert(cal.seeded>=3,`${tc.name} seeded override badges missing: ${cal.seeded}`);
                  for(const needle of ['JOLTS Job Openings','7.18M','7.33M','7.27M','Nonfarm Payrolls','162K']) assert(cal.text.includes(needle),`${tc.name} seeded value missing: ${needle}`);
                  const seededBtn=page.locator('#events .obsCalEditBtn.seeded').first();
                  await seededBtn.click();
                  await page.waitForSelector('#obsCalEditor.on',{timeout:5000});
                  const modal=await page.evaluate(()=>({
                    on:document.querySelector('#obsCalEditor')?.classList.contains('on'),
                    inputs:document.querySelectorAll('#obsCalEditor input[data-field]').length,
                    save:[...document.querySelectorAll('#obsCalEditor button')].some(b=>b.textContent.trim()==='저장'),
                    reset:[...document.querySelectorAll('#obsCalEditor button')].some(b=>b.textContent.includes('자동값 복원'))
                  }));
                  assert(modal.on&&modal.inputs>=3&&modal.save&&modal.reset,`${tc.name} editor modal invalid ${JSON.stringify(modal)}`);
                  assert(errors.length===0,`${tc.name} page errors ${errors.join(' | ')}`);
                  console.log(`OBS_PUBLIC_E2E=PASS ${tc.name} version=${base.version} 1Y="${y1.coverage}" 10Y="${y10.coverage}" 30Y="${y30.coverage}" ticks30=${y30.tickLabels.join(',')}`);
                  passed=true;
                }catch(e){last=String(e);console.log(`OBS_PUBLIC_E2E_RETRY ${tc.name} attempt=${attempt} ${last}`);}
                await page.close();
                if(!passed)await sleep(12000);
              }
              assert(passed,`${tc.name} public Pages verification failed: ${last}`);
            }
            await browser.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          JS
