name: Control Tower Architecture Contract
on:
  pull_request:
    paths: ['*.js', 'tools/**', '.github/workflows/**', 'tests/**']
  push:
    branches: [main]
    paths: ['*.js', 'tools/**', '.github/workflows/**', 'tests/**']
permissions:
  contents: read
concurrency:
  group: architecture-contract-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install -r tools/requirements-observatory.txt
      - run: python tools/audit_control_tower_architecture.py --check --output architecture-inventory.json
      - run: python -m unittest discover -s tests -p 'test_*.py'
      - run: node --test tests/*.test.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: control-tower-architecture-inventory
          path: architecture-inventory.json
