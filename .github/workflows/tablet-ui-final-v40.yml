name: Tablet UI Final V40

on:
  push:
    branches: [main]
    paths: ['.github/workflows/tablet-ui-final-v40.yml']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: tablet-ui-final-v40
  cancel-in-progress: true

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Apply tablet detection, Korean names, recent sort and readable blocks
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          def rep(path, old, new, label, count=1):
              p=Path(path); t=p.read_text(); c=t.count(old)
              if c!=count:
                  raise SystemExit(f'{label}: expected {count}, got {c}')
              p.write_text(t.replace(old,new,count))
              print(label+'=PASS')

          # A) Capture security names before LIVE refresh can replace static rows.
          p=Path('live-bridge.js'); t=p.read_text()
          marker="let TRADE_QUOTES={};\n"
          if 'STATIC_SECURITY_NAMES' not in t:
              block=r'''let TRADE_QUOTES={};
const STATIC_SECURITY_NAMES=(()=>{
 const m=new Map(),manual={
  '091170':'KODEX 은행',
  '418660':'TIGER 미국나스닥100레버리지(합성)',
  '006400':'삼성SDI',
  '005380':'현대차'
 };
 Object.entries(manual).forEach(([k,v])=>m.set(k,v));
 const seen=new WeakSet(),key=v=>{const s=sym(v);return /^\d{1,6}$/.test(s)?s.padStart(6,'0'):s};
 const walk=(v,d=0)=>{
  if(!v||typeof v!=='object'||d>9||seen.has(v))return;seen.add(v);
  if(!Array.isArray(v)){
   const raw=v.ticker??v.symbol??v.code??v.stock_code??v.pdno??v.product_code??v.isu_cd;
   const nm=String(v.name??v.stock_name??v.security_name??v.prdt_name??v.product_name??v.isu_nm??v.kor_name??'').trim();
   const k=key(raw);if(k&&nm&&key(nm)!==k&&!m.has(k))m.set(k,nm);
  }
  const xs=Array.isArray(v)?v:Object.values(v);for(const x of xs)walk(x,d+1);
 };
 try{if(typeof D!=='undefined')walk(D)}catch(_){}
 return m;
})();
window.__JJOONI_SECURITY_NAMES=Object.fromEntries(STATIC_SECURITY_NAMES);
'''
              if t.count(marker)!=1: raise SystemExit('STATIC_NAME_CACHE marker mismatch')
              t=t.replace(marker,block,1)
          old="const k=sym(ticker);if(!k)return '';\n try{"
          new="const k=sym(ticker);if(!k)return '';\n const sk=/^\\d{1,6}$/.test(k)?k.padStart(6,'0'):k;const cached=STATIC_SECURITY_NAMES.get(sk)||STATIC_SECURITY_NAMES.get(k);if(cached)return cached;\n try{"
          if old not in t: raise SystemExit('LEGACY_NAME_CACHE anchor missing')
          t=t.replace(old,new,1)
          p.write_text(t)
          print('STATIC_NAME_CACHE=PASS')
          print('LEGACY_NAME_CACHE=PASS')

          # B) Trade review: recent-first by default, robust tablet classification, global name cache fallback.
          p=Path('trade-review-v2.js'); t=p.read_text()
          if "sort:'error'" not in t: raise SystemExit('DEFAULT_SORT anchor missing')
          t=t.replace("sort:'error'","sort:'recent'",1)
          old="const touchTablet=()=>{const touch=(navigator.maxTouchPoints||0)>0||window.matchMedia('(pointer:coarse)').matches||document.documentElement.classList.contains('ctTouchTablet');return touch&&Math.min(window.innerWidth,window.innerHeight)>=600};"
          new="const touchTablet=()=>{const touch=(navigator.maxTouchPoints||0)>0||window.matchMedia('(pointer:coarse)').matches||document.documentElement.classList.contains('ctTouchTablet');const sw=Math.min(Number(window.screen?.width)||window.innerWidth,Number(window.screen?.height)||window.innerHeight);return touch&&(sw>=600||(window.innerWidth>=768&&window.innerHeight>=500))};"
          if old not in t: raise SystemExit('TRADE_TABLET_DETECT anchor missing')
          t=t.replace(old,new,1)
          old="function labelTicker(t){return String(t.name||t.stock_name||t.ticker||t.symbol||'UNKNOWN').trim()}"
          new="function labelTicker(t){const ticker=sym(t.ticker||t.symbol),raw=String(t.name||t.stock_name||'').trim();if(raw&&sym(raw)!==ticker)return raw;const names=window.__JJOONI_SECURITY_NAMES||{},mapped=String(names[ticker]||names[/^\\d{1,6}$/.test(ticker)?ticker.padStart(6,'0'):ticker]||'').trim();return mapped||ticker||raw||'UNKNOWN'}"
          if old not in t: raise SystemExit('TRADE_NAME_FALLBACK anchor missing')
          t=t.replace(old,new,1)
          p.write_text(t)
          print('DEFAULT_RECENT_SORT=PASS')
          print('TRADE_TABLET_DETECT=PASS')
          print('TRADE_NAME_FALLBACK=PASS')

          # C) Tablet stability: screen-based detection and a genuine typography floor for blocks/tables.
          p=Path('tablet-stability-v37.js'); t=p.read_text()
          t=t.replace("version:'37.2'","version:'37.3'",1)
          old="function isTablet(){\n  const touch=(navigator.maxTouchPoints||0)>0||window.matchMedia('(pointer:coarse)').matches||document.documentElement.classList.contains('ctTouchTablet');\n  return touch&&Math.min(window.innerWidth,window.innerHeight)>=600;\n}"
          new="function isTablet(){\n  const touch=(navigator.maxTouchPoints||0)>0||window.matchMedia('(pointer:coarse)').matches||document.documentElement.classList.contains('ctTouchTablet');\n  const sw=Math.min(Number(window.screen?.width)||window.innerWidth,Number(window.screen?.height)||window.innerHeight);\n  return touch&&(sw>=600||(window.innerWidth>=768&&window.innerHeight>=500));\n}"
          if old not in t: raise SystemExit('STABILITY_TABLET_DETECT anchor missing')
          t=t.replace(old,new,1)
          anchor='html.ctStableTabletV37 small{font-size:16px!important;line-height:1.45!important}\n'
          floor=r'''html.ctStableTabletV37 small{font-size:16px!important;line-height:1.45!important}
/* Tablet readability floor: override compact 8-11px rules inside cards, rows and tables. */
html.ctStableTabletV37 :is(.card,.ctOvHeroCell,.ctAcct,.ctWlCard,.ctWlRow,.ctTicker,.ctSleeve,.v2Kpi,.v2Account,.ctD8Kpi,.ctA8Card,.ctP8Card){font-size:18px!important;line-height:1.45!important}
html.ctStableTabletV37 :is(.ctOvLabel,.ctOvMini,.ctAcctName,.ctAcctNav,.ctAcctStats,.ctAcctStats span,.ctAcctStats b,.ctAttribRow,.ctBenchHeader,.ctBenchRow,.ctBenchRow b,.ctBenchBm small,.ctLossRow,.ctLossAccount,.ctActionWho,.ctActionState,.ctActionText,.ctWlMeta,.ctWlTicker,.ctWlTag){font-size:16px!important;line-height:1.45!important}
html.ctStableTabletV37 :is(.ctWlRow,.ctWlPrice,.ctWlRet,.ctWlRank){font-size:17px!important;line-height:1.4!important}
html.ctStableTabletV37 :is(.ctOvGrid h3,.ctOvMetaRow h2,.ctWlTitle){font-size:22px!important;line-height:1.3!important}
html.ctStableTabletV37 :is(table,thead,tbody,tr,td,th,.v2Table){font-size:16px!important;line-height:1.45!important}
html.ctStableTabletV37 :is(.card,.ctOvGrid,.ctWlCard,.v2Kpi,.v2Account) :is(p,li,label,small){font-size:16px!important;line-height:1.5!important}
'''
          if anchor not in t: raise SystemExit('TYPOGRAPHY_FLOOR anchor missing')
          t=t.replace(anchor,floor,1)
          p.write_text(t)
          print('STABILITY_TABLET_DETECT=PASS')
          print('BLOCK_TYPOGRAPHY_FLOOR=PASS')

          # D) Lock regression contract.
          p=Path('tests/tablet-stability-v37.test.cjs'); t=p.read_text()
          insert="""

test('Galaxy Tab landscape is classified from screen short-side even when browser viewport is compressed',()=>{
  assert.match(guard,/window\.screen\?\.width/);
  assert.match(guard,/sw>=600\|\|\(window\.innerWidth>=768&&window\.innerHeight>=500\)/);
  assert.match(trade,/sw>=600\|\|\(window\.innerWidth>=768&&window\.innerHeight>=500\)/);
});

test('trade review defaults to recent-first and resolves Korean names from persistent cache',()=>{
  assert.match(trade,/sort:'recent'/);
  assert.match(trade,/__JJOONI_SECURITY_NAMES/);
  assert.match(live,/STATIC_SECURITY_NAMES/);
  assert.match(live,/091170':'KODEX 은행/);
  assert.match(live,/418660':'TIGER 미국나스닥100레버리지\(합성\)'/);
});

test('tablet card and table typography has a 16px readability floor',()=>{
  assert.match(guard,/\.ctWlPrice,.ctWlRet/);
  assert.match(guard,/\.ctAttribRow/);
  assert.match(guard,/table,thead,tbody,tr,td,th/);
  assert.match(guard,/font-size:16px!important/);
});
"""
          if "Galaxy Tab landscape is classified" not in t:
              t=t.rstrip()+insert+'\n'
          p.write_text(t)
          print('REGRESSION_CONTRACT=PASS')
          PY

      - name: Full canonical and syntax acceptance
        shell: bash
        run: |
          set -euo pipefail
          node --check live-bridge.js
          node --check trade-review-v2.js
          node --check tablet-stability-v37.js
          node --test tests/*.test.cjs
          git diff --check

      - name: Commit V40 fixes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add live-bridge.js trade-review-v2.js tablet-stability-v37.js tests/tablet-stability-v37.test.cjs
          git diff --cached --check
          git commit -m 'fix: restore Toss Korean names recent-first and tablet readability'
          git push