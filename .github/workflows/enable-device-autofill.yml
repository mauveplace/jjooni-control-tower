name: Enable Control Tower Device Autofill

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/enable-device-autofill.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply device autofill patch
        run: python tools/patch_device_autofill.py
      - name: Commit autofill support
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Enable device password manager autofill for Control Tower'
          git push
