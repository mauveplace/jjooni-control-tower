name: BLS Verified Reference Period QA

on:
  pull_request:
    paths:
      - tools/official_bls_api.py
      - tests/test_bls_verified_release_period.py
      - .github/workflows/bls-verified-reference-period-qa.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reference-period-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify official BLS release identity and revision provenance (offline)
        run: |
          python -m py_compile tools/official_bls_api.py tests/test_bls_verified_release_period.py
          PYTHONPATH=tools python -m unittest discover -s tests -p test_bls_verified_release_period.py -v
