name: Market Observatory FedWatch Matrix V2

on:
  push:
    branches: [main]
    paths:
      - tools/collect_fedwatch_official.py
      - tests/test_fedwatch_official.py
      - market-observatory/data/fedwatch-official.json
      - tools/archive_fedwatch.py
      - tools/build_fed_watch_v2.py
      - tools/build_fed_watch.py
      - tools/fedwatch_core.py
      - tests/test_fed_watch_matrix.py
      - market-observatory/fed-watch-v1.js
      - .github/workflows/market-observatory-fedwatch-matrix-v2.yml
  pull_request:
    branches: [main]
    paths:
      - tools/collect_fedwatch_official.py
      - tests/test_fedwatch_official.py
      - tools/build_fed_watch_v2.py
      - tools/build_fed_watch.py
      - tools/fedwatch_core.py
      - tests/test_fed_watch_matrix.py
      - market-observatory/fed-watch-v1.js
      - .github/workflows/market-observatory-fedwatch-matrix-v2.yml
  schedule:
    # One daily observation at 17:15 ET; offset gate accepts delayed jobs too.
    - cron: '15 21 * * 1-5'
    - cron: '15 22 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: market-observatory-fedwatch-matrix-v2-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - id: gate
        name: Gate settlement refresh window
        shell: bash
        run: |
          set -euo pipefail
          should=true
          if [ "${{ github.event_name }}" = "schedule" ]; then
            offset="$(TZ=America/New_York date +%z)"
            expected="15 22 * * 1-5"
            if [ "$offset" = "-0400" ]; then expected="15 21 * * 1-5"; fi
            should=false
            if [ "${{ github.event.schedule }}" = "$expected" ]; then should=true; fi
            echo "FEDWATCH_DAILY_GATE offset=$offset should=$should"
          fi
          echo "should_run=$should" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        if: steps.gate.outputs.should_run == 'true'
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || 'main' }}

      - uses: actions/setup-python@v5
        if: steps.gate.outputs.should_run == 'true'
        with:
          python-version: '3.12'

      - name: Install FedWatch runtime
        if: steps.gate.outputs.should_run == 'true'
        run: python -m pip install --quiet -r tools/requirements-observatory.txt

      - name: Test conditional probability matrix
        if: steps.gate.outputs.should_run == 'true'
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile tools/fedwatch_core.py tools/build_fed_watch.py tools/build_fed_watch_v2.py tests/test_fed_watch_matrix.py
          python -m unittest tests.test_fed_watch_matrix tests.test_fedwatch_history tests.test_fedwatch_official -v

      - name: Build CME FedWatch full meeting matrix
        if: steps.gate.outputs.should_run == 'true'
        shell: bash
        run: |
          set -euo pipefail
          python tools/build_fed_watch_v2.py

      - name: Matrix acceptance
        if: steps.gate.outputs.should_run == 'true'
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from datetime import datetime
          from pathlib import Path
          from zoneinfo import ZoneInfo
          from tools.build_fed_watch_v2 import KNOWN_FOMC_MEETINGS, _required_official_horizon

          d=json.loads(Path('market-observatory/data/fed-watch.json').read_text(encoding='utf-8'))
          assert d.get('schema')=='JJOONI_FED_WATCH_V1'
          assert d.get('schema_revision')=='2.0'
          assert d.get('matrix_contract')=='CME_FEDWATCH_CONDITIONAL_MEETING_PROBABILITY_MATRIX_V2'
          assert d.get('read_only') is True and d.get('contains_account_data') is False
          assert d.get('freshness') in ['LIVE','LAGGING','STALE']
          assert len(d.get('target_ranges') or []) >= 2
          rows=d.get('meeting_probability_matrix') or []
          assert len(rows)==d['meeting_count']

          # Full-horizon guard: every still-upcoming known 2026-2027 official FOMC date
          # must be represented, so a rolling calendar cannot silently truncate the matrix.
          now_et=datetime.now(ZoneInfo('America/New_York'))
          expected=_required_official_horizon(KNOWN_FOMC_MEETINGS, now_et)
          actual={str(x.get('meeting_date')) for x in rows}
          if expected:
              missing=sorted(expected-actual)
              assert not missing,('MISSING_FOMC_HORIZON',missing,sorted(actual))

          tolerance=.002000001 if d.get('source_kind')=='CME_OFFICIAL_PUBLIC_TABLE' else .001
          for row in rows:
              probs=row.get('probabilities') or {}
              assert probs,row
              assert abs(sum(float(v) for v in probs.values())-1.0) < tolerance,(row.get('meeting_date'),sum(probs.values()))
              assert row.get('most_likely_target') in probs
              if d.get('source_kind')=='CME_OFFICIAL_PUBLIC_TABLE':
                  assert row.get('probability_basis')=='CME_PUBLISHED_ROUNDED_TABLE'
                  assert d.get('source_as_of_ct_display') and d.get('official_evidence')
              else:
                  assert abs(sum(float(x.get('probability',0)) for x in row.get('conditional_move_distribution') or [])-1.0) < 0.001
          assert abs(sum(float(x.get('probability',0)) for x in d.get('outcomes') or [])-1.0) < 0.001
          assert d.get('path_summary',{}).get('terminal_meeting_date')==rows[-1]['meeting_date']
          js=Path('market-observatory/fed-watch-v1.js').read_text(encoding='utf-8')
          for token in ['Conditional Meeting Probabilities','meeting_probability_matrix','change_1d_pp',"version:'2.0'",'hike_25bp_probability','change_1w_pctpt']:
              assert token in js,token
          print('FEDWATCH_MATRIX_V2_ACCEPTANCE=PASS')
          print('freshness=',d['freshness'])
          print('market_data_as_of=',d['market_data_as_of'])
          print('meetings=',d['meeting_count'])
          print('ranges=',len(d['target_ranges']))
          print('horizon_end=',rows[-1]['meeting_date'])
          PY

      - name: Publish FedWatch matrix
        if: steps.gate.outputs.should_run == 'true' && github.event_name != 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          python tools/publish_observatory_data.py --message 'data(observatory): refresh CME FedWatch meeting matrix v2' market-observatory/data/fed-watch.json market-observatory/data/fedwatch-official.json $(find market-observatory/data/fedwatch-history -type f | sort)

