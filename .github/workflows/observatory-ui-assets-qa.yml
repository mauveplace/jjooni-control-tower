name: Observatory UI Runtime Version Contract
on:
  pull_request:
    paths: ['tools/observatory_ui_assets.py', 'tests/test_observatory_ui_assets.py', '.github/workflows/observatory-ui-assets-qa.yml', '.github/workflows/market-observatory-sector-qa.yml', '.github/workflows/market-observatory-daily.yml', '.github/workflows/market-observatory-freshness-ui.yml']
  push:
    branches: [main]
    paths: ['tools/observatory_ui_assets.py', 'tests/test_observatory_ui_assets.py', '.github/workflows/observatory-ui-assets-qa.yml', '.github/workflows/market-observatory-sector-qa.yml', '.github/workflows/market-observatory-daily.yml', '.github/workflows/market-observatory-freshness-ui.yml']
permissions:
  contents: read
jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests -p test_observatory_ui_assets.py -v
