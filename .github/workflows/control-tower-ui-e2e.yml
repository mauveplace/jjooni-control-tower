name: Control Tower Mobile First UI
on:
  pull_request:
    paths: ['*.js', '*.css', 'index.html', 'tests/mobile-first-ui-e2e.cjs', '.github/workflows/control-tower-ui-e2e.yml']
  push:
    branches: [main]
    paths: ['*.js', '*.css', 'index.html', 'tests/mobile-first-ui-e2e.cjs', '.github/workflows/control-tower-ui-e2e.yml']
permissions:
  contents: read
concurrency:
  group: ct-ui-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  responsive:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --no-package-lock playwright@1.55.0
      - run: npx playwright install --with-deps chromium
      - run: node --test tests/*.test.cjs
      - run: node tests/mobile-first-ui-e2e.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: synthetic-mobile-tablet-desktop
          path: /tmp/ct-ui-*.png
