name: PB Toss On-Demand Sync

on:
  push:
    branches: [main]
    paths:
      - sync-requests/pb-toss-sync.request
      - .github/workflows/pb-toss-sync.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Probe read-only Toss relay endpoints
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import urllib.request, urllib.error
          bases=[
            'https://jjooni-toss-relay-apgynr7pea-du.a.run.app',
            'https://jjooni-ct-fast-apgynr7pea-du.a.run.app',
          ]
          paths=['/health','/healthz','/snapshot','/api/pb/toss-live','/holdings','/trades','/buying-power','/fast.json']
          for base in bases:
              print('BASE='+base)
              for path in paths:
                  req=urllib.request.Request(base+path,method='GET',headers={'User-Agent':'jjooni-pb-probe/1.0'})
                  try:
                      with urllib.request.urlopen(req,timeout=15) as r:
                          body=r.read(256)
                          print(f'PROBE {path} HTTP_{r.status} CT={r.headers.get("content-type","")} LEN_PREFIX={len(body)}')
                  except urllib.error.HTTPError as e:
                      print(f'PROBE {path} HTTP_{e.code}')
                  except Exception as e:
                      print(f'PROBE {path} ERR_{type(e).__name__}')
          PY
