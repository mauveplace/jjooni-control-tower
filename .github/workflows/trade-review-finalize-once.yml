name: Finalize Trade Review Once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/trade-review-finalize-once.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Finalize mobile nav, trade-review ownership, and direct loader
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          # 1) Make ui-refactor agree with the final 4+More navigation contract.
          p=Path('ui-refactor.js')
          s=p.read_text(encoding='utf-8')
          reps={
            "const PRIMARY_TABS=['overview','portfolio','compare','ai','accounts'];":"const PRIMARY_TABS=['overview','trades','portfolio','accounts'];",
            "const SECONDARY_TABS=['tripod','decisions','trades','quality','watchlist','cost'];":"const SECONDARY_TABS=['compare','ai','tripod','decisions','quality','watchlist','cost'];",
            "grid-template-columns:repeat(6,minmax(0,1fr))":"grid-template-columns:repeat(5,minmax(0,1fr))",
            '.tabs>.tab[data-tab="overview"],.tabs>.tab[data-tab="portfolio"],.tabs>.tab[data-tab="compare"],.tabs>.tab[data-tab="ai"],.tabs>.tab[data-tab="accounts"]{display:flex!important}':'.tabs>.tab[data-tab="overview"],.tabs>.tab[data-tab="trades"],.tabs>.tab[data-tab="portfolio"],.tabs>.tab[data-tab="accounts"]{display:flex!important}',
            "const labels={tripod:'TRI-POD',decisions:'의사결정',trades:'거래내역',quality:'데이터품질',watchlist:'시황/워치',cost:'COST'};":"const labels={compare:'성과분석',ai:'AI BOT',tripod:'TRI-POD',decisions:'의사결정',quality:'데이터품질',watchlist:'시황/워치',cost:'COST'};",
            "version:'1.3',mobile_nav:'5_PLUS_MORE'":"version:'1.4',mobile_nav:'4_PLUS_MORE'",
          }
          for old,new in reps.items():
            if old in s:
              s=s.replace(old,new,1)
            elif new not in s:
              raise SystemExit('UI_REFACTOR_PATTERN_NOT_FOUND:'+old[:80])
          old="function paginateTrades(){\n if(!mobile())return;"
          new="function paginateTrades(){\n if(qs('#ctTradeReviewV2')){resetTradeState();window.__JJOONI_TRADE_PAGINATION={state:'SUPERSEDED_BY_TRADE_REVIEW_V2'};return;}\n if(!mobile())return;"
          if old in s:
            s=s.replace(old,new,1)
          elif 'SUPERSEDED_BY_TRADE_REVIEW_V2' not in s:
            raise SystemExit('PAGINATION_SUPERSEDE_PATTERN_NOT_FOUND')
          p.write_text(s,encoding='utf-8')

          # 2) Remove UI ownership from freshness bridge.
          p=Path('market-state-bridge.js')
          s=p.read_text(encoding='utf-8')
          marker="(function(){\n if(document.getElementById('ctTradeReviewLoaderScript'))return;"
          start=s.find(marker)
          if start>=0:
            end=s.find("\n})();",start)
            if end<0: raise SystemExit('TRADE_REVIEW_LOADER_BLOCK_END_NOT_FOUND')
            s=s[:start]+s[end+6:]
          if 'ctTradeReviewLoaderScript' in s:
            raise SystemExit('TRADE_REVIEW_LOADER_STILL_IN_FRESHNESS_BRIDGE')
          p.write_text(s,encoding='utf-8')

          # 3) Load trade review from the encrypted shell postfix, after decryption.
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          start=s.find('const CT_POSTFIX=')
          end=s.find('\nasync function openTower',start)
          if start<0 or end<0: raise SystemExit('CT_POSTFIX_NOT_FOUND')
          chunk=s[start:end]
          if 'trade-review-loader.js' not in chunk:
            needle=r'<\/script>`;'
            replacement=r'<\/script><script src="trade-review-loader.js?v=3"><\/script>`;'
            if needle not in chunk: raise SystemExit('CT_POSTFIX_CLOSE_NOT_FOUND')
            chunk=chunk.replace(needle,replacement,1)
            s=s[:start]+chunk+s[end:]
          p.write_text(s,encoding='utf-8')

          # Assertions: final integration contract.
          ui=Path('ui-refactor.js').read_text(encoding='utf-8')
          ms=Path('market-state-bridge.js').read_text(encoding='utf-8')
          ix=Path('index.html').read_text(encoding='utf-8')
          assert "PRIMARY_TABS=['overview','trades','portfolio','accounts']" in ui
          assert "SECONDARY_TABS=['compare','ai','tripod','decisions','quality','watchlist','cost']" in ui
          assert 'SUPERSEDED_BY_TRADE_REVIEW_V2' in ui
          assert 'ctTradeReviewLoaderScript' not in ms
          assert 'trade-review-loader.js?v=3' in ix
          print('FINALIZE_ASSERTIONS_OK')
          PY

      - name: Commit patch and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/trade-review-finalize-once.yml
          git add ui-refactor.js market-state-bridge.js index.html
          git commit -m 'Finalize trade review integration and mobile nav'
          git push
