name: Market Observatory Daily Pulse

on:
  push:
    branches: [main]
    paths:
      - tools/build_daily_market_pulse.py
      - tools/build_public_market_daily.py
      - market-observatory/data/daily-market-pulse.json
      - market-observatory/data/morning-brief-contract.json
      - market-observatory/data/ai-read-contract.json
      - .github/workflows/market-observatory-daily-pulse.yml
  pull_request:
    paths:
      - tools/build_daily_market_pulse.py
      - market-observatory/data/daily-market-pulse.json
      - market-observatory/data/morning-brief-contract.json
      - market-observatory/data/ai-read-contract.json
      - .github/workflows/market-observatory-daily-pulse.yml
  workflow_run:
    workflows:
      - "Market Observatory Daily + Calendar"
      - "Public Market + TRI-POD Daily Sidecar"
    types: [completed]
  schedule:
    # Single FINAL capture at US regular-session close +10m.
    # Sunday ET refresh uses the last completed US trading session for Monday KST briefing.
    # US DST: 16:10 ET = 05:10 KST next day.
    # Sunday ET candidate intentionally supplies Monday KST brief from the last completed Friday session.
    - cron: '10 20 * * 0-5'
    # US standard time: 16:10 ET = 06:10 KST next day.
    - cron: '10 21 * * 0-5'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: market-observatory-daily-pulse
  cancel-in-progress: false

jobs:
  pulse:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - id: gate
        name: Resolve DST-aware US-close phase
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          SCHEDULE: ${{ github.event.schedule }}
          WORKFLOW_RUN_CONCLUSION: ${{ github.event.workflow_run.conclusion }}

        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import os, json
          from pathlib import Path
          from datetime import datetime, timezone
          from zoneinfo import ZoneInfo

          event=os.environ.get("EVENT_NAME","")
          sched=os.environ.get("SCHEDULE","")
          if event in {"push","pull_request","workflow_dispatch"}:
              print("run=true")
              print("phase=FINAL")
              raise SystemExit

          now_et=datetime.now(timezone.utc).astimezone(ZoneInfo("America/New_York"))
          if event == "workflow_run":
              def read(path):
                  try: return json.loads(Path(path).read_text(encoding="utf-8"))
                  except (OSError, ValueError): return {}
              obs=read("market-observatory/data/observatory.json")
              pulse=read("market-observatory/data/daily-market-pulse.json")
              public=read("public-market-daily.json")
              session=obs.get("us_completed_session_date")
              source_session=(public.get("tripod_signal") or {}).get("date")
              # Catch delayed close jobs after 17 ET without creating a publish loop.
              ok=(os.environ.get("WORKFLOW_RUN_CONCLUSION","")=="success"
                  and bool(session) and (not source_session or session >= source_session)
                  and (pulse.get("market_date_us") != session or pulse.get("snapshot_status") != "FINAL"))
              print("run="+("true" if ok else "false"))
              print("phase=FINAL")
              print("ny_now="+now_et.isoformat())
              raise SystemExit
          expected_hour=20 if now_et.utcoffset().total_seconds()==-4*3600 else 21
          parts=sched.split()
          minute=int(parts[0]) if parts else -1
          hour=int(parts[1]) if len(parts)>1 else -1
          ok=(hour==expected_hour and minute==10)
          print("run="+("true" if ok else "false"))
          print("phase=FINAL")
          print("ny_now="+now_et.isoformat())
          PY

      - name: Build Daily Market Pulse + TRI-POD
        if: steps.gate.outputs.run == 'true'
        env:
          PULSE_PHASE: ${{ steps.gate.outputs.phase }}
        run: |
          set -euo pipefail
          python -m py_compile tools/build_daily_market_pulse.py tools/build_public_market_daily.py
          python tools/build_daily_market_pulse.py
          # TRI-POD must be generated in the same US-close cycle as the Market Pulse.
          # This removes reliance on the separately scheduled sidecar job, which can
          # be delayed by GitHub Actions scheduling.
          python tools/build_public_market_daily.py

      - name: Acceptance contract
        if: steps.gate.outputs.run == 'true'
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          p=json.loads(Path("market-observatory/data/daily-market-pulse.json").read_text(encoding="utf-8"))
          t=json.loads(Path("public-market-daily.json").read_text(encoding="utf-8"))
          c=json.loads(Path("market-observatory/data/morning-brief-contract.json").read_text(encoding="utf-8"))
          a=json.loads(Path("market-observatory/data/ai-read-contract.json").read_text(encoding="utf-8"))

          assert p["schema"]=="JJOONI_DAILY_MARKET_PULSE_V1"
          assert p["read_only"] is True and p["contains_account_data"] is False
          assert p["snapshot_status"]=="FINAL"
          assert p["quality"]["missing_value_policy"]=="NULL_NOT_ESTIMATE"
          assert p["usage_contract"]["autobot_direct_trade_trigger"] is False
          assert p["usage_contract"]["morning_brief_required_web_verification"] is True

          # TRI-POD and Observatory must describe the same latest completed US session.
          assert t["schema"]=="JJOONI_PUBLIC_MARKET_DAILY_V1"
          assert t["read_only"] is True and t["contains_account_data"] is False
          sig=t.get("tripod_signal") or {}
          assert sig.get("ok") is True, sig
          assert sig.get("source")=="PUBLIC_MARKET_DAILY_V1", sig
          assert sig.get("vix_basis")=="LAST_10_DAILY_CLOSES_ARITHMETIC_MEAN", sig
          assert int(sig.get("vix_window_count") or 0)==10, sig
          assert sig.get("data_alignment")=="NDX_VIX_SAME_COMPLETED_SESSION", sig
          assert sig.get("date")==p.get("market_date_us"), (sig.get("date"),p.get("market_date_us"))

          assert c["schema"]=="JJOONI_MORNING_MARKET_BRIEF_CONTRACT_V1"
          assert len(c["required_sections"])==8
          assert [x["order"] for x in c["required_sections"]]==list(range(1,9))
          assert c["freshness_policy"]["closed_market_rule"]
          assert c["fact_boundary"]["no_fabrication"] is True
          source_keys=[x["key"] for x in c["source_priority"]]
          for key in ["finviz_sp500_map","finviz_calendar","tradingview","slickcharts_nasdaq100","cnn_fear_greed"]:
              assert key in source_keys
              assert key in p["sources"]
              assert p["sources"][key]["url"].startswith("http")

          reads={x.get("path"):x for x in a.get("required_reads",[])}
          assert "./daily-market-pulse.json" in reads and reads["./daily-market-pulse.json"].get("required") is True
          assert "./morning-brief-contract.json" in reads and reads["./morning-brief-contract.json"].get("required") is True

          print("DAILY_MARKET_PULSE_ACCEPTANCE=PASS")
          print("market_date_us=",p.get("market_date_us"))
          print("tripod_date=",sig.get("date"),"target=",sig.get("target"),"vix10=",sig.get("vix10"))
          print("source_status=",p["quality"]["source_status"])
          PY

      - name: Publish Daily Market Pulse
        if: steps.gate.outputs.run == 'true' && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || github.event_name == 'workflow_run' || (github.event_name == 'push' && contains(github.event.head_commit.message, '[force-market-pulse-refresh]')))
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          python tools/publish_observatory_data.py --message 'data(observatory): refresh daily market pulse and TRI-POD' market-observatory/data/daily-market-pulse.json public-market-daily.json
