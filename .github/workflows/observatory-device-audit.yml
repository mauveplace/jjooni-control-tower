name: Observatory Device Audit
on:
  push:
    branches: [main]
    paths: ['market-observatory/**', 'tests/observatory-device-audit.cjs', '.github/workflows/observatory-device-audit.yml']
  pull_request:
    branches: [main]
    paths: ['market-observatory/**', 'tests/observatory-device-audit.cjs', '.github/workflows/observatory-device-audit.yml']
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save playwright@1.55.0 && npx playwright install --with-deps chromium
      - run: python3 -m http.server 8123 >/tmp/obs-http.log 2>&1 &
      - run: node --test tests/observatory-display-contract.test.cjs
      - run: node tests/observatory-device-audit.cjs
