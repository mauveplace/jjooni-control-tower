name: Market Observatory Close Freshness Watchdog

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/market-observatory-close-watchdog.yml
      - tools/write_observatory_watchdog_status.py
      - tools/build_observatory_freshness.py
  workflow_run:
    workflows:
      - "Market Observatory Daily + Calendar"
    types: [completed]
  schedule:
    # Independent close candidates. GitHub cron can start late, so the runtime gate
    # intentionally accepts a broad 16:10-17:05 America/New_York recovery window.
    # Both UTC hours are registered for DST/standard-time safety; the runtime gate
    # rejects the wrong local-hour candidate.
    - cron: '10,20,35,50 20,21 * * 0-5'
  workflow_dispatch:
    inputs:
      force_repair:
        description: 'Force one canonical rebuild even when the freshness gate is healthy'
        required: false
        default: false
        type: boolean

permissions:
  contents: write

# Share the writer lock with the canonical Observatory workflow. If the primary
# close build is still running, this watchdog waits, checks main again, and exits
# without duplicate publication when everything is already fresh.
concurrency:
  group: economic-calendar-canonical-writer
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - id: gate
        name: Delay-tolerant close freshness gate
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          FORCE_REPAIR: ${{ github.event.inputs.force_repair || 'false' }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          from datetime import datetime, time
          from pathlib import Path
          from zoneinfo import ZoneInfo

          ET=ZoneInfo('America/New_York')
          event=os.environ.get('EVENT_NAME','')
          force_repair=str(os.environ.get('FORCE_REPAIR','false')).lower()=='true'
          now=datetime.now(ET)

          # A delayed cron must still run. The old exact-16:10 wall-clock gate could
          # silently skip a valid scheduled run when GitHub assigned a runner late.
          in_close_window = time(16,10) <= now.time().replace(tzinfo=None) <= time(17,5)
          if event == 'workflow_dispatch':
              eligible=True
          elif event == 'push':
              # Code pushes validate/report the watchdog contract but must never
              # launch a heavy market-data repair merely because today's 16:10 ET
              # close anchor is still in the future. Real repair authority belongs
              # to manual dispatch, the close schedule, and the canonical Daily
              # workflow completion heartbeat.
              eligible=False
          else:
              eligible=in_close_window

          obs_path=Path('market-observatory/data/observatory.json')
          pulse_path=Path('market-observatory/data/daily-market-pulse.json')
          public_path=Path('public-market-daily.json')

          def load(path):
              try:
                  return json.loads(path.read_text(encoding='utf-8'))
              except Exception:
                  return {}

          def parsed(value):
              try:
                  dt=datetime.fromisoformat(str(value or ''))
                  if dt.tzinfo is None:
                      dt=dt.replace(tzinfo=ET)
                  return dt.astimezone(ET)
              except Exception:
                  return None

          obs=load(obs_path)
          pulse=load(pulse_path)
          public=load(public_path)
          obs_dt=parsed(obs.get('generated_kst'))
          pulse_dt=parsed(pulse.get('generated_kst'))
          public_dt=parsed(public.get('generated_kst'))
          anchor=datetime.combine(now.date(), time(16,10), ET)

          # Freshness is event-cycle based rather than market-date==today so US
          # holidays and Sunday-ET Monday-KST briefs remain valid.
          obs_fresh=bool(obs_dt and obs_dt >= anchor)
          pulse_fresh=bool(pulse_dt and pulse_dt >= anchor)
          public_fresh=bool(public_dt and public_dt >= anchor)
          aligned=bool(
              obs.get('us_completed_session_date') and
              pulse.get('market_date_us') == obs.get('us_completed_session_date') and
              ((public.get('tripod_signal') or {}).get('date') == obs.get('us_completed_session_date'))
          )
          healthy=obs_fresh and pulse_fresh and public_fresh and aligned
          should_repair=eligible and (force_repair or not healthy)

          outputs={
              'eligible': 'true' if eligible else 'false',
              'force_repair': 'true' if force_repair else 'false',
              'should_repair': 'true' if should_repair else 'false',
              'ny_now': now.isoformat(),
              'obs_fresh': str(obs_fresh).lower(),
              'pulse_fresh': str(pulse_fresh).lower(),
              'public_fresh': str(public_fresh).lower(),
              'aligned': str(aligned).lower(),
          }
          with open(os.environ['GITHUB_OUTPUT'],'a',encoding='utf-8') as fh:
              for key,value in outputs.items():
                  fh.write(f'{key}={value}\n')

          print('WATCHDOG_STATE', json.dumps({
              'event': event,
              'ny_now': now.isoformat(),
              'eligible': eligible,
              'force_repair': force_repair,
              'anchor': anchor.isoformat(),
              'obs_generated': obs.get('generated_kst'),
              'pulse_generated': pulse.get('generated_kst'),
              'public_generated': public.get('generated_kst'),
              'obs_session': obs.get('us_completed_session_date'),
              'pulse_session': pulse.get('market_date_us'),
              'tripod_session': (public.get('tripod_signal') or {}).get('date'),
              'healthy': healthy,
              'should_repair': should_repair,
          }, ensure_ascii=False))
          PY

      - name: Install Observatory runtime
        if: steps.gate.outputs.should_repair == 'true'
        run: |
          set -euo pipefail
          python -m pip install --quiet -r tools/requirements-observatory.txt

      - id: rebuild
        name: Rebuild canonical Observatory + Daily Pulse + TRI-POD
        if: steps.gate.outputs.should_repair == 'true'
        env:
          BOK_ECOS_API_KEY: ${{ secrets.BOK_ECOS_API_KEY || 'sample' }}
        shell: bash
        run: |
          set -euo pipefail
          cp market-observatory/data/economic-calendar.json /tmp/economic-calendar.json
          python -m py_compile \
            tools/build_market_observatory.py \
            tools/postprocess_market_observatory.py \
            tools/backfill_market_history_30y.py \
            tools/add_observatory_equities.py \
            tools/build_observatory_sector_etf.py \
            tools/build_daily_market_pulse.py \
            tools/build_public_market_daily.py \
            tools/build_observatory_freshness.py
          python tools/build_market_observatory.py
          python tools/postprocess_market_observatory.py
          cp /tmp/economic-calendar.json market-observatory/data/economic-calendar.json
          python tools/backfill_market_history_30y.py
          python tools/add_observatory_equities.py
          python tools/build_observatory_sector_etf.py
          python tools/build_daily_market_pulse.py
          python tools/build_public_market_daily.py
          python tools/build_observatory_freshness.py

      - id: recovery_acceptance
        name: Recovery acceptance contract
        if: steps.gate.outputs.should_repair == 'true'
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from datetime import datetime, timezone

          o=json.load(open('market-observatory/data/observatory.json'))
          p=json.load(open('market-observatory/data/daily-market-pulse.json'))
          t=json.load(open('public-market-daily.json'))
          f=json.load(open('market-observatory/data/freshness-status.json'))

          for obj,name in [(o,'observatory'),(p,'pulse'),(t,'public'),(f,'freshness')]:
              dt=datetime.fromisoformat(obj['generated_kst'])
              age=(datetime.now(timezone.utc)-dt.astimezone(timezone.utc)).total_seconds()/60
              assert age < 12,(name,age,obj.get('generated_kst'))

          assert o['schema']=='JJOONI_MARKET_OBSERVATORY_V1'
          assert o.get('us_completed_session_date')
          us_dates={k:str((o.get('series',{}).get(k) or [{}])[-1].get('date',''))[:10] for k in ['NASDAQ100','SP500','VIX']}
          assert all(us_dates.values()),us_dates
          assert len(set(us_dates.values()))==1,us_dates
          assert o.get('us_completed_session_date')==next(iter(set(us_dates.values()))),us_dates

          assert p['schema']=='JJOONI_DAILY_MARKET_PULSE_V1'
          assert p.get('snapshot_status')=='FINAL'
          assert p.get('market_date_us')==o.get('us_completed_session_date'),(p.get('market_date_us'),o.get('us_completed_session_date'))

          sig=t.get('tripod_signal') or {}
          assert t['schema']=='JJOONI_PUBLIC_MARKET_DAILY_V1'
          assert sig.get('ok') is True,sig
          assert sig.get('date')==o.get('us_completed_session_date'),(sig.get('date'),o.get('us_completed_session_date'))
          assert sig.get('vix_basis')=='LAST_10_DAILY_CLOSES_ARITHMETIC_MEAN',sig
          assert int(sig.get('vix_window_count') or 0)==10,sig

          assert f.get('schema')=='JJOONI_OBSERVATORY_FRESHNESS_STATUS_V1',f
          assert (f.get('session_alignment') or {}).get('aligned') is True,f
          assert (f.get('groups') or {}).get('tripod',{}).get('state')=='LIVE',f

          print('OBSERVATORY_CLOSE_WATCHDOG_ACCEPTANCE=PASS')
          print('session=',o.get('us_completed_session_date'))
          print('generated=',o.get('generated_kst'),p.get('generated_kst'),t.get('generated_kst'))
          print('freshness=',f.get('overall'))
          PY

      - id: publish_repair
        name: Publish repaired SSOT atomically
        if: steps.gate.outputs.should_repair == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          python tools/publish_observatory_data.py \
            --message 'data(observatory): close watchdog self-heal' \
            market-observatory/data/observatory.json \
            market-observatory/data/history-30y.json \
            market-observatory/data/sector-etf.json \
            market-observatory/data/daily-market-pulse.json \
            market-observatory/data/freshness-status.json \
            public-market-daily.json

      - id: verify_repair
        name: Verify published main SSOT
        if: steps.gate.outputs.should_repair == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          python - <<'PY'
          import json, subprocess

          def from_main(path):
              raw=subprocess.check_output(['git','show','origin/main:'+path],text=True)
              return json.loads(raw)

          o=from_main('market-observatory/data/observatory.json')
          p=from_main('market-observatory/data/daily-market-pulse.json')
          t=from_main('public-market-daily.json')
          f=from_main('market-observatory/data/freshness-status.json')
          assert p.get('market_date_us')==o.get('us_completed_session_date')
          assert (t.get('tripod_signal') or {}).get('date')==o.get('us_completed_session_date')
          assert (f.get('session_alignment') or {}).get('aligned') is True
          print('OBSERVATORY_CLOSE_WATCHDOG_PUBLISH_VERIFY=PASS session='+str(o.get('us_completed_session_date')))
          PY

      - name: Healthy no-op
        if: steps.gate.outputs.should_repair != 'true'
        run: |
          echo "OBSERVATORY_CLOSE_WATCHDOG=NOOP"
          echo "eligible=${{ steps.gate.outputs.eligible }}"
          echo "force_repair=${{ steps.gate.outputs.force_repair }}"
          echo "ny_now=${{ steps.gate.outputs.ny_now }}"
          echo "obs_fresh=${{ steps.gate.outputs.obs_fresh }} pulse_fresh=${{ steps.gate.outputs.pulse_fresh }} public_fresh=${{ steps.gate.outputs.public_fresh }} aligned=${{ steps.gate.outputs.aligned }}"

      - name: Write observable watchdog status
        if: always()
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          ELIGIBLE: ${{ steps.gate.outputs.eligible }}
          FORCE_REPAIR: ${{ steps.gate.outputs.force_repair }}
          SHOULD_REPAIR: ${{ steps.gate.outputs.should_repair }}
          NY_NOW: ${{ steps.gate.outputs.ny_now }}
          OBS_FRESH: ${{ steps.gate.outputs.obs_fresh }}
          PULSE_FRESH: ${{ steps.gate.outputs.pulse_fresh }}
          PUBLIC_FRESH: ${{ steps.gate.outputs.public_fresh }}
          ALIGNED: ${{ steps.gate.outputs.aligned }}
          JOB_STATUS: ${{ job.status }}
          REBUILD_OUTCOME: ${{ steps.rebuild.outcome }}
          ACCEPTANCE_OUTCOME: ${{ steps.recovery_acceptance.outcome }}
          PUBLISH_OUTCOME: ${{ steps.publish_repair.outcome }}
          VERIFY_OUTCOME: ${{ steps.verify_repair.outcome }}
        run: |
          set -euo pipefail
          # Failed repair steps may leave generated files dirty. The status commit must
          # report the failure without accidentally publishing those partial snapshots.
          git reset --hard HEAD
          python tools/write_observatory_watchdog_status.py

      - name: Publish watchdog status
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          python tools/publish_observatory_data.py \
            --message 'data(observatory): watchdog status' \
            market-observatory/data/watchdog-status.json
