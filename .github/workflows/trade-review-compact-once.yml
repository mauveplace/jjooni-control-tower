name: Compact Trade Review Once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/trade-review-compact-once.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Make level-one ticker cards true one-line rows and equal-width nav
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p=Path('trade-review-v2.js')
          s=p.read_text(encoding='utf-8')
          reps={
            '.tabs{display:grid!important;grid-template-columns:repeat(5,minmax(0,1fr))!important;gap:3px!important;height:56px!important;overflow:visible!important}':'html.ctTouchTablet .tabs,html .tabs,.tabs{display:grid!important;grid-template-columns:repeat(5,minmax(0,1fr))!important;gap:3px!important;height:56px!important;overflow:visible!important}',
            '.tabs>.tab[data-tab]{display:none!important;font-size:11px!important;min-width:0!important;width:auto!important;height:48px!important;padding:4px 3px!important}':'html.ctTouchTablet .tabs>.tab[data-tab],html .tabs>.tab[data-tab],.tabs>.tab[data-tab]{display:none!important;font-size:11px!important;min-width:0!important;width:auto!important;height:48px!important;padding:4px 3px!important;flex:none!important}',
            '.tabs>.tab[data-tab="overview"]{display:flex!important;order:1}.tabs>.tab[data-tab="trades"]{display:flex!important;order:2}.tabs>.tab[data-tab="portfolio"]{display:flex!important;order:3}.tabs>.tab[data-tab="accounts"]{display:flex!important;order:4}#ctMoreTab{display:flex!important;order:5;font-size:11px!important;align-items:center;justify-content:center}':'html.ctTouchTablet .tabs>.tab[data-tab="overview"],.tabs>.tab[data-tab="overview"]{display:flex!important;order:1}html.ctTouchTablet .tabs>.tab[data-tab="trades"],.tabs>.tab[data-tab="trades"]{display:flex!important;order:2}html.ctTouchTablet .tabs>.tab[data-tab="portfolio"],.tabs>.tab[data-tab="portfolio"]{display:flex!important;order:3}html.ctTouchTablet .tabs>.tab[data-tab="accounts"],.tabs>.tab[data-tab="accounts"]{display:flex!important;order:4}#ctMoreTab{display:flex!important;order:5;font-size:11px!important;align-items:center;justify-content:center;min-width:0!important;width:auto!important;height:48px!important}',
            '.ctTicker{background:#fff;border:1px solid #e5eaf0;border-radius:14px;margin-bottom:8px;overflow:hidden;box-shadow:0 6px 16px rgba(12,31,54,.04)}':'.ctTicker{background:#fff;border:1px solid #e5eaf0;border-radius:11px;margin-bottom:5px;overflow:hidden;box-shadow:0 4px 12px rgba(12,31,54,.035)}',
            '.ctTickerHead{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;padding:11px;align-items:center;cursor:pointer}':'.ctTickerHead{display:grid;grid-template-columns:minmax(72px,1fr) auto;gap:6px;padding:6px 9px;min-height:38px;align-items:center;cursor:pointer}',
            '.ctTickerName{font-size:14px;font-weight:900;color:#101828}':'.ctTickerName{font-size:12px;font-weight:900;color:#101828;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}',
            '.ctTickerMeta{font-size:9px;color:#7d8b9d;margin-top:3px}':'.ctTickerMeta{display:none}',
            '.ctTickerRight{text-align:right}':'.ctTickerRight{display:flex;align-items:center;justify-content:flex-end;gap:6px;min-width:0;text-align:right}',
            '.ctTickerScore{font-size:12px;font-weight:900;color:#101828}':'.ctTickerScore{font-size:10px;font-weight:900;color:#101828;white-space:nowrap}',
            '.ctTickerVerdict{font-size:9px;color:#667085;margin-top:3px}':'.ctTickerVerdict{font-size:9px;color:#667085;margin:0;white-space:nowrap;max-width:118px;overflow:hidden;text-overflow:ellipsis}'
          }
          for old,new in reps.items():
            if old in s:
              s=s.replace(old,new,1)
            elif new not in s:
              raise SystemExit('COMPACT_PATTERN_NOT_FOUND:'+old[:70])
          p.write_text(s,encoding='utf-8')
          assert '.ctTickerMeta{display:none}' in s
          assert 'min-height:38px' in s
          print('TRADE_REVIEW_COMPACT_OK')
          PY
      - name: Commit patch and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/trade-review-compact-once.yml
          git add trade-review-v2.js
          git commit -m 'Compact trade review ticker rows for mobile quick-check'
          git push
