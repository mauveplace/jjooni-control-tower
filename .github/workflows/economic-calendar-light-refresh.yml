name: Economic Calendar Light Refresh

on:
  push:
    branches: [main]
    paths:
      - tools/enrich_economic_calendar.py
      - tools/enrich_calendar_all_events.py
      - tools/enrich_calendar_with_all_events.py
      - tools/build_calendar_history.py
      - tools/backfill_calendar_history_forexfactory.py
      - tools/backfill_calendar_history_forexfactory_v2.py
      - tools/fill_calendar_previous_from_history.py
      - tools/sync_calendar_representative_values.py
      - tools/calendar_actual_contract.py
      - tools/official_calendar_collectors.py
      - tools/official_bls_actuals.py
      - tools/official_bls_api.py
      - tools/official_bok_policy.py
      - tools/refresh_official_central_bank_actuals.py
      - tools/publish_observatory_data.py
      - tools/refresh_calendar_pipeline.py
      - tools/persist_calendar_history.py
      - tools/archive_calendar_actuals.py
      - market-observatory/calendar-editor-v1.js
      - market-observatory/calendar-history-v1.js
      - tests/test_calendar_actual_contract.py
      - tests/test_official_historical_actuals.py
      - tests/test_calendar_pipeline.py
      - tests/test_calendar_all_events_history.py
      - .github/workflows/economic-calendar-light-refresh.yml
  schedule:
    - cron: '5,15 21 * * 0-4'
    - cron: '5,35 2-7 * * 1-5'
    - cron: '5 22,4 * * *'
    - cron: '*/15 10-14 * * 1-5'
    - cron: '*/15 17-19 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: economic-calendar-canonical-writer
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install official document parser and run regression tests
        run: |
          python -m pip install -r tools/requirements-observatory.txt
          python -m unittest discover -s tests -p 'test*.py' -v
      - name: Refresh consensus, actual, all-event matching and 10Y history
        env:
          TRADING_ECONOMICS_API_KEY: ${{ secrets.TRADING_ECONOMICS_API_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile \
            tools/enrich_economic_calendar.py \
            tools/enrich_calendar_all_events.py \
            tools/enrich_calendar_with_all_events.py \
            tools/build_calendar_history.py \
            tools/backfill_calendar_history_forexfactory.py \
            tools/backfill_calendar_history_forexfactory_v2.py \
            tools/fill_calendar_previous_from_history.py \
            tools/sync_calendar_representative_values.py \
            tools/refresh_official_central_bank_actuals.py
          python tools/refresh_calendar_pipeline.py
          python - <<'PY'
          import json
          c=json.load(open('market-observatory/data/economic-calendar.json'))
          h=json.load(open('market-observatory/data/economic-calendar-history.json'))
          assert str(c.get('enrichment_contract','')).startswith('OFFICIAL_SCHEDULE_PLUS_MARKET_CONSENSUS_ACTUAL')
          assert c.get('all_event_enrichment_contract')=='ALL_CALENDAR_EVENTS_GENERIC_MARKET_MATCH_V1'
          assert (c.get('all_event_enrichment') or {}).get('row_reuse_contract')=='REUSE_PRIMARY_ENRICHER_FETCH_V1'
          assert c.get('previous_value_contract')=='LATEST_PRIOR_VERIFIED_ACTUAL_AS_PREVIOUS_FALLBACK_V1'
          assert c.get('representative_value_contract')=='PRIMARY_NON_PROBABILITY_METRIC_AFTER_MERGE_V1'
          assert c.get('official_actual_contract')=='OFFICIAL_REGISTRY_BACKFILL_V2'
          assert all(all(k in e for k in ['previous','consensus','actual','market_metrics','history_ref']) for e in c.get('events',[]))
          for e in c.get('events',[]):
              metrics=[m for m in e.get('market_metrics',[]) if isinstance(m,dict)]
              for m in metrics:
                  if m.get('metric_type')!='market_probability_snapshot':
                      assert m.get('history_ref'),(e.get('title'),m)
              primary=next((m for m in metrics if m.get('metric_type')!='market_probability_snapshot' and
                            any(str(m.get(k) or '').strip() not in ('','-','—','None','null','N/A') for k in ['previous','consensus','actual'])),None)
              if primary:
                  for k in ['previous','consensus','actual']:
                      pv=str(primary.get(k) or '').strip()
                      if pv not in ('','-','—','None','null','N/A'):
                          assert str(e.get(k) or '').strip()==pv,(e.get('title'),k,e.get(k),primary.get(k))
              if any(m.get('metric_type')=='market_probability_snapshot' for m in metrics) and primary:
                  assert e.get('representative_value_contract')=='PRIMARY_NON_PROBABILITY_METRIC_V1',e
          assert h.get('schema')=='JJOONI_ECONOMIC_CALENDAR_HISTORY_V1',h.get('schema')
          assert h.get('window_days')==3650,h.get('window_days')
          assert h.get('window_years')==10,h.get('window_years')
          assert h.get('contract')=='ROLLING_3650D_EVENT_AND_METRIC_HISTORY_PRESERVE_V2'
          assert h.get('coverage_status') in ['FULL','PARTIAL','PARTIAL_GAPS'],h.get('coverage_status')
          assert isinstance(h.get('series'),dict)
          freshness=c.get('actual_freshness') or {}
          assert freshness.get('status') in ['LIVE','PENDING','DEGRADED'],freshness
          from copy import deepcopy
          from datetime import datetime
          import sys
          sys.path.insert(0, 'tools')
          from calendar_actual_contract import build_freshness, KST
          for event in c.get('events', []):
              if event.get('actual_status') != 'RELEASED' or event.get('source_tier') != 'OFFICIAL':
                  continue
              simulated=deepcopy(event)
              simulated['actual']=None
              health=build_freshness({'events':[simulated]},datetime.now(KST),[])
              assert health['status'] != 'LIVE',event['title']
          print('ECON_CAL_LIGHT_ACCEPTANCE=PASS',c.get('enrichment_matched'),c.get('all_event_enrichment'),c.get('previous_value_fill'),c.get('representative_value_sync'),freshness,'history_rows=',h.get('row_count'),'available_from=',h.get('available_from'),'coverage=',h.get('coverage_status'))
          PY
      - name: Install calendar history UI runtime
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          index=Path('market-observatory/index.html')
          html=index.read_text(encoding='utf-8')
          html=html.replace('calendar-editor-v1.js?v=1.2','calendar-editor-v1.js?v=1.3')
          index.write_text(html,encoding='utf-8')
          assert 'calendar-editor-v1.js?v=1.3' in html
          editor=Path('market-observatory/calendar-editor-v1.js').read_text(encoding='utf-8')
          history=Path('market-observatory/calendar-history-v1.js').read_text(encoding='utf-8')
          assert 'calendar-history-v1.js?v=1.0' in editor
          assert "version:'1.3'" in editor
          for token in ['economic-calendar-history.json','최근 10년 이력','window_days:3650','window_years:10','ALL_EVENTS_EVENT_AND_METRIC_HISTORY_10Y',"version:'2.0'",'미발표']:
              assert token in history,token
          print('CALENDAR_HISTORY_UI_RUNTIME=PASS')
          PY
      - name: Publish calendar and rolling history
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          python tools/publish_observatory_data.py --message 'data(observatory): refresh all calendar values and 10y history' \
            market-observatory/data/economic-calendar.json \
            market-observatory/data/economic-calendar-history.json \
            market-observatory/data/calendar-manual-overrides.json \
            market-observatory/data/calendar-official-release-cache.json \
            market-observatory/index.html

      - name: Signal overdue major actuals
        shell: bash
        run: |
          set -euo pipefail
          python tools/refresh_official_central_bank_actuals.py --health-only --strict
