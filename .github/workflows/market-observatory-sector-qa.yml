name: Market Observatory Sector ETF QA

on:
  push:
    branches: [main]
    paths:
      - market-observatory/sector-etf-v1.js
      - market-observatory/index.html
      - market-observatory/data/sector-etf.json
      - tools/build_observatory_sector_etf.py
      - .github/workflows/market-observatory-sector-qa.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: market-observatory-sector-qa
  cancel-in-progress: true

jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Syntax checks
        shell: bash
        run: |
          set -euo pipefail
          node --check market-observatory/sector-etf-v1.js
          python -m py_compile tools/build_observatory_sector_etf.py
          echo SECTOR_ETF_SYNTAX=PASS
      - name: Data and UI contract
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.load(open('market-observatory/data/sector-etf.json',encoding='utf-8'))
          assert d['schema']=='JJOONI_OBSERVATORY_SECTOR_ETF_V1'
          assert d['read_only'] is True and d['contains_account_data'] is False
          assert d['universe_version']=='SONG_SECTOR_UNIVERSE_V1'
          assert d.get('horizons_sessions')==[1,5,10,20,50,100],d.get('horizons_sessions')
          classic=next(g['rows'] for g in d['groups'] if g['key']=='classic')
          expected=['XLK','XLC','XLY','XLF','XLI','XLE','XLB','XLV','XLP','XLU','XLRE']
          assert [r['ticker'] for r in classic]==expected
          assert d['quality']['classic_priced_count']==11
          assert d['summary']['priced_count']==d['summary']['total_count']
          assert d['quality']['fetch_error_count']==0
          required=['price','ytd_pct','vs_ma20_pct','vs_ma60_pct','high20_gap_pct']+[f'ret_{x}d_pct' for x in [1,5,10,20,50,100]]+[f'rs_spy_{x}d_pct' for x in [1,5,10,20,50,100]]
          for r in classic:
              for k in required:
                  assert r.get(k) is not None,(r['ticker'],k)
          theme_rows=[r for g in d['groups'] if g['key']!='classic' for r in g.get('rows',[])]
          for r in theme_rows:
              series=d.get('series',{}).get(r['ticker'],[])
              assert len(series)>=100,(r['ticker'],len(series))
          js=Path('market-observatory/sector-etf-v1.js').read_text(encoding='utf-8')
          for token in ['data-tab="sectors"','sector-etf.json','송팀장 Sector Observatory','const H=[1,5,10,20,50,100]','20일 RS','function sparkline(r)','obsSpark','최근 100거래일','READY_LAZY',"version:'1.4'",'data-label="가격"','obsSectorGrid>*{min-width:0']:
              assert token in js,token
          html=Path('market-observatory/index.html').read_text(encoding='utf-8')
          assert './sector-etf-v1.js?v=1.4' in html
          assert '<button data-tab="sectors">섹터·ETF</button>' in html,'static sector tab missing'
          assert '<section class="panel" id="sectors">' in html,'static sector panel missing'
          assert html.find('data-tab="sectors"') < html.find('data-tab="tripod"'),'sector tab order broken'
          assert html.find('id="sectors"') < html.find('id="tripod"'),'sector panel order broken'
          print('SECTOR_ETF_CONTRACT=PASS')
          print('horizons=',d['horizons_sessions'],'sparkline_series_min=',min(len(d['series'][r['ticker']]) for r in theme_rows),'as_of_date=',d['as_of_date'],'classic=',len(classic),'priced=',d['summary']['priced_count'],'errors=',d['quality']['fetch_error_count'])
          PY
