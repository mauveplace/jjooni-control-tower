name: Market Observatory UI Cache Bust Once

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/market-observatory-history-lite-once.yml

permissions:
  contents: write

jobs:
  patch-index:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Bump Observatory UI asset version
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('market-observatory/index.html')
          s=p.read_text(encoding='utf-8')
          old='observatory-v2.js?v=2.4.1'
          new='observatory-v2.js?v=2.5.0'
          if old not in s and new not in s:
              raise SystemExit('asset marker not found')
          p.write_text(s.replace(old,new),encoding='utf-8')
          print('OBS_UI_CACHE_BUST=PASS',new)
          PY
      - name: Commit index
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add market-observatory/index.html
          if git diff --cached --quiet; then
            echo 'No changes'
            exit 0
          fi
          git commit -m 'fix(observatory): serve long-history axis UI v2.5.0'
          git pull --rebase origin main
          git push origin HEAD:main
