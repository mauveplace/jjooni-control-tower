name: Market Observatory Calendar Actual Capture

on:
  workflow_dispatch:
  # Scheduled capture is owned by Light Refresh; retain manual repair entrypoint.

permissions:
  contents: write

concurrency:
  group: economic-calendar-canonical-writer
  cancel-in-progress: false

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Capture released economic values
        env:
          TRADING_ECONOMICS_API_KEY: ${{ secrets.TRADING_ECONOMICS_API_KEY }}
        run: |
          set -euo pipefail
          python -m pip install 'pypdf>=5,<7'
          python -m unittest discover -s tests -p 'test*.py' -v
          python tools/refresh_calendar_pipeline.py
      - name: Publish
        run: |
          git config user.name github-actions
          git config user.email actions@github.com
          python tools/publish_observatory_data.py --message 'data(observatory): archive released economic actuals' market-observatory/data/economic-calendar.json market-observatory/data/calendar-manual-overrides.json market-observatory/data/calendar-official-release-cache.json
