name: Bump Sector ETF Cache Once

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/bump-sector-etf-cache-once.yml

permissions:
  contents: write

jobs:
  bump:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Bump sector runtime cache key
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p=Path('market-observatory/index.html')
          s=p.read_text(encoding='utf-8')
          old='./sector-etf-v1.js?v=1.1'
          new='./sector-etf-v1.js?v=1.2'
          if new in s:
              print('SECTOR_CACHE_ALREADY_V12=PASS')
          elif old in s:
              p.write_text(s.replace(old,new,1),encoding='utf-8')
              print('SECTOR_CACHE_BUMP_V12=PASS')
          else:
              raise SystemExit('SECTOR_CACHE_PATTERN_NOT_FOUND')
          PY
      - name: Commit cache bump
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- market-observatory/index.html; then
            echo NO_CHANGE
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add market-observatory/index.html
          git commit -m 'fix(observatory): load sector ETF runtime v1.2'
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
