name: Fix Trade Review Render Once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/trade-review-render-fix-once.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Make trade review own the mobile panel regardless of legacy active class
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p=Path('trade-review-v2.js')
          s=p.read_text(encoding='utf-8')
          old="function run(){ensureStyle();ensureNav();syncMoreState();const p=qs('#panel-trades');if(p&&(p.classList.contains('on')||window.innerWidth>767))render()}"
          new="function run(){ensureStyle();ensureNav();syncMoreState();const p=qs('#panel-trades');if(p)render()}"
          if old in s:
              s=s.replace(old,new,1)
          elif new not in s:
              raise SystemExit('TRADE_REVIEW_RUN_PATTERN_NOT_FOUND')
          p.write_text(s,encoding='utf-8')
          assert new in s
          print('TRADE_REVIEW_RENDER_FIX_OK')
          PY
      - name: Commit patch and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/trade-review-render-fix-once.yml
          git add trade-review-v2.js
          git commit -m 'Render trade review independently of legacy panel class'
          git push
