name: Observatory Heartbeat Relay

# Manual-only diagnostic retained for incident response. The former self-handing
# 5h40m runner checked every 300 seconds and kept dispatching data writers,
# including when nobody was viewing the site. That automation is retired.
# Official US-close/KR-close, official calendar collection and data quality
# watchdog workflows remain independently scheduled.
on:
  # Single read-only migration check on this workflow file's initial release.
  # With the same concurrency group, this run cancels an in-flight legacy
  # six-hour relay. Normal data commits never trigger this diagnostic.
  push:
    branches: [main]
    paths:
      - .github/workflows/observatory-heartbeat.yml
  workflow_dispatch:

concurrency:
  group: observatory-heartbeat-relay
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Print source freshness decision (read only, no dispatch)
        run: python tools/observatory_heartbeat_decision.py
