name: Morning Brief Publication Contract

on:
  push:
    branches: [main]
    paths:
      - market-observatory/morning-brief-v1.js
      - market-observatory/index.html
      - tests/morning-brief-ui-contract.test.cjs
      - tests/morning-brief-mobile-e2e.cjs
      - tools/check_morning_brief_readiness.py
      - tests/test_morning_brief_readiness.py
      - market-observatory/data/morning-brief/**
      - tools/validate_morning_brief.py
      - tests/test_morning_brief_editorial.py
      - tests/test_morning_brief_dual_template.py
      - docs/morning-brief-roy-jjooni-template-v2-20261114.md
      - docs/pb-morning-intelligence-prompt-v2.2.md
      - docs/morning-brief-publishing.md
      - tools/observatory_session.py
      - docs/song-daily-editorial-contract.md
      - .github/workflows/morning-brief-contract.yml
  pull_request:
    paths:
      - market-observatory/morning-brief-v1.js
      - market-observatory/index.html
      - tests/morning-brief-ui-contract.test.cjs
      - market-observatory/data/morning-brief/**
      - tools/validate_morning_brief.py
      - tests/test_morning_brief_editorial.py
      - tests/test_morning_brief_dual_template.py
      - docs/morning-brief-roy-jjooni-template-v2-20261114.md
      - docs/pb-morning-intelligence-prompt-v2.2.md
      - docs/morning-brief-publishing.md
      - tools/check_morning_brief_readiness.py
      - tests/test_morning_brief_readiness.py
      - tools/observatory_session.py
      - docs/song-daily-editorial-contract.md
      - .github/workflows/morning-brief-contract.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate full text, dates, latest and archives
        run: python tools/validate_morning_brief.py
      - name: Verify editorial and completed-session regression cases
        run: python -m unittest discover -s tests -p test_morning_brief_editorial.py
      - name: Verify P0 prepublication source readiness regressions
        run: python -m unittest discover -s tests -p test_morning_brief_readiness.py -v
      - name: Block stale source publication before new latest brief PR
        if: github.event_name == 'pull_request'
        shell: bash
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin "$BASE_REF"
          if git diff --name-only "origin/$BASE_REF" HEAD -- market-observatory/data/morning-brief/latest.json | grep -Fxq 'market-observatory/data/morning-brief/latest.json'; then
            if git show "origin/$BASE_REF:market-observatory/data/morning-brief/latest.json" >/tmp/morning-brief-original.json 2>/dev/null; then
              python tools/check_morning_brief_readiness.py --baseline /tmp/morning-brief-original.json
            else
              python tools/check_morning_brief_readiness.py
            fi
          else
            echo "MORNING_BRIEF_CANONICAL_READINESS=NOT_APPLICABLE unchanged latest"
          fi
      - name: Verify ROY×JJOONI core metrics and authentic review gate
        run: python -m unittest discover -s tests -p test_morning_brief_dual_template.py -v
      - name: Validate reader runtime
        run: |
          node --check market-observatory/morning-brief-v1.js
          node --test tests/morning-brief-ui-contract.test.cjs
