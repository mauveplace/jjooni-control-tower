name: Fix Trade Review Data And Menu Once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/trade-review-data-menu-fix-once.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix trade source lookup and deduplicate More menu
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p=Path('trade-review-v2.js')
          s=p.read_text(encoding='utf-8')

          old="  try{if(window.D&&D.human&&Array.isArray(D.human.trades))out.push(...D.human.trades)}catch(_){}\n  try{if(window.D&&D.ai&&D.ai.latest&&Array.isArray(D.ai.latest.trades))out.push(...D.ai.latest.trades.map(x=>({...x,account:x.account||'AI'})))}catch(_){}"
          new="  try{if(typeof D!=='undefined'&&D.human&&Array.isArray(D.human.trades))out.push(...D.human.trades)}catch(_){}\n  try{if(typeof D!=='undefined'&&D.ai&&D.ai.latest&&Array.isArray(D.ai.latest.trades))out.push(...D.ai.latest.trades.map(x=>({...x,account:x.account||'AI'})))}catch(_){}"
          if old in s:
              s=s.replace(old,new,1)
          elif new not in s:
              raise SystemExit('TRADE_SOURCE_PATTERN_NOT_FOUND')

          old="  if(menu.dataset.tradeReviewMenu!=='v2'){\n    menu.innerHTML='';\n    const labels={compare:'성과분석',ai:'AI BOT',tripod:'TRI-POD',decisions:'의사결정',quality:'데이터품질',watchlist:'시황/워치',cost:'COST'};\n    CFG.secondary.forEach(id=>{\n      const src=qs('.tab[data-tab=\"'+id+'\"]');if(!src)return;\n      const b=document.createElement('button');b.type='button';b.dataset.tab=id;b.textContent=labels[id]||src.textContent.trim()||id;\n      b.onclick=()=>{src.click();menu.classList.remove('open');more.setAttribute('aria-expanded','false');syncMoreState()};menu.appendChild(b)\n    });\n    menu.dataset.tradeReviewMenu='v2';\n  }"
          new="  const menuIds=qsa('button[data-tab]',menu).map(b=>b.dataset.tab);\n  const menuOk=menuIds.length===CFG.secondary.length&&new Set(menuIds).size===CFG.secondary.length&&CFG.secondary.every(id=>menuIds.includes(id));\n  if(menu.dataset.tradeReviewMenu!=='v2'||!menuOk){\n    menu.innerHTML='';\n    const labels={compare:'성과분석',ai:'AI BOT',tripod:'TRI-POD',decisions:'의사결정',quality:'데이터품질',watchlist:'시황/워치',cost:'COST'};\n    CFG.secondary.forEach(id=>{\n      const src=qs('.tab[data-tab=\"'+id+'\"]');if(!src)return;\n      const b=document.createElement('button');b.type='button';b.dataset.tab=id;b.textContent=labels[id]||src.textContent.trim()||id;\n      b.onclick=()=>{src.click();menu.classList.remove('open');more.setAttribute('aria-expanded','false');syncMoreState()};menu.appendChild(b)\n    });\n    menu.dataset.tradeReviewMenu='v2';\n  }"
          if old in s:
              s=s.replace(old,new,1)
          elif 'const menuOk=' not in s:
              raise SystemExit('MORE_MENU_PATTERN_NOT_FOUND')

          p.write_text(s,encoding='utf-8')
          assert "typeof D!=='undefined'&&D.human" in s
          assert 'const menuOk=' in s
          print('TRADE_REVIEW_DATA_MENU_FIX_OK')
          PY
      - name: Commit patch and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/trade-review-data-menu-fix-once.yml
          git add trade-review-v2.js
          git commit -m 'Populate trade review from dashboard data and deduplicate More menu'
          git push
