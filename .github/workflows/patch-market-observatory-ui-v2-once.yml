name: Patch Market Observatory UI V2 Once

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/patch-market-observatory-ui-v2-once.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch observatory UI
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('market-observatory/index.html')
          s=p.read_text(encoding='utf-8')
          old="sets.map((x,i)=>({label:x.label,data:x.data,borderWidth:2,pointRadius:0,tension:.15}))"
          new="sets.map((x,i)=>({label:x.label,data:x.data,borderWidth:2,pointRadius:0,tension:.15,spanGaps:true}))"
          if old not in s and 'spanGaps:true' not in s:
              raise SystemExit('CHART_DATASET_TARGET_MISSING')
          s=s.replace(old,new,1)
          s=s.replace(".event-meta{font-size:9px;color:#8a99aa;margin-top:2px}",".event-meta{font-size:9px;color:#8a99aa;margin-top:2px}.event-values{display:flex;gap:5px;flex-wrap:wrap;margin-top:5px}.evv{font-size:9px;font-weight:800;padding:3px 6px;border-radius:7px;background:#f5f7fa;color:#475467}.evv.actual{background:#ecfdf3;color:#067647}.evv.consensus{background:#eff4ff;color:#3538cd}.evv.surprise.pos{background:#ecfdf3;color:#067647}.evv.surprise.neg{background:#fef3f2;color:#b42318}",1)
          old_fn="let calMonth=new Date().toISOString().slice(0,7);function renderCalendar(){if(!CAL)return;$('#calendarMonth').textContent=calMonth;const xs=(CAL.events||[]).filter(e=>String(e.datetime_kst||e.date||'').startsWith(calMonth));$('#events').innerHTML=xs.length?xs.map(e=>`<div class=\"event\"><div class=\"date\">${(e.datetime_kst||e.date||'').slice(5,16).replace('T',' ')}</div><div class=\"country\">${e.country}</div><div><div class=\"event-title\">${e.title}</div><div class=\"event-meta\">${e.category||''}${e.reference_period?' · '+e.reference_period:''}</div></div><div class=\"importance\">${'★'.repeat(e.importance||1)}<div class=\"source\">${e.source||''}</div></div></div>`).join(''):'<div class=\"meta\" style=\"padding:20px 0\">등록된 일정이 없습니다.</div>'}"
          new_fn="""function surpriseTag(m){if(!m?.actual||!m?.consensus)return '';const num=x=>{const v=parseFloat(String(x).replace(/[^0-9+-.]/g,''));return Number.isFinite(v)?v:null};const a=num(m.actual),c=num(m.consensus);if(a==null||c==null)return '';const d=a-c;if(Math.abs(d)<1e-12)return '<span class=\"evv surprise\">예상 부합</span>';return `<span class=\"evv surprise ${d>0?'pos':'neg'}\">서프라이즈 ${d>0?'+':''}${d.toFixed(2)}</span>`}
function metricHtml(e){const ms=e.market_metrics||[];if(!ms.length)return '';return `<div class=\"event-values\">${ms.slice(0,3).map((m,i)=>`<span class=\"evv\">${m.label}</span><span class=\"evv consensus\">예측 ${m.consensus||'—'}</span><span class=\"evv actual\">실제 ${m.actual||'—'}</span>${surpriseTag(m)}`).join('')}</div>`}
let calMonth=new Date().toISOString().slice(0,7);function renderCalendar(){if(!CAL)return;$('#calendarMonth').textContent=calMonth;const xs=(CAL.events||[]).filter(e=>String(e.datetime_kst||e.date||'').startsWith(calMonth));$('#events').innerHTML=xs.length?xs.map(e=>`<div class=\"event\"><div class=\"date\">${(e.datetime_kst||e.date||'').slice(5,16).replace('T',' ')}</div><div class=\"country\">${e.country}</div><div><div class=\"event-title\">${e.title}</div><div class=\"event-meta\">${e.category||''}${e.reference_period?' · '+e.reference_period:''}</div>${metricHtml(e)}</div><div class=\"importance\">${'★'.repeat(e.importance||1)}<div class=\"source\">${e.source||''}${e.expectations_source?' / '+e.expectations_source:''}</div></div></div>`).join(''):'<div class=\"meta\" style=\"padding:20px 0\">등록된 일정이 없습니다.</div>'}"""
          if old_fn not in s and 'function metricHtml(e)' not in s:
              raise SystemExit('CALENDAR_RENDER_TARGET_MISSING')
          s=s.replace(old_fn,new_fn,1)
          p.write_text(s,encoding='utf-8')
          print('MARKET_OBSERVATORY_UI_V2_PATCH=PASS')
          PY
          if git diff --quiet -- market-observatory/index.html; then
            echo MARKET_OBSERVATORY_UI_V2_NO_CHANGE
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add market-observatory/index.html
          git commit -m 'fix(observatory): connect sparse series and show calendar surprises'
          git pull --rebase origin main
          git push origin HEAD:main
