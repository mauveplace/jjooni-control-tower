name: QA Banner Integration V1

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/qa-banner-integration-v1.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Mount QA banner only after dashboard decryption
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p=Path('live-bridge.js')
          s=p.read_text(encoding='utf-8')
          marker='CT_QA_BANNER_BOOT_V1'
          if marker in s:
              print('ALREADY_PATCHED')
              raise SystemExit(0)
          s += r'''

// CT_QA_BANNER_BOOT_V1
(function(){
'use strict';
function mount(){
  try{
    if(window.CTQABanner&&typeof window.CTQABanner.mount==='function'){
      if(!window.__ctQaBannerMounted){window.__ctQaBannerMounted=true;window.CTQABanner.mount();}
      return;
    }
    if(document.getElementById('ct-qa-banner-script'))return;
    const x=document.createElement('script');
    x.id='ct-qa-banner-script';
    x.src='assets/ct-qa-banner.js?v=1&_='+Date.now();
    x.async=true;
    x.onload=()=>{try{if(window.CTQABanner&&!window.__ctQaBannerMounted){window.__ctQaBannerMounted=true;window.CTQABanner.mount();}}catch(e){console.warn('CT_QA_BANNER_MOUNT_FAIL',String(e));}};
    x.onerror=()=>console.warn('CT_QA_BANNER_LOAD_FAIL');
    (document.head||document.documentElement).appendChild(x);
  }catch(e){console.warn('CT_QA_BANNER_BOOT_FAIL',String(e));}
}
mount();
})();
'''
          p.write_text(s,encoding='utf-8')
          print('QA_BANNER_PATCH=PASS')
          PY

      - name: Commit QA banner integration
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add live-bridge.js
          if git diff --cached --quiet; then
            echo NO_CHANGES
            exit 0
          fi
          git commit -m 'Mount QA banner after Control Tower decrypt'
          git push
