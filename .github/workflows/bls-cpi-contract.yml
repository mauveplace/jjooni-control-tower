name: BLS CPI and Credential Safety Contract

on:
  pull_request:
    paths:
      - 'tools/official_bls_api.py'
      - 'tools/calendar_actual_contract.py'
      - 'tools/calendar_market_events.py'
      - 'tools/official_calendar_collectors.py'
      - 'tools/sync_calendar_representative_values.py'
      - 'tests/test_bls_cpi_nonpublication_and_key_safety.py'
      - '.github/workflows/bls-cpi-contract.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify current BLS credential without printing its value
        env:
          BLS_API_KEY: ${{ secrets.BLS_API_KEY }}
        run: |
          python - <<'PY'
          import json
          import os
          import urllib.request

          key = os.environ.get('BLS_API_KEY', '').strip()
          if not key:
              raise SystemExit('BLS_CREDENTIAL_PROBE=MISSING_SECRET')
          # No provider response body, URL or traceback is logged; BLS may
          # echo credentials in errors. This test only emits a fixed status.
          url = ('https://api.bls.gov/publicAPI/v2/timeseries/data/'
                 'CUUR0000SA0?startyear=2026&endyear=2026&registrationkey=' + key)
          try:
              with urllib.request.urlopen(urllib.request.Request(
                  url, headers={'Accept':'application/json'}), timeout=15) as res:
                  data=json.loads(res.read())
              valid = (data.get('status') == 'REQUEST_SUCCEEDED'
                       and bool((data.get('Results') or {}).get('series')))
          except Exception:
              raise SystemExit('BLS_CREDENTIAL_PROBE=TRANSPORT_OR_FORMAT_ERROR') from None
          if not valid:
              raise SystemExit('BLS_CREDENTIAL_PROBE=REJECTED_BY_BLS')
          print('BLS_CREDENTIAL_PROBE=PASS')
          PY
      - name: Compile changed source and test
        run: |
          python -m py_compile tools/official_bls_api.py tools/calendar_actual_contract.py tools/calendar_market_events.py tools/official_calendar_collectors.py tools/sync_calendar_representative_values.py tests/test_bls_cpi_nonpublication_and_key_safety.py
          python -m unittest discover -s tests -p 'test_bls_cpi_nonpublication_and_key_safety.py' -v
