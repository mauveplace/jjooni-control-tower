name: Patch consultant market once
on:
  push:
    branches: [feat/consultant-market-page-20260909]
    paths:
      - '.github/workflows/patch-consultant-market-once.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/consultant-market-page-20260909
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Patch observer selector and verify module
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('consultant-market-v29.js')
          s=p.read_text()
          old="q('button[data-tab=\"consultant\"]','#ctMoreMenu')"
          new="q('#ctMoreMenu button[data-tab=\"consultant\"]')"
          if old not in s:
              raise SystemExit('EXPECTED_SELECTOR_NOT_FOUND')
          p.write_text(s.replace(old,new))
          PY
          node --check consultant-market-v29.js
          grep -q 'consultant-market-v29.js?v=29.0' daily-performance-alias-v23.js
          grep -q 'S&P 500' consultant-market-v29.js
          grep -q '미국채 10년' consultant-market-v29.js
          grep -q 'Consultant 섹터 보드' consultant-market-v29.js
      - name: Commit patch and remove one-shot workflow
        run: |
          git config user.name 'mauveplace'
          git config user.email 'mauveplace@gmail.com'
          git rm .github/workflows/patch-consultant-market-once.yml
          git add consultant-market-v29.js daily-performance-alias-v23.js
          git commit -m 'fix: stabilize consultant market page loader'
          git push origin HEAD:feat/consultant-market-page-20260909
