name: Fix Tablet V40 Runner

on:
  push:
    branches: [main]
    paths: ['.github/workflows/fix-tablet-v40-runner.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: Normalize V40 test EOF handling
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p=Path('.github/workflows/tablet-stability-hotfix-v37.yml')
          s=p.read_text()
          old="p.write_text(t+'\\n')"
          new="p.write_text(t.rstrip()+'\\n')"
          if s.count(old)!=1:
              raise SystemExit(f'expected one EOF writer, got {s.count(old)}')
          p.write_text(s.replace(old,new,1))
          print('V40_EOF_NORMALIZATION=PASS')
          PY
      - name: Commit runner fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/tablet-stability-hotfix-v37.yml
          git diff --cached --check
          git commit -m 'test: normalize tablet v40 regression eof'
          git push
