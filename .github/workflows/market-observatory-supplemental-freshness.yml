name: Market Observatory Cross-Market Freshness

on:
  push:
    branches: [main]
    paths:
      - tools/collect_us_rates_intraday.py
      - market-observatory/data-refresh-v1.js
      - tests/test_observatory_data_refresh.cjs
      - tools/refresh_observatory_supplementals.py
      - tools/refresh_observatory_kr_rates.py
      - tools/accept_observatory_sources.py
      - tools/build_daily_market_pulse.py
      - tools/build_public_market_daily.py
      - tests/test_observatory_atomic_session.py
      - tools/collect_fedwatch_official.py
      - tools/build_fed_watch.py
      - tools/audit_observatory_data.py
      - tests/test_observatory_kr_rates_freshness.py
      - tests/test_observatory_ecos_resilience.py
      - tests/test_observatory_source_isolation.py
      - tests/test_observatory_fedwatch_publish_conflict.py
      - tools/publish_observatory_data.py
      - .github/workflows/market-observatory-supplemental-freshness.yml
  workflow_run:
    workflows:
      - "Market Observatory Daily + Calendar"
    types: [completed]
  schedule:
    # Lightweight self-heal. Market daily series are clipped to the latest
    # completed canonical session; crypto remains 24/7 spot.
    - cron: '25 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: observatory-cross-market-writer
  cancel-in-progress: false

jobs:
  refresh:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' || github.event.workflow_run.conclusion == 'failure' }}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Observatory runtime
        run: python -m pip install --quiet -r tools/requirements-observatory.txt

      - name: Test freshness repair code
        shell: bash
        run: |
          set -euo pipefail
          node --test tests/test_observatory_data_refresh.cjs
          python -m py_compile \
            tools/refresh_observatory_supplementals.py \
            tools/refresh_observatory_kr_rates.py \
            tools/build_fed_watch.py \
            tools/audit_observatory_data.py \
            tools/build_observatory_sector_etf.py
          python -m unittest tests.test_observatory_us_rates_refresh tests.test_observatory_atomic_session tests.test_observatory_ecos_resilience tests.test_observatory_kr_rates_freshness tests.test_observatory_source_isolation tests.test_observatory_publish_cleanliness tests.test_observatory_freshness_status tests.test_observatory_fedwatch_publish_conflict -v

      - name: Refresh all public market families
        id: supplemental
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          python tools/refresh_observatory_supplementals.py

      - name: Refresh Korean Treasury curve from BOK ECOS
        id: kr_rates
        continue-on-error: true
        env:
          BOK_ECOS_API_KEY: ${{ secrets.BOK_ECOS_API_KEY || 'sample' }}
        shell: bash
        run: |
          set -euo pipefail
          python tools/refresh_observatory_kr_rates.py
          python - <<'PY'
          import json
          from pathlib import Path
          o=json.loads(Path('market-observatory/data/observatory.json').read_text(encoding='utf-8'))
          q=(o.get('cross_market_freshness_quality') or {})
          group=q.get('KR_RATES') or {}
          assert group.get('status')=='LIVE',group
          assert group.get('fetch_succeeded') is True,group
          assert (group.get('failed_series') or {})=={},group
          for name in ['KR3Y','KR5Y','KR10Y','KR20Y','KR30Y']:
              item=q.get(name) or {}
              assert item.get('status')=='LIVE',(name,item)
              assert item.get('fetch_succeeded') is True,(name,item)
          print('KR_RATES_SOURCE_REFRESH_ACCEPTANCE=PASS api_mode='+str(group.get('api_mode'))+' last_dates='+str(group.get('last_dates')))
          PY

      - name: Refresh FedWatch when stale
        id: fedwatch
        continue-on-error: true
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            python tools/collect_fedwatch_official.py --force || echo 'FEDWATCH_OFFICIAL_MANUAL_ATTEMPT_FAILED; continuing fallback'
          fi
          python tools/build_fed_watch.py

      - name: Refresh observed US yield intraday bars
        id: intraday
        continue-on-error: true
        run: python tools/collect_us_rates_intraday.py

      - name: Refresh Sector ETF snapshot
        id: sector
        continue-on-error: true
        run: python tools/build_observatory_sector_etf.py

      - name: Rebuild aligned market consumers from the collected snapshot
        run: |
          python - <<'PY'
          import sys
          sys.path.insert(0, 'tools')
          from publish_observatory_data import materialize_market_dependents
          materialize_market_dependents(['market-observatory/data/observatory.json', 'market-observatory/data/daily-market-pulse.json', 'public-market-daily.json'])
          PY

      - name: Audit all Observatory data
        shell: bash
        run: |
          set -euo pipefail
          python tools/audit_observatory_data.py
          python - <<'PY'
          import json
          from pathlib import Path
          a=json.loads(Path('market-observatory/data/data-audit.json').read_text(encoding='utf-8'))
          assert a.get('schema')=='JJOONI_OBSERVATORY_DATA_AUDIT_V2',a.get('schema')
          assert int(a.get('critical_count') or 0)==0,a.get('issues')
          print('CROSS_MARKET_SAFE_PUBLICATION=PASS critical=0; source warnings remain visible')
          PY

      - name: Record collection publication receipt
        env:
          INTRADAY_OUTCOME: ${{ steps.intraday.outcome }}
          SUPPLEMENTAL_OUTCOME: ${{ steps.supplemental.outcome }}
          KR_RATES_OUTCOME: ${{ steps.kr_rates.outcome }}
          FEDWATCH_OUTCOME: ${{ steps.fedwatch.outcome }}
          SECTOR_OUTCOME: ${{ steps.sector.outcome }}
        run: |
          python - <<'PY_RECEIPT'
          import json, os, sys
          sys.path.insert(0, "tools")
          from accept_observatory_sources import acceptance
          from datetime import datetime
          from pathlib import Path
          from zoneinfo import ZoneInfo
          receipt = {
              'schema': 'JJOONI_OBSERVATORY_REFRESH_RECEIPT_V1',
              'run_id': os.environ['GITHUB_RUN_ID'],
              'event': os.environ['GITHUB_EVENT_NAME'],
              'generated_kst': datetime.now(ZoneInfo('Asia/Seoul')).isoformat(timespec='seconds'),
              'sources': {k: os.environ[v] for k, v in {
                  'market': 'SUPPLEMENTAL_OUTCOME', 'kr_rates': 'KR_RATES_OUTCOME',
                  'fedwatch': 'FEDWATCH_OUTCOME', 'sector': 'SECTOR_OUTCOME', 'us_rates_intraday': 'INTRADAY_OUTCOME'}.items()},
          }
          audit = json.loads(Path('market-observatory/data/data-audit.json').read_text())
          receipt['quality'] = acceptance(audit, receipt['sources'])
          Path('market-observatory/data/refresh-receipt.json').write_text(json.dumps(receipt, ensure_ascii=False, indent=2)+'\n', encoding='utf-8')
          PY_RECEIPT

      - name: Publish repaired market sources
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          python tools/publish_observatory_data.py \
            --message 'data(observatory): cross-market freshness self-heal' \
            market-observatory/data/observatory.json \
            market-observatory/data/daily-market-pulse.json \
            public-market-daily.json \
            market-observatory/data/fed-watch.json \
            market-observatory/data/fedwatch-official.json \
            market-observatory/data/sector-etf.json \
            market-observatory/data/us-rates-intraday.json \
            market-observatory/data/refresh-receipt.json \
            market-observatory/data/data-audit.json \
            market-observatory/data/freshness-status.json \
            $(find market-observatory/data/fedwatch-history -type f | sort)

      # Source degradation is visible in its own status and job summary.
      # Only structural/critical integrity errors block the publication contract.
      - name: Final cross-market health acceptance
        if: ${{ !cancelled() }}
        env:
          SUPPLEMENTAL_OUTCOME: ${{ steps.supplemental.outcome }}
          KR_RATES_OUTCOME: ${{ steps.kr_rates.outcome }}
          FEDWATCH_OUTCOME: ${{ steps.fedwatch.outcome }}
          SECTOR_OUTCOME: ${{ steps.sector.outcome }}
        run: python tools/accept_observatory_sources.py


