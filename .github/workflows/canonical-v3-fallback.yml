name: Canonical V3 Fallback Repair

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/canonical-v3-fallback.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Append canonical fallback repair
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p=Path('live-bridge.js')
          s=p.read_text(encoding='utf-8')
          marker='CT_CANONICAL_V3_FALLBACK_V1'
          if marker in s:
              print('ALREADY_PATCHED')
              raise SystemExit(0)
          s += r'''

// CT_CANONICAL_V3_FALLBACK_V1
(function(){
'use strict';
const N=v=>{const x=Number(v);return Number.isFinite(x)?x:null};
const Z=v=>N(v)==null?0:N(v);
const todayKst=()=>new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Seoul'}).format(new Date());
function modeledPnl(c){
 let pnl=0,count=0;
 for(const p of (c.positions||[])){
   if(String(p.record_type||'POSITION').toUpperCase()!=='POSITION')continue;
   const q=Z(p.qty),cur=Z(p.current_price||p.price),prev=Z(p.prev_close);
   const fx=String(p.currency||'KRW').toUpperCase()==='USD'?(Z(p.fx)||Z(c.fx)||1):1;
   if(q>0&&cur>0&&prev>0){pnl+=q*(cur-prev)*fx;count++;}
 }
 return count?{pnl,count}:null;
}
function apply(){
 const C=window.__JJOONI_CANONICAL_SSOT;
 if(!C||!C.accounts)return;
 const a=C.accounts;
 if(todayKst()==='2026-09-04'){
   const t=a.TOSS||(a.TOSS={id:'TOSS',type:'HUMAN'});
   t.nav=69626230;t.principal=72937308;t.pnl=-3311077;t.return_pct=-4.5;
   t.today_pnl=656858;t.today_return=0.9;t.quality='USER_VERIFIED_CURRENT';
   t.source='USER_VERIFIED_TOSS_APP_2026-09-04+CASH_REF';
 }
 for(const id of ['ISA','PENSION','IRP']){
   const c=a[id];if(!c)continue;
   if(N(c.today_pnl)==null){const m=modeledPnl(c);if(m){c.today_pnl=m.pnl;c.today_return=(N(c.nav)!=null&&Z(c.nav)-m.pnl>0)?m.pnl/(Z(c.nav)-m.pnl)*100:null;c.today_pnl_position_count=m.count;}}
 }
 const rows=['TOSS','ISA','PENSION','IRP','AI','TRIPOD'].map(id=>a[id]).filter(Boolean);
 const known=rows.filter(x=>N(x.today_pnl)!=null);
 C.total=C.total||{};
 C.total.nav=rows.reduce((s,x)=>s+(N(x.nav)!=null?Z(x.nav):0),0);
 C.total.principal=rows.reduce((s,x)=>s+(N(x.principal)!=null?Z(x.principal):0),0);
 C.total.pnl=C.total.principal>0?C.total.nav-C.total.principal:null;
 C.total.return_pct=C.total.principal>0?(C.total.nav/C.total.principal-1)*100:null;
 C.total.today_pnl=known.reduce((s,x)=>s+Z(x.today_pnl),0);
 C.total.today_change=C.total.today_pnl;
 C.total.known_today_count=known.length;C.total.account_count=rows.length;
 C.total.missing_today=rows.filter(x=>N(x.today_pnl)==null).map(x=>x.id);
 C.total.today_complete=C.total.missing_today.length===0;

 if(window.D&&D.human){
   const human=['TOSS','ISA','PENSION','IRP'].map(id=>a[id]).filter(Boolean);
   D.human.current_account_navs=D.human.current_account_navs||{};
   D.human.current_account_details=D.human.current_account_details||{};
   for(const c of human){
     if(N(c.nav)!=null)D.human.current_account_navs[c.id]=Z(c.nav);
     D.human.current_account_details[c.id]={...(D.human.current_account_details[c.id]||{}),cash_residual:Z(c.cash_krw),cash_krw:Z(c.cash_krw),cash_usd:N(c.cash_usd),canonical_quality:c.quality,canonical_source:c.source};
   }
   D.human.total_asset=human.reduce((s,x)=>s+Z(x.nav),0);
   D.human.principal=human.reduce((s,x)=>s+(N(x.principal)!=null?Z(x.principal):0),0);
   D.human.total_pnl=D.human.total_asset-D.human.principal;
   D.human.return_pct=D.human.principal>0?(D.human.total_asset/D.human.principal-1)*100:null;
   D.human.latest_performance={...(D.human.latest_performance||{}),total_asset:D.human.total_asset,principal:D.human.principal,total_pnl:D.human.total_pnl,return_pct:D.human.return_pct,market_pnl:human.filter(x=>N(x.today_pnl)!=null).reduce((s,x)=>s+Z(x.today_pnl),0),data_state:'CANONICAL_RUNTIME',sync_kst:C.observed_at};
   const perf=Array.isArray(D.human.performance)?D.human.performance:[];
   const td=todayKst();
   for(const c of human){
     let r=perf.find(x=>String(x.date||'')===td&&String(x.account||'').toUpperCase()===c.id);
     if(!r){r={date:td,account:c.id,series_id:'ACTUAL'};perf.push(r)}
     r.total_asset=Z(c.nav);if(N(c.principal)!=null)r.principal=Z(c.principal);
     if(N(c.today_pnl)!=null){r.market_pnl=Z(c.today_pnl);r.daily_return=N(c.today_return)!=null?Z(c.today_return)/100:null;r.flow_adj_return=r.daily_return;r.flow_adj_daily_return=r.daily_return;}
     r.data_state=c.quality;r.sync_kst=C.observed_at;
   }
   D.human.performance=perf;
 }
 if(typeof window.render==='function')try{window.render()}catch(e){}
}
if(typeof window.openTradePerformanceDetail==='function'&&!window.__ctTradeDetailFallback){
 const old=window.openTradePerformanceDetail;
 window.openTradePerformanceDetail=function(t,acct,currentPrice,perf,rankLabel){return old(t,acct,(N(currentPrice)!=null&&Z(currentPrice)>0)?currentPrice:(N(t&&t.current_price)!=null?t.current_price:currentPrice),perf,rankLabel)};
 window.__ctTradeDetailFallback=true;
}
apply();setInterval(apply,1500);
})();
'''
          p.write_text(s,encoding='utf-8')
          PY

      - name: Commit repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add live-bridge.js
          if git diff --cached --quiet; then
            echo NO_CHANGES
            exit 0
          fi
          git commit -m 'Repair canonical fallback and drilldown consistency'
          git push
