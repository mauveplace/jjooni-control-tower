name: Tablet Stability Hotfix V40

on:
  push:
    branches: [main]
    paths: ['.github/workflows/tablet-stability-hotfix-v37.yml']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: tablet-stability-hotfix-v40
  cancel-in-progress: true

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Apply V40 tablet fixes
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          def once(path, old, new, label):
              p=Path(path); t=p.read_text(); c=t.count(old)
              if c != 1:
                  raise SystemExit(f'{label}: expected 1 occurrence, got {c}')
              p.write_text(t.replace(old,new,1))
              print(label+'=PASS')

          # Persistent ticker -> Korean name cache, captured before LIVE rows can overwrite static rows.
          p=Path('live-bridge.js'); t=p.read_text()
          if 'STATIC_SECURITY_NAMES' not in t:
              marker="let TRADE_QUOTES={};\n"
              cache=("let TRADE_QUOTES={};\n"
                     "const STATIC_SECURITY_NAMES=(()=>{\n"
                     " const m=new Map(),manual={'091170':'KODEX 은행','418660':'TIGER 미국나스닥100레버리지(합성)','006400':'삼성SDI','005380':'현대차'};\n"
                     " Object.entries(manual).forEach(([k,v])=>m.set(k,v));\n"
                     " const seen=new WeakSet(),key=v=>{const s=sym(v);return /^\\d{1,6}$/.test(s)?s.padStart(6,'0'):s};\n"
                     " const walk=(v,d=0)=>{if(!v||typeof v!=='object'||d>9||seen.has(v))return;seen.add(v);if(!Array.isArray(v)){const raw=v.ticker??v.symbol??v.code??v.stock_code??v.pdno??v.product_code??v.isu_cd;const nm=String(v.name??v.stock_name??v.security_name??v.prdt_name??v.product_name??v.isu_nm??v.kor_name??'').trim();const k=key(raw);if(k&&nm&&key(nm)!==k&&!m.has(k))m.set(k,nm)}const xs=Array.isArray(v)?v:Object.values(v);for(const x of xs)walk(x,d+1)};\n"
                     " try{if(typeof D!=='undefined')walk(D)}catch(_){}\n"
                     " return m;\n"
                     "})();\n"
                     "window.__JJOONI_SECURITY_NAMES=Object.fromEntries(STATIC_SECURITY_NAMES);\n")
              if t.count(marker)!=1: raise SystemExit('STATIC_NAME_CACHE marker mismatch')
              t=t.replace(marker,cache,1)
          old="const k=sym(ticker);if(!k)return '';\n try{"
          new="const k=sym(ticker);if(!k)return '';\n const sk=/^\\d{1,6}$/.test(k)?k.padStart(6,'0'):k;const cached=STATIC_SECURITY_NAMES.get(sk)||STATIC_SECURITY_NAMES.get(k);if(cached)return cached;\n try{"
          if old not in t: raise SystemExit('LEGACY_NAME_CACHE anchor missing')
          t=t.replace(old,new,1)
          p.write_text(t)
          print('STATIC_NAME_CACHE=PASS')

          # Trade review: default recent-first, name cache fallback, Galaxy Tab-safe classification.
          p=Path('trade-review-v2.js'); t=p.read_text()
          if "sort:'error'" in t: t=t.replace("sort:'error'","sort:'recent'",1)
          elif "sort:'recent'" not in t: raise SystemExit('DEFAULT_SORT missing')
          old="const touchTablet=()=>{const touch=(navigator.maxTouchPoints||0)>0||window.matchMedia('(pointer:coarse)').matches||document.documentElement.classList.contains('ctTouchTablet');return touch&&Math.min(window.innerWidth,window.innerHeight)>=600};"
          new="const touchTablet=()=>{const touch=(navigator.maxTouchPoints||0)>0||window.matchMedia('(pointer:coarse)').matches||document.documentElement.classList.contains('ctTouchTablet');const sw=Math.min(Number(window.screen?.width)||window.innerWidth,Number(window.screen?.height)||window.innerHeight);return touch&&(sw>=600||(window.innerWidth>=768&&window.innerHeight>=500))};"
          if old in t: t=t.replace(old,new,1)
          elif 'const sw=Math.min(Number(window.screen?.width)' not in t: raise SystemExit('TRADE_TABLET_DETECT missing')
          old="function labelTicker(t){return String(t.name||t.stock_name||t.ticker||t.symbol||'UNKNOWN').trim()}"
          new="function labelTicker(t){const ticker=sym(t.ticker||t.symbol),raw=String(t.name||t.stock_name||'').trim();if(raw&&sym(raw)!==ticker)return raw;const names=window.__JJOONI_SECURITY_NAMES||{},k=/^\\d{1,6}$/.test(ticker)?ticker.padStart(6,'0'):ticker,mapped=String(names[k]||names[ticker]||'').trim();return mapped||ticker||raw||'UNKNOWN'}"
          if old in t: t=t.replace(old,new,1)
          elif '__JJOONI_SECURITY_NAMES' not in t: raise SystemExit('TRADE_NAME_FALLBACK missing')
          p.write_text(t)
          print('TRADE_REVIEW_V40=PASS')

          # Tablet detection and typography floor.
          p=Path('tablet-stability-v37.js'); t=p.read_text()
          t=t.replace("version:'37.2'","version:'37.3'",1)
          old="function isTablet(){\n  const touch=(navigator.maxTouchPoints||0)>0||window.matchMedia('(pointer:coarse)').matches||document.documentElement.classList.contains('ctTouchTablet');\n  return touch&&Math.min(window.innerWidth,window.innerHeight)>=600;\n}"
          new="function isTablet(){\n  const touch=(navigator.maxTouchPoints||0)>0||window.matchMedia('(pointer:coarse)').matches||document.documentElement.classList.contains('ctTouchTablet');\n  const sw=Math.min(Number(window.screen?.width)||window.innerWidth,Number(window.screen?.height)||window.innerHeight);\n  return touch&&(sw>=600||(window.innerWidth>=768&&window.innerHeight>=500));\n}"
          if old in t: t=t.replace(old,new,1)
          elif 'const sw=Math.min(Number(window.screen?.width)' not in t: raise SystemExit('STABILITY_TABLET_DETECT missing')
          if 'Tablet readability floor V40' not in t:
              anchor='html.ctStableTabletV37 small{font-size:16px!important;line-height:1.45!important}\n'
              floor=(anchor+
                     "/* Tablet readability floor V40: compact 8-11px block rules must not win on a touch tablet. */\n"
                     "html.ctStableTabletV37 :is(.card,.ctOvHeroCell,.ctAcct,.ctWlCard,.ctWlRow,.ctTicker,.ctSleeve,.v2Kpi,.v2Account,.ctD8Kpi,.ctA8Card,.ctP8Card){font-size:18px!important;line-height:1.45!important}\n"
                     "html.ctStableTabletV37 :is(.ctOvLabel,.ctOvMini,.ctAcctName,.ctAcctNav,.ctAcctStats,.ctAcctStats span,.ctAcctStats b,.ctAttribRow,.ctBenchHeader,.ctBenchRow,.ctBenchRow b,.ctBenchBm small,.ctLossRow,.ctLossAccount,.ctActionWho,.ctActionState,.ctActionText,.ctWlMeta,.ctWlTicker,.ctWlTag){font-size:16px!important;line-height:1.45!important}\n"
                     "html.ctStableTabletV37 :is(.ctWlRow,.ctWlPrice,.ctWlRet,.ctWlRank){font-size:17px!important;line-height:1.4!important}\n"
                     "html.ctStableTabletV37 :is(.ctOvGrid h3,.ctOvMetaRow h2,.ctWlTitle){font-size:22px!important;line-height:1.3!important}\n"
                     "html.ctStableTabletV37 :is(table,thead,tbody,tr,td,th,.v2Table){font-size:16px!important;line-height:1.45!important}\n"
                     "html.ctStableTabletV37 :is(.card,.ctOvGrid,.ctWlCard,.v2Kpi,.v2Account) :is(p,li,label,small){font-size:16px!important;line-height:1.5!important}\n")
              if t.count(anchor)!=1: raise SystemExit('TYPOGRAPHY anchor mismatch')
              t=t.replace(anchor,floor,1)
          p.write_text(t)
          print('TABLET_STABILITY_V40=PASS')

          # Regression locks.
          p=Path('tests/tablet-stability-v37.test.cjs'); t=p.read_text()
          if 'V40 defaults to recent-first' not in t:
              extra=("\n"
                     "test('V40 defaults to recent-first and preserves Korean names',()=>{assert.match(trade,/sort:'recent'/);assert.match(trade,/__JJOONI_SECURITY_NAMES/);assert.match(live,/STATIC_SECURITY_NAMES/);assert.match(live,/091170':'KODEX 은행/);assert.match(live,/418660':'TIGER 미국나스닥100레버리지\\(합성\\)'/)});\n"
                     "test('V40 Galaxy Tab detection survives compressed browser viewport',()=>{assert.match(guard,/window\\.screen\\?\\.width/);assert.match(guard,/sw>=600\\|\\|\\(window\\.innerWidth>=768&&window\\.innerHeight>=500\\)/);assert.match(trade,/sw>=600\\|\\|\\(window\\.innerWidth>=768&&window\\.innerHeight>=500\\)/)});\n"
                     "test('V40 tablet block typography floor is explicit',()=>{assert.match(guard,/Tablet readability floor V40/);assert.match(guard,/\\.ctWlPrice,.ctWlRet/);assert.match(guard,/\\.ctAttribRow/);assert.match(guard,/table,thead,tbody,tr,td,th/)});\n")
              t=t.rstrip()+extra
          p.write_text(t+'\n')
          print('V40_REGRESSION_LOCKS=PASS')
          PY

      - name: Full canonical acceptance
        shell: bash
        run: |
          set -euo pipefail
          node --check live-bridge.js
          node --check trade-review-v2.js
          node --check tablet-stability-v37.js
          node --test tests/*.test.cjs
          git diff --check

      - name: Commit V40
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add live-bridge.js trade-review-v2.js tablet-stability-v37.js tests/tablet-stability-v37.test.cjs
          git diff --cached --check
          git commit -m 'fix: restore Toss names recent-first and readable tablet blocks'
          git push
