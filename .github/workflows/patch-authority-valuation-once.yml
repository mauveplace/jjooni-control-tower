name: Patch Authority Valuation Once
on:
  push:
    branches: [fix/authority-valuation-residual-20260908]
    paths: ['.github/workflows/patch-authority-valuation-once.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/authority-valuation-residual-20260908
          fetch-depth: 0
      - name: Apply exact SSOT consumer fixes
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          def rep(path, old, new, count=1):
              p=Path(path); s=p.read_text(encoding='utf-8'); got=s.count(old)
              if got != count: raise SystemExit(f'PATTERN_COUNT:{path}:{got}!={count}:{old[:80]}')
              p.write_text(s.replace(old,new),encoding='utf-8')

          # Human trust must use broker authority dimension, not raw freshness/status quality.
          p=Path('human-ui-v6.js'); s=p.read_text(encoding='utf-8')
          s=s.replace("version:'6.1'","version:'6.2'")
          marker="function trustLabel(kind){return kind==='measured'?'증권사 확인':kind==='modeled'?'계산값':'참고값'}"
          if s.count(marker)!=1: raise SystemExit('HUMAN_AUTHORITY_MARKER')
          s=s.replace(marker,"function authority(c){return c?.holdings_quality||c?.cash_quality||c?.account_authority||c?.quality||c?.source||''}\n"+marker)
          if s.count("trustKind(c.quality||c.source||'')")!=2: raise SystemExit('HUMAN_TRUST_COUNT')
          s=s.replace("trustKind(c.quality||c.source||'')","trustKind(authority(c))")
          p.write_text(s,encoding='utf-8')

          # Tablet source badges use broker authority. Hide only a 1-won modeled reconciliation residual, not real broker cash.
          p=Path('tablet-accounts-v8.js'); s=p.read_text(encoding='utf-8')
          s=s.replace("version:'8.1'","version:'8.2'")
          marker="function fx(id,a){"
          if s.count(marker)!=1: raise SystemExit('TABLET_FX_MARKER')
          helper="function authority(a){return a?.holdings_quality||a?.cash_quality||a?.account_authority||a?.quality||a?.source||''}\nfunction displayCash(id,a){const x=window.JjooniMetrics.cash(a);if(x==null)return null;const auth=String(authority(a)).toUpperCase();if(id==='IRP'&&!auth.includes('BROKER_DIRECT')&&Math.abs(x)<=1.01){const stock=window.JjooniMetrics.stock(a),nav=n(a?.nav);if(stock!=null&&nav!=null&&Math.abs(nav-stock-x)<=1.01)return null}return x}\n"
          s=s.replace(marker,helper+marker)
          old="const cards=IDS.map(id=>{const a=c.accounts[id]||{},cash=window.JjooniMetrics.cash(a),source=trustKind(a.quality||a.source);"
          new="const cards=IDS.map(id=>{const a=c.accounts[id]||{},cash=displayCash(id,a),source=trustKind(authority(a));"
          if s.count(old)!=1: raise SystemExit('TABLET_CARD_PATTERN')
          s=s.replace(old,new)
          p.write_text(s,encoding='utf-8')

          # Active metric router: remove hidden 1350/cross-account FX fallback and classify source by authority.
          p=Path('metric-drilldown-router-v12.js'); s=p.read_text(encoding='utf-8')
          s=s.replace("version:'12.0'","version:'12.1'")
          old="const C=()=>window.__JJOONI_CANONICAL_SSOT||{},L=()=>window.__JJOONI_LIVE_PAYLOAD||{},fx=()=>n(window.__JJOONI_FX_KRW_PER_USD)||n(L().accounts?.AI?.fx_krw_per_usd)||n(L().accounts?.TRIPOD?.fx)||1350;"
          new="const C=()=>window.__JJOONI_CANONICAL_SSOT||{},L=()=>window.__JJOONI_LIVE_PAYLOAD||{},fx=()=>{const r=L().fx_reference||{},x=n(r.krw_per_usd);return x&&x>500&&x<3000&&String(r.source||'').toUpperCase()!=='FX_REFERENCE_MISSING'?x:null};"
          if s.count(old)!=1: raise SystemExit('V12_FX_PATTERN')
          s=s.replace(old,new)
          marker="function acct(){"
          if s.count(marker)!=1: raise SystemExit('V12_ACCT_MARKER')
          helpers="function authority(a){return a?.holdings_quality||a?.cash_quality||a?.account_authority||a?.quality||a?.source||''}\nfunction residualCash(id,a){const x=window.JjooniMetrics.cash(a),stock=window.JjooniMetrics.stock(a),nav=n(a?.nav),auth=String(authority(a)).toUpperCase();return id==='IRP'&&x!=null&&Math.abs(x)<=1.01&&!auth.includes('BROKER_DIRECT')&&stock!=null&&nav!=null&&Math.abs(nav-stock-x)<=1.01}\nfunction displayCash(id,a){return residualCash(id,a)?null:window.JjooniMetrics.cash(a)}\n"
          s=s.replace(marker,helpers+marker)
          old="function snap(id){const a=C().accounts?.[id]||{};return{id,a,ps:pos(id),stock:window.JjooniMetrics.stock(a),krw:n(a.cash_krw),usd:n(a.cash_usd),cash:window.JjooniMetrics.cash(a),nav:n(a.nav),day:n(a.today_pnl),dayr:n(a.today_return),cum:n(a.pnl),cumr:n(a.return_pct),flow:n(a.net_flow)}}"
          new="function snap(id){const a=C().accounts?.[id]||{};return{id,a,ps:pos(id),stock:window.JjooniMetrics.stock(a),krw:residualCash(id,a)?null:n(a.cash_krw),usd:n(a.cash_usd),cash:displayCash(id,a),cash_residual:residualCash(id,a),nav:n(a.nav),day:n(a.today_pnl),dayr:n(a.today_return),cum:n(a.pnl),cumr:n(a.return_pct),flow:n(a.net_flow)}}"
          if s.count(old)!=1: raise SystemExit('V12_SNAP_PATTERN')
          s=s.replace(old,new)
          old="const s=snap(id),src=norm(s.a.quality||s.a.source||'Canonical SSOT')||'Canonical SSOT';"
          new="const s=snap(id),src=norm(authority(s.a)||'Canonical SSOT')||'Canonical SSOT';"
          if s.count(old)!=1: raise SystemExit('V12_SOURCE_PATTERN')
          s=s.replace(old,new)
          old="['현금 기준',s.a.cash_kind==='CASH_BUYING_POWER'?'주문가능금액 · 결제예수금과 다를 수 있음':'원천 현금값']"
          new="['현금 기준',s.cash_residual?'모델 NAV-보유자산 잔여차 1원 · 예수금으로 표시하지 않음':s.a.cash_kind==='CASH_BUYING_POWER'?'주문가능금액 · 결제예수금과 다를 수 있음':'원천 현금값']"
          if s.count(old)!=1: raise SystemExit('V12_CASH_LABEL_PATTERN')
          s=s.replace(old,new)
          p.write_text(s,encoding='utf-8')

          # Lineage metrics expose source authority separately from raw freshness/status quality.
          rep('lineage-guard.js',"quality:c.quality,priced,positions:total,session_label:c.source","quality:c.quality,authority:c.holdings_quality||c.cash_quality||c.account_quality||c.quality||c.source,priced,positions:total,session_label:c.source")

          # Cache-bust every changed browser consumer and the loader itself.
          p=Path('trade-review-loader.js'); s=p.read_text(encoding='utf-8')
          s=s.replace("version:'14.14'","version:'14.15'")
          for old,new in [
              ('human-ui-v6.js?v=6.1','human-ui-v6.js?v=6.2'),
              ('tablet-accounts-v8.js?v=8.1','tablet-accounts-v8.js?v=8.2'),
              ('metric-drilldown-router-v12.js?v=12.0','metric-drilldown-router-v12.js?v=12.1')]:
              if s.count(old)!=1: raise SystemExit('LOADER_VERSION:'+old)
              s=s.replace(old,new)
          p.write_text(s,encoding='utf-8')
          rep('index.html','trade-review-loader.js?v=14.14','trade-review-loader.js?v=14.15')

          # Contract assertions.
          for f in ['human-ui-v6.js','tablet-accounts-v8.js','metric-drilldown-router-v12.js','lineage-guard.js','trade-review-loader.js']:
              text=Path(f).read_text(encoding='utf-8')
              if '||1350' in text: raise SystemExit('FORBIDDEN_1350:'+f)
          PY
          node --check human-ui-v6.js
          node --check tablet-accounts-v8.js
          node --check metric-drilldown-router-v12.js
          node --check lineage-guard.js
          node --check trade-review-loader.js
          git config user.name 'jjooni-automation'
          git config user.email 'actions@users.noreply.github.com'
          git add human-ui-v6.js tablet-accounts-v8.js metric-drilldown-router-v12.js lineage-guard.js trade-review-loader.js index.html
          git commit -m 'fix: align broker authority valuation and modeled cash display'
          git push origin HEAD:fix/authority-valuation-residual-20260908
