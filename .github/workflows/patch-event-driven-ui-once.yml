name: Patch Event Driven UI Once

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/patch-event-driven-ui-once.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Remove recurring whole-document UI loops
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          exact = {
            'human-ui-v6.js': [
              ("const mo=new MutationObserver(()=>schedule());mo.observe(document.documentElement,{subtree:true,childList:true,characterData:true});\n", "document.addEventListener('jjooni:live-applied',schedule);\n"),
              ("setTimeout(apply,0);setTimeout(apply,700);setTimeout(apply,1800);setInterval(()=>{if(!document.hidden)apply()},1800);", "setTimeout(apply,0);setTimeout(apply,700);setTimeout(apply,1800);")
            ],
            'market-state-bridge.js': [
              ("setInterval(()=>{if(!document.hidden)run()},15000);\ndocument.addEventListener('visibilitychange',()=>{if(!document.hidden)run()});\ntry{new MutationObserver(()=>run()).observe(document.documentElement,{subtree:true,childList:true,characterData:true});}catch(_){}", "document.addEventListener('jjooni:live-applied',run);\ndocument.addEventListener('visibilitychange',()=>{if(!document.hidden)run()});")
            ],
            'trade-review-v2.js': [
              ("setInterval(()=>{if(!document.hidden)run()},2000);", "document.addEventListener('jjooni:live-applied',run);")
            ],
            'trade-review-readable-v3.js': [
              ("const obs=new MutationObserver(schedule);obs.observe(document.documentElement,{subtree:true,childList:true});\n", "document.addEventListener('jjooni:live-applied',schedule);\n"),
              ("setTimeout(apply,0);setTimeout(apply,500);setTimeout(apply,1400);setInterval(()=>{if(!document.hidden)apply()},700);", "setTimeout(apply,0);setTimeout(apply,500);setTimeout(apply,1400);")
            ],
            'mobile-stability-v4.js': [
              ("const mo=new MutationObserver(()=>{clearTimeout(mo._t);mo._t=setTimeout(apply,25)});mo.observe(document.documentElement,{subtree:true,childList:true});\n", "document.addEventListener('jjooni:live-applied',apply);\n"),
              ("setTimeout(apply,0);setTimeout(apply,700);setTimeout(apply,1800);setInterval(()=>{if(!document.hidden)apply()},1200);", "setTimeout(apply,0);setTimeout(apply,700);setTimeout(apply,1800);")
            ],
            'decision-impact-v5.js': [
              ("const mo=new MutationObserver(schedule);mo.observe(document.documentElement,{subtree:true,childList:true,characterData:true});\n", "document.addEventListener('jjooni:live-applied',schedule);\n"),
              ("setTimeout(apply,0);setTimeout(apply,350);setTimeout(apply,900);setInterval(()=>{if(!document.hidden)apply()},1200);document.addEventListener('visibilitychange',()=>{if(!document.hidden)schedule()});", "setTimeout(apply,0);setTimeout(apply,350);setTimeout(apply,900);document.addEventListener('visibilitychange',()=>{if(!document.hidden)schedule()});")
            ],
            'tablet-accounts-v8.js': [
              ("setTimeout(render,0);setTimeout(render,700);setInterval(()=>{if(!document.hidden)render()},900);window.addEventListener('resize',render);try{new MutationObserver(()=>{if(wide())requestAnimationFrame(render)}).observe(document.documentElement,{subtree:true,childList:true})}catch(_){}", "setTimeout(render,0);setTimeout(render,700);document.addEventListener('jjooni:live-applied',render);window.addEventListener('resize',render);")
            ],
            'canonical-valuation-fix-v13.js': [
              ("setTimeout(reconcile,150);setTimeout(reconcile,700);setInterval(()=>{if(!document.hidden)reconcile()},500);", "setTimeout(reconcile,150);setTimeout(reconcile,700);document.addEventListener('jjooni:live-applied',reconcile);")
            ],
            'ui-refactor.js': [
              ("setInterval(()=>{if(!document.hidden)enforce()},1500);", "document.addEventListener('jjooni:live-applied',enforce);")
            ],
            'data-integrity-v4.js': [
              ("setInterval(()=>{if(!document.hidden)normalize()},750);", "document.addEventListener('jjooni:live-applied',normalize);")
            ],
            'viewport-bottom-guard-v5.js': [
              ("wrap();setTimeout(wrap,500);setTimeout(wrap,1600);setInterval(()=>{if(!document.hidden)wrap()},900);", "wrap();setTimeout(wrap,500);setTimeout(wrap,1600);document.addEventListener('jjooni:live-applied',wrap);")
            ],
            'recent-trade-metric-drilldown-v9.js': [
              ("new MutationObserver(ms=>{if(ms.some(x=>x.type==='childList'))setTimeout(bind,0)}).observe(document.documentElement,{subtree:true,childList:true});\n", "document.addEventListener('jjooni:live-applied',()=>setTimeout(bind,0));\n"),
              ("setInterval(()=>{if(!document.hidden){wrap();bind()}},1000);", "document.addEventListener('jjooni:live-applied',()=>{wrap();bind()});")
            ],
          }

          # Special multiline replacements handled separately.
          for f, reps in exact.items():
              p=Path(f); s=p.read_text(encoding='utf-8')
              for i,(a,b) in enumerate(reps,1):
                  c=s.count(a)
                  if c != 1:
                      raise SystemExit(f'{f}:replacement{i}:match={c}')
                  s=s.replace(a,b,1)
              p.write_text(s,encoding='utf-8')
              print('PATCHED',f,len(reps))

          # tablet-runtime-v8: one line contains interval + global observer.
          p=Path('tablet-runtime-v8.js'); s=p.read_text(encoding='utf-8')
          a="ensureStyle();setTimeout(apply,0);setTimeout(apply,700);setInterval(()=>{if(!document.hidden)apply()},750);window.addEventListener('resize',apply);document.addEventListener('jjooni:realized-ledger',apply);try{new MutationObserver(()=>{if(wide())requestAnimationFrame(apply)}).observe(document.documentElement,{childList:true,subtree:true})}catch(_){}"
          b="ensureStyle();setTimeout(apply,0);setTimeout(apply,700);document.addEventListener('jjooni:live-applied',apply);window.addEventListener('resize',apply);document.addEventListener('jjooni:realized-ledger',apply);"
          if s.count(a)!=1: raise SystemExit('tablet-runtime-v8 match='+str(s.count(a)))
          p.write_text(s.replace(a,b,1),encoding='utf-8'); print('PATCHED tablet-runtime-v8.js')

          # trade-money-v6: preserve ledger event + clicks, remove global observer and 400ms timer.
          p=Path('trade-money-v6.js'); s=p.read_text(encoding='utf-8')
          old="document.addEventListener('jjooni:realized-ledger',schedule);document.addEventListener('click',e=>{if(e.target?.closest?.('#ctTradeReviewV2 [data-sort]')){state.amountSort=false;schedule()}},{capture:true});new MutationObserver(ms=>{if(ms.some(x=>x.type==='childList'))schedule()}).observe(document.documentElement,{subtree:true,childList:true});setTimeout(apply,0);setTimeout(apply,400);setInterval(()=>{if(!document.hidden)apply()},400);"
          new="document.addEventListener('jjooni:realized-ledger',schedule);document.addEventListener('jjooni:live-applied',schedule);document.addEventListener('click',e=>{if(e.target?.closest?.('#ctTradeReviewV2 [data-sort]')){state.amountSort=false;schedule()}},{capture:true});setTimeout(apply,0);setTimeout(apply,400);"
          if s.count(old)!=1: raise SystemExit('trade-money-v6 match='+str(s.count(old)))
          p.write_text(s.replace(old,new,1),encoding='utf-8'); print('PATCHED trade-money-v6.js')

          # metric router: keep click handling but make rescans feed-driven.
          p=Path('metric-drilldown-router-v12.js'); s=p.read_text(encoding='utf-8')
          old="document.addEventListener('click',capture,true);scan();setTimeout(scan,250);setTimeout(scan,900);setInterval(()=>{if(!document.hidden)scan()},1000);try{new MutationObserver(()=>queueMicrotask(scan)).observe(document.documentElement,{subtree:true,childList:true,attributes:true,attributeFilter:['data-auto-drill']})}catch(_){}"
          new="document.addEventListener('click',capture,true);scan();setTimeout(scan,250);setTimeout(scan,900);document.addEventListener('jjooni:live-applied',scan);"
          if s.count(old)!=1: raise SystemExit('metric-router match='+str(s.count(old)))
          p.write_text(s.replace(old,new,1),encoding='utf-8'); print('PATCHED metric-drilldown-router-v12.js')
          PY
      - name: Commit event-driven runtime
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'jjooni-control-tower-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add human-ui-v6.js market-state-bridge.js trade-review-v2.js trade-review-readable-v3.js mobile-stability-v4.js decision-impact-v5.js tablet-runtime-v8.js tablet-accounts-v8.js canonical-valuation-fix-v13.js ui-refactor.js data-integrity-v4.js viewport-bottom-guard-v5.js recent-trade-metric-drilldown-v9.js trade-money-v6.js metric-drilldown-router-v12.js
          git diff --cached --check
          git commit -m 'Convert Control Tower UI refreshers to feed-driven updates'
          git push
