name: Fix Control Tower Live Bridge Bootstrap

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/fix-live-bridge-bootstrap.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Replace direct external script injection with bootstrap loader
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          old="html=html.replace('</body>','<script src=\"live-bridge.js?v=1\"><\\/script></body>');document.open();document.write(html);document.close();"
          new="""const CT_LIVE_BOOT=`<script>(function(){var b=document.createElement('div');b.id='ctEncryptedLiveBadge';b.style.cssText='position:fixed;right:12px;bottom:72px;z-index:10001;padding:6px 9px;border-radius:999px;background:#fff7ed;border:1px solid #fed7aa;color:#b45309;font:800 10px/1.2 system-ui,-apple-system,sans-serif;box-shadow:0 4px 14px #0002';b.textContent='AI FEED LOADING';document.body.appendChild(b);var s=document.createElement('script');s.src='live-bridge.js?v=2&_='+Date.now();s.async=false;s.onerror=function(){b.textContent='AI FEED LOAD FAIL'};(document.head||document.documentElement).appendChild(s);}());<\\/script>`;\n    html=html.replace('</body>',CT_LIVE_BOOT+'</body>');document.open();document.write(html);document.close();"""
          if old not in s:
              raise SystemExit('TARGET_NOT_FOUND')
          s=s.replace(old,new,1)
          p.write_text(s,encoding='utf-8')
          print('LIVE_BRIDGE_BOOTSTRAP_FIX=PASS')
          PY
      - name: Commit patched loader
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Fix Control Tower live bridge bootstrap'
          git push
