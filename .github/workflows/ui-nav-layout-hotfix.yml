name: Control Tower responsive nav hotfix

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/ui-nav-layout-hotfix.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4

      - name: Patch responsive navigation
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          start = '/* CT_RESPONSIVE_NAV_V10_BEGIN */'
          end = '/* CT_RESPONSIVE_NAV_V10_END */'
          if start in s and end in s:
              a = s.index(start)
              b = s.index(end, a) + len(end)
              s = s[:a] + s[b:]

          override = r'''
/* CT_RESPONSIVE_NAV_V10_BEGIN */
/* Mobile: top navigation in normal document flow. Never fixed/sticky over content. */
@media (max-width:699px){
 html.ctTouchTablet .app,.app{margin-left:0!important;width:100%!important;max-width:100%!important;padding:0 10px 20px!important}
 html.ctTouchTablet .top,.top{position:relative!important;top:auto!important;z-index:10!important;margin:0 -10px!important}
 html.ctTouchTablet .tabs,.tabs{position:relative!important;left:auto!important;right:auto!important;top:auto!important;bottom:auto!important;width:calc(100% + 20px)!important;height:58px!important;margin:0 -10px 10px!important;padding:5px 6px!important;display:flex!important;flex-direction:row!important;align-items:stretch!important;gap:3px!important;overflow-x:auto!important;overflow-y:hidden!important;scrollbar-width:none!important;background:#061a36!important;z-index:20!important;box-shadow:none!important}
 html.ctTouchTablet .tabs::-webkit-scrollbar,.tabs::-webkit-scrollbar{display:none!important}
 html.ctTouchTablet .tab,.tab{display:flex!important;flex:0 0 68px!important;width:68px!important;min-width:68px!important;height:48px!important;padding:3px 2px!important;align-items:center!important;justify-content:center!important;flex-direction:column!important;font-size:8px!important;border-radius:8px!important}
}

/* Tablet: restore the original left rail. It must reserve width, never cover the page. */
@media (min-width:700px) and (max-width:1100px){
 html.ctTouchTablet .app,.app{margin-left:98px!important;width:calc(100% - 98px)!important;max-width:calc(100% - 98px)!important;padding:0 16px 24px!important;overflow-x:hidden!important}
 html.ctTouchTablet .top,.top{position:relative!important;top:auto!important;z-index:10!important;height:56px!important;margin:0!important;padding:0 2px!important;background:transparent!important}
 html.ctTouchTablet .top:before,.top:before{display:none!important;content:none!important}
 html.ctTouchTablet .brand,.brand{position:static!important;left:auto!important;transform:none!important}
 html.ctTouchTablet .tabs,.tabs{position:fixed!important;left:0!important;right:auto!important;top:0!important;bottom:0!important;width:98px!important;height:100dvh!important;margin:0!important;padding:18px 10px!important;display:flex!important;flex-direction:column!important;align-items:stretch!important;gap:4px!important;overflow-y:auto!important;overflow-x:hidden!important;background:#061a36!important;border:0!important;z-index:400!important;box-shadow:none!important}
 html.ctTouchTablet .tab,.tab{display:flex!important;width:100%!important;min-width:0!important;height:44px!important;min-height:44px!important;padding:6px 5px!important;align-items:center!important;justify-content:flex-start!important;flex-direction:row!important;gap:5px!important;font-size:9px!important;line-height:1.15!important;text-align:left!important;border-radius:8px!important}
 html.ctTouchTablet .tab.on,.tab.on{background:rgba(255,255,255,.09)!important;color:#fff!important}
}
/* CT_RESPONSIVE_NAV_V10_END */
'''
          needle = '\n</style>`;\nconst CT_POSTFIX='
          if needle not in s:
              raise SystemExit('CT_PORTRAIT_HOTFIX style terminator not found')
          s = s.replace(needle, override + needle, 1)
          p.write_text(s, encoding='utf-8')
          PY

      - name: Commit patch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'jjooni-dashboard-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add index.html
          if git diff --cached --quiet; then
            echo 'No change required.'
            exit 0
          fi
          git commit -m 'fix: responsive nav no-overlay layout'
          git push origin main
