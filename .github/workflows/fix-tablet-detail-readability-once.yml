name: Fix Tablet Detail Readability Once

on:
  push:
    branches: [main]
    paths: ['.github/workflows/fix-tablet-detail-readability-once.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Align final tablet modal authority
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          p=Path('tablet-stability-v37.js')
          t=p.read_text()
          t=t.replace("version:'37.8'","version:'37.9'",1)
          repl={
            'html.ctStableTabletV37 #accountDrillModal :is(.label,.v2Label,[class*="Label"]){font-size:16px!important;line-height:1.4!important}':'html.ctStableTabletV37 #accountDrillModal :is(.label,.v2Label,[class*="Label"]){font-size:16pt!important;line-height:1.4!important}',
            'html.ctStableTabletV37 #accountDrillModal :is(.value,.v2Value,[class*="Value"]){font-size:21px!important;line-height:1.3!important}':'html.ctStableTabletV37 #accountDrillModal :is(.value,.v2Value,[class*="Value"]){font-size:22pt!important;line-height:1.3!important}',
            'html.ctStableTabletV37 #accountDrillModal :is(td,th,li,p,small){font-size:16px!important;line-height:1.5!important}':'html.ctStableTabletV37 #accountDrillModal :is(td,th,li,p,small){font-size:16pt!important;line-height:1.5!important}'
          }
          for a,b in repl.items():
              if a not in t: raise SystemExit('FINAL_AUTHORITY_TOKEN_MISSING: '+a)
              t=t.replace(a,b,1)
          p.write_text(t)

          p=Path('trade-review-loader.js')
          t=p.read_text()
          t=t.replace("version:'14.27'","version:'14.28'",1)
          t=t.replace('tablet-stability-v37.js?v=37.8','tablet-stability-v37.js?v=37.9',1)
          p.write_text(t)

          p=Path('tests/tablet-stability-v37.test.cjs')
          t=p.read_text()
          t=t.replace(r'tablet-stability-v37\.js\?v=37\.8',r'tablet-stability-v37\.js\?v=37\.9',1)
          t += "\n\ntest('last-loaded tablet authority preserves pt-sized modal text',()=>{\n  assert.match(loader,/tablet-stability-v37\\.js\\?v=37\\.9/);\n  assert.match(guard,/#accountDrillModal :is\\(\\.label,\\.v2Label,\\[class\\*=\\\"Label\\\"\\]\\)\\{font-size:16pt!important/);\n  assert.match(guard,/#accountDrillModal :is\\(\\.value,\\.v2Value,\\[class\\*=\\\"Value\\\"\\]\\)\\{font-size:22pt!important/);\n  assert.match(guard,/#accountDrillModal :is\\(td,th,li,p,small\\)\\{font-size:16pt!important/);\n});\n"
          p.write_text(t)
          PY

      - name: Regression acceptance
        shell: bash
        run: |
          set -euo pipefail
          node --check tablet-stability-v37.js
          node --check trade-review-loader.js
          node --test tests/*.test.cjs
          grep -q 'font-size:16pt!important' tablet-stability-v37.js
          grep -q 'font-size:22pt!important' tablet-stability-v37.js
          grep -q 'tablet-stability-v37.js?v=37.9' trade-review-loader.js
          grep -q 'min-height:150px!important' tablet-stability-v37.js
          echo TABLET_FINAL_AUTHORITY=PASS

      - name: Commit fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tablet-stability-v37.js trade-review-loader.js tests/tablet-stability-v37.test.cjs
          git diff --cached --check
          git commit -m 'fix(ui): align final tablet modal typography authority'
          git push
