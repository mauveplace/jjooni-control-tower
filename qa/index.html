<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>JJOONI Control Tower QA</title>
<style>
:root{
  --bg:#08111c; --panel:#101c29; --panel2:#07101a; --line:#263b52;
  --fg:#eaf2fb; --muted:#91a6ba;
  --ok-bg:#123d31; --ok-fg:#b8ffe8;
  --bad-bg:#5a1f2a; --bad-fg:#ffdbe1;
  --warn-bg:#4a3813; --warn-fg:#ffe7b0;
  --dead-bg:#2a2f38; --dead-fg:#c6ced9;
}
*{box-sizing:border-box}
body{font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;margin:0;background:var(--bg);color:var(--fg);line-height:1.5}
main{max-width:980px;margin:auto;padding:20px 16px 56px}
h1{font-size:20px;margin:0 0 4px}
h2{font-size:15px;margin:0 0 12px;color:var(--muted);font-weight:700}
.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:16px;margin:12px 0}
.muted{color:var(--muted);font-size:13px}
.badge{display:inline-flex;align-items:center;gap:7px;padding:8px 13px;border-radius:999px;font-weight:800;font-size:14px;background:var(--dead-bg);color:var(--dead-fg)}
.badge.pass{background:var(--ok-bg);color:var(--ok-fg)}
.badge.fail{background:var(--bad-bg);color:var(--bad-fg)}
.badge.stale{background:var(--warn-bg);color:var(--warn-fg)}
.badge.dead{background:var(--dead-bg);color:var(--dead-fg)}
.hdr{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.counts{display:flex;gap:16px;margin-top:12px;flex-wrap:wrap}
.count{min-width:64px}
.count b{display:block;font-size:22px;line-height:1.2;font-variant-numeric:tabular-nums}
.count span{font-size:11px;color:var(--muted)}
button{border:1px solid var(--line);background:#16263a;color:var(--fg);border-radius:10px;padding:9px 14px;font-weight:700;font-size:13px;cursor:pointer}
button:hover:not(:disabled){background:#1d3348}
button:disabled{opacity:.5;cursor:default}
button:focus-visible{outline:2px solid #6ea8ff;outline-offset:2px}
.chk{border:1px solid var(--line);border-left-width:4px;border-radius:12px;padding:12px 14px;margin:9px 0;background:var(--panel2)}
.chk.blocker{border-left-color:#ff6b81}
.chk.fail{border-left-color:#ff9d5c}
.chk.warn{border-left-color:#ffd166}
.chk-top{display:flex;justify-content:space-between;gap:10px;align-items:baseline;flex-wrap:wrap}
.chk-name{font-weight:800;font-size:14px;word-break:break-all}
.sev{font-size:11px;font-weight:800;letter-spacing:.03em;color:var(--muted)}
.kv{margin-top:8px;font-size:13px;display:grid;grid-template-columns:auto 1fr;gap:4px 12px}
.kv dt{color:var(--muted)}
.kv dd{margin:0;font-variant-numeric:tabular-nums;word-break:break-word}
.gap{color:#ffd166;font-size:12.5px;margin-top:8px}
.pill{display:inline-block;font-size:11px;padding:3px 8px;border-radius:999px;border:1px solid var(--line);color:var(--muted);margin-right:6px;margin-bottom:6px}
.pill.bad{border-color:#7a2b39;color:#ffb3c0}
.pill.good{border-color:#1e6b56;color:#a9f0d8}
details{margin-top:12px}
summary{cursor:pointer;color:var(--muted);font-size:13px}
pre{white-space:pre-wrap;word-break:break-word;background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:14px;font-size:12px;margin:10px 0 0;max-height:60vh;overflow:auto}
.empty{color:var(--muted);font-size:13.5px}
@media(prefers-reduced-motion:no-preference){.card{transition:border-color .2s}}
</style>
</head>
<body>
<main>
  <h1>JJOONI Control Tower · 구조 점검</h1>
  <p class="muted">구조 점검 전용입니다. 잔고, 계좌번호, 보유종목, 거래내역은 포함되지 않습니다.</p>

  <div class="card">
    <div class="hdr">
      <span id="badge" class="badge dead" role="status" aria-live="polite">확인 중</span>
      <button id="btn" type="button">다시 확인</button>
    </div>
    <p id="meta" class="muted" style="margin:12px 0 0"></p>
    <div class="counts" id="counts" hidden>
      <div class="count"><b id="cTotal">–</b><span>전체 점검</span></div>
      <div class="count"><b id="cPass" style="color:#7ee0bd">–</b><span>통과</span></div>
      <div class="count"><b id="cFail" style="color:#ff8fa0">–</b><span>실패</span></div>
      <div class="count"><b id="cBlock" style="color:#ff6b81">–</b><span>차단</span></div>
      <div class="count"><b id="cAge">–</b><span>스냅샷 경과</span></div>
    </div>
    <p id="integrity" class="muted" style="margin:12px 0 0"></p>
  </div>

  <div class="card">
    <h2>조치가 필요한 항목</h2>
    <div id="failed"><p class="empty">불러오는 중</p></div>
  </div>

  <div class="card" id="warnCard" hidden>
    <h2>경고</h2>
    <div id="warns"></div>
  </div>

  <div class="card">
    <h2>통과한 항목</h2>
    <div id="passed"><p class="empty">불러오는 중</p></div>
    <details>
      <summary>원본 JSON 보기</summary>
      <pre id="raw">불러오는 중</pre>
    </details>
  </div>
</main>

<script>
"use strict";
const $ = id => document.getElementById(id);
const TIMEOUT_MS = 8000;
const DEFAULT_MAX_AGE = 3600;
const SEV_RANK = { BLOCKER: 0, FAIL: 1, WARN: 2 };

function setBadge(kind, text) {
  const b = $('badge');
  b.className = 'badge ' + kind;
  b.textContent = text;
}

function fmtAge(sec) {
  if (!isFinite(sec)) return '–';
  if (sec < 60) return Math.max(0, Math.round(sec)) + '초';
  if (sec < 3600) return Math.round(sec / 60) + '분';
  if (sec < 86400) return (sec / 3600).toFixed(1) + '시간';
  return (sec / 86400).toFixed(1) + '일';
}

async function fetchJSON(url) {
  const ac = new AbortController();
  const timer = setTimeout(() => ac.abort(), TIMEOUT_MS);
  try {
    const r = await fetch(url + (url.includes('?') ? '&' : '?') + 't=' + Date.now(),
                          { cache: 'no-store', signal: ac.signal });
    if (!r.ok) throw new Error('서버 응답 ' + r.status);
    const buf = await r.arrayBuffer();
    let json;
    try {
      json = JSON.parse(new TextDecoder().decode(buf));
    } catch (_) {
      throw new Error('JSON 형식이 아닙니다 (응답 ' + r.status + ')');
    }
    return { json, buf };
  } finally {
    clearTimeout(timer);
  }
}

async function sha256Hex(buf) {
  if (!crypto?.subtle?.digest) return null;
  const d = await crypto.subtle.digest('SHA-256', buf);
  return [...new Uint8Array(d)].map(b => b.toString(16).padStart(2, '0')).join('');
}

async function verifyIntegrity(m) {
  const el = $('integrity');
  if (!m.snapshot_path || !m.snapshot_sha256) {
    el.textContent = '무결성: 해시 미선언';
    return;
  }
  const canon = m.integrity?.canonicalization;
  try {
    const url = new URL('../' + m.snapshot_path, location.href).href;
    const { buf } = await fetchJSON(url);
    const actual = await sha256Hex(buf);
    if (actual === null) { el.textContent = '무결성: 이 브라우저에서 검증 불가'; return; }
    if (actual === m.snapshot_sha256) {
      el.innerHTML = '<span class="pill good">무결성 확인</span>' +
        '<span class="muted">sha256 ' + actual.slice(0, 12) + '…</span>';
    } else {
      el.innerHTML = '<span class="pill bad">무결성 불일치</span>' +
        '<span class="muted">선언 ' + m.snapshot_sha256.slice(0, 12) + '… / 실제 ' + actual.slice(0, 12) + '…' +
        (canon ? '' : ' · 정규화 규칙이 선언되지 않았습니다') + '</span>';
    }
  } catch (e) {
    el.innerHTML = '<span class="pill bad">무결성 검증 실패</span><span class="muted">' + e.message + '</span>';
  }
}

function checkCard(name, c) {
  const sev = c.severity || (c.pass ? 'PASS' : 'FAIL');
  const div = document.createElement('div');
  div.className = 'chk ' + sev.toLowerCase();

  const top = document.createElement('div');
  top.className = 'chk-top';
  const n = document.createElement('span');
  n.className = 'chk-name';
  n.textContent = c.label || name;
  const s = document.createElement('span');
  s.className = 'sev';
  s.textContent = sev;
  top.append(n, s);
  div.append(top);

  const rows = [];
  if (c.detail) rows.push(['내용', c.detail]);
  if (c.delta_bps != null) rows.push(['편차', c.delta_bps + ' bp']);
  if (c.suspect_source) rows.push(['의심 구간', c.suspect_source]);
  if (c.caused_by) rows.push(['선행 원인', c.caused_by]);
  if (c.consecutive_failures != null) rows.push(['연속 실패', c.consecutive_failures + '회']);
  if (c.first_failed_snapshot) rows.push(['최초 발생', c.first_failed_snapshot]);
  if (c.covered != null && c.total != null) rows.push(['커버리지', c.covered + ' / ' + c.total]);
  if (c.as_of) rows.push(['기준', c.as_of]);
  if (c.next_action) rows.push(['다음 조치', c.next_action]);

  if (rows.length) {
    const dl = document.createElement('dl');
    dl.className = 'kv';
    for (const [k, v] of rows) {
      const dt = document.createElement('dt'); dt.textContent = k;
      const dd = document.createElement('dd'); dd.textContent = v;
      dl.append(dt, dd);
    }
    div.append(dl);
  }

  if (!c.pass && !c.detail && c.delta_bps == null) {
    const g = document.createElement('p');
    g.className = 'gap';
    g.textContent = '진단 정보가 없습니다. 프로듀서에서 detail / delta_bps / suspect_source 를 채워야 원인 추적이 가능합니다.';
    div.append(g);
  }
  return div;
}

function render(m) {
  const checks = m.checks || {};
  const names = Object.keys(checks);
  const failed = names.filter(n => checks[n].pass === false);
  const passed = names.filter(n => checks[n].pass === true);
  const blockers = failed.filter(n => (checks[n].severity || '').toUpperCase() === 'BLOCKER');

  const gen = m.generated_kst ? new Date(m.generated_kst) : null;
  const ageSec = gen && !isNaN(gen) ? (Date.now() - gen.getTime()) / 1000 : NaN;
  const maxAge = m.max_age_seconds || DEFAULT_MAX_AGE;
  const stale = isFinite(ageSec) && ageSec > maxAge;

  if (stale) {
    setBadge('stale', '스냅샷 오래됨 · ' + fmtAge(ageSec) + ' 경과');
  } else if (m.overall_status === 'PASS' && failed.length === 0) {
    setBadge('pass', '정상');
  } else {
    setBadge('fail', '점검 실패 ' + failed.length + '건');
  }

  $('meta').textContent =
    '스냅샷 ' + (m.snapshot_id || '-') + ' · 생성 ' + (m.generated_kst || '-') +
    (m.previous_snapshot_id ? ' · 직전 ' + m.previous_snapshot_id : '');

  $('counts').hidden = false;
  $('cTotal').textContent = names.length;
  $('cPass').textContent = passed.length;
  $('cFail').textContent = failed.length;
  $('cBlock').textContent = blockers.length;
  $('cAge').textContent = fmtAge(ageSec);
  $('cAge').style.color = stale ? '#ffd166' : '';

  const fEl = $('failed');
  fEl.textContent = '';
  if (!failed.length) {
    fEl.innerHTML = '<p class="empty">조치가 필요한 항목이 없습니다.</p>';
  } else {
    failed.sort((a, b) =>
      (SEV_RANK[(checks[a].severity || 'FAIL').toUpperCase()] ?? 1) -
      (SEV_RANK[(checks[b].severity || 'FAIL').toUpperCase()] ?? 1));
    failed.forEach(n => fEl.append(checkCard(n, checks[n])));
  }

  const warns = m.warnings || [];
  $('warnCard').hidden = warns.length === 0;
  const wEl = $('warns');
  wEl.textContent = '';
  warns.forEach(w => {
    const blocking = (w.severity || '').toUpperCase() === 'BLOCKER' ||
                     failed.some(n => checks[n].caused_by === w.code);
    wEl.append(checkCard(w.code || 'WARNING', {
      pass: true,
      severity: blocking ? 'BLOCKER' : (w.severity || 'WARN'),
      label: w.code,
      detail: w.message + (blocking ? ' — 실패 항목의 선행 원인입니다.' : ''),
      next_action: w.next_action
    }));
  });

  const pEl = $('passed');
  pEl.textContent = '';
  if (!passed.length) {
    pEl.innerHTML = '<p class="empty">통과한 항목이 없습니다.</p>';
  } else {
    passed.forEach(n => {
      const p = document.createElement('span');
      p.className = 'pill good';
      const c = checks[n];
      p.textContent = (c.label || n) + (c.covered != null ? ' ' + c.covered + '/' + c.total : '');
      pEl.append(p);
    });
  }

  $('raw').textContent = JSON.stringify(m, null, 2);
}

function renderError(e) {
  setBadge('dead', '상태 확인 불가');
  $('meta').textContent = e.message + ' · 화면의 값은 갱신되지 않았습니다.';
  $('counts').hidden = true;
  $('integrity').textContent = '';
  $('failed').innerHTML =
    '<p class="empty">상태 파일을 읽지 못했습니다. 네트워크를 확인하거나 프로듀서 실행 결과를 확인하십시오.</p>';
  $('passed').innerHTML = '<p class="empty">–</p>';
  $('raw').textContent = String(e.stack || e.message);
}

async function load() {
  const btn = $('btn');
  btn.disabled = true;
  btn.textContent = '확인 중';
  setBadge('dead', '확인 중');
  try {
    const { json } = await fetchJSON('./status.json');
    render(json);
    await verifyIntegrity(json);
  } catch (e) {
    renderError(e instanceof Error ? e : new Error(String(e)));
  } finally {
    btn.disabled = false;
    btn.textContent = '다시 확인';
  }
}

$('btn').addEventListener('click', () => { load(); });
load();
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible') load();
});
</script>
</body>
</html>
