<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Cache-Control" content="no-store, max-age=0">
<title>JJOONI Control Tower QA</title>
<style>
body{font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;margin:0;background:#08111c;color:#eaf2fb}main{max-width:980px;margin:auto;padding:28px}.card{background:#101c29;border:1px solid #263b52;border-radius:18px;padding:20px;margin:14px 0}.badge{display:inline-block;padding:7px 11px;border-radius:999px;font-weight:800;background:#5a1f2a;color:#ffdbe1}.ok{background:#123d31;color:#b8ffe8}.muted{color:#91a6ba}pre{white-space:pre-wrap;word-break:break-word;background:#07101a;border:1px solid #263b52;border-radius:14px;padding:16px;overflow:auto}button{border:0;border-radius:10px;padding:10px 14px;font-weight:800;cursor:pointer}</style>
</head>
<body><main>
<h1>JJOONI Control Tower · AI QA</h1>
<p class="muted">Sanitized structural QA only · balances, account numbers, holdings and trades are intentionally omitted.</p>
<div class="card"><span id="badge" class="badge">LOADING</span><p id="meta" class="muted"></p><button onclick="load()">새로고침</button></div>
<div class="card"><h2>Failed checks</h2><pre id="failed">Loading…</pre></div>
<div class="card"><h2>Full sanitized status</h2><pre id="raw">Loading…</pre></div>
<script>
async function load(){
  const r=await fetch('./status.json?t='+Date.now(),{cache:'no-store'});
  const j=await r.json();
  const b=document.getElementById('badge');
  b.textContent=j.overall_status||'UNKNOWN';
  b.className='badge '+((j.overall_status==='PASS')?'ok':'');
  document.getElementById('meta').textContent=`snapshot ${j.snapshot_id||'-'} · ${j.generated_kst||'-'}`;
  document.getElementById('failed').textContent=(j.failed_checks||[]).join('\n')||'NONE';
  document.getElementById('raw').textContent=JSON.stringify(j,null,2);
}
load().catch(e=>{document.getElementById('raw').textContent='LOAD FAILED: '+e;});
</script>
</main></body></html>
