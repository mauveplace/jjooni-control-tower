<!doctype html>
<html lang="ko">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Control Tower · 모바일 화면 확인</title>
<style>
*{box-sizing:border-box}body{margin:0;padding:16px;background:#e8edf3;color:#10233d;font:16px/1.5 system-ui}main{width:max-content;max-width:100%;margin:auto}h1{font-size:18px;margin:0 0 10px}label{display:block;margin-bottom:12px}select{font:inherit;padding:6px}iframe{display:block;width:390px;max-width:100%;height:844px;border:1px solid #b3c1d1;border-radius:12px;background:white}
</style>
<main>
<h1>모바일 화면 확인</h1>
<label>화면 너비 <select id="width"><option value="360">360px</option><option value="390" selected>390px</option><option value="412">412px</option></select></label>
<label>화면 높이 <select id="height"><option value="844" selected>844px</option><option value="760">760px</option><option value="700">700px</option></select></label>
<iframe title="Control Tower 모바일 화면" src="../index.html"></iframe>
</main>
<script>
document.querySelector('#width').addEventListener('change',e=>{document.querySelector('iframe').style.width=e.target.value+'px'});
document.querySelector('#height').addEventListener('change',e=>{document.querySelector('iframe').style.height=e.target.value+'px'});
</script>
</html>
