<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>JJOONI Investment Control Tower</title>
<style>
:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#08111c;color:#eaf2fb;min-height:100vh;display:grid;place-items:center}.box{width:min(92vw,430px);padding:30px;border:1px solid #263b52;border-radius:22px;background:linear-gradient(145deg,#111d2a,#0b1520);box-shadow:0 22px 70px #0008}.eyebrow{font-size:12px;letter-spacing:.16em;color:#7390ac;font-weight:800}.title{font-size:28px;line-height:1.14;font-weight:900;margin:10px 0 8px}.sub{font-size:13px;line-height:1.55;color:#91a6ba;margin-bottom:22px}.row{display:flex;gap:8px}input{min-width:0;flex:1;background:#07101a;color:#fff;border:1px solid #30465c;border-radius:12px;padding:14px;font-size:16px;outline:none}input:focus{border-color:#5b9af5}button{border:0;border-radius:12px;padding:0 18px;background:#2167d5;color:#fff;font-weight:850;cursor:pointer}.msg{min-height:22px;margin-top:12px;font-size:12px;color:#8ca1b5}.bad{color:#ff7186}.good{color:#56deb2}.foot{margin-top:22px;padding-top:15px;border-top:1px solid #1d2e40;font-size:11px;color:#61778d;line-height:1.5}
</style>
</head>
<body>
<main class="box">
<div class="eyebrow">PRIVATE VIEW · READ ONLY</div>
<div class="title">JJOONI Investment<br>Control Tower</div>
<div class="sub">Control Tower 전용 비밀번호를 입력하면 브라우저 안에서만 복호화합니다. 비밀번호는 서버로 전송되지 않습니다.</div>
<div class="row"><input id="pw" type="password" autocomplete="current-password" placeholder="Control Tower 비밀번호"><button id="go">OPEN</button></div>
<div id="msg" class="msg"></div>
<div class="foot">Encrypted static shell · AES-256-GCM · PBKDF2-SHA256<br>브라우저 탭을 닫으면 세션 비밀번호도 제거됩니다.</div>
</main>
<script>
const $=id=>document.getElementById(id);
const b64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function openTower(pw){
  const msg=$('msg'); msg.className='msg'; msg.textContent='암호화된 Control Tower를 여는 중…';
  try{
    const p=await fetch('payload.json',{cache:'no-store'}).then(r=>{if(!r.ok)throw Error('payload');return r.json()});
    const raw=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);
    const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:b64(p.salt),iterations:p.iterations,hash:'SHA-256'},raw,{name:'AES-GCM',length:256},false,['decrypt']);
    const plain=await crypto.subtle.decrypt({name:'AES-GCM',iv:b64(p.nonce),additionalData:b64(p.aad),tagLength:128},key,b64(p.ciphertext));
    sessionStorage.setItem('jjooni_ct_session_pw',pw);
    document.open(); document.write(new TextDecoder().decode(plain)); document.close();
  }catch(e){
    sessionStorage.removeItem('jjooni_ct_session_pw'); msg.className='msg bad'; msg.textContent='비밀번호가 맞지 않거나 데이터가 손상되었습니다.';
  }
}
$('go').onclick=()=>openTower($('pw').value);
$('pw').addEventListener('keydown',e=>{if(e.key==='Enter')openTower(e.target.value)});
const saved=sessionStorage.getItem('jjooni_ct_session_pw'); if(saved){$('pw').value=saved;openTower(saved)}
</script>
</body>
</html>
