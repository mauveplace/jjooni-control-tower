<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>JJOONI Investment Control Tower</title>
<style>
:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#08111c;color:#eaf2fb;min-height:100vh;display:grid;place-items:center}.box{width:min(92vw,430px);padding:30px;border:1px solid #263b52;border-radius:22px;background:linear-gradient(145deg,#111d2a,#0b1520);box-shadow:0 22px 70px #0008}.eyebrow{font-size:14px;letter-spacing:.16em;color:#7390ac;font-weight:800}.title{font-size:28px;line-height:1.14;font-weight:900;margin:10px 0 8px}.sub{font-size:16px;line-height:1.55;color:#91a6ba;margin-bottom:22px}.row{display:flex;gap:8px}.remember{display:flex;align-items:center;gap:8px;margin-top:12px;color:#91a6ba;font-size:14px;user-select:none}.remember input{width:16px;height:16px;min-width:16px;flex:none;accent-color:#2167d5}.sr-user{position:absolute!important;left:-10000px!important;width:1px!important;height:1px!important;opacity:0!important}input[type=password]{min-width:0;flex:1;background:#07101a;color:#fff;border:1px solid #30465c;border-radius:12px;padding:14px;font-size:16px;outline:none}input[type=password]:focus{border-color:#5b9af5}button{font-size:16px;min-height:44px;border:0;border-radius:12px;padding:0 18px;background:#2167d5;color:#fff;font-weight:850;cursor:pointer}.msg{min-height:22px;margin-top:12px;font-size:14px;color:#8ca1b5}.bad{color:#ff7186}.good{color:#56deb2}.foot{margin-top:22px;padding-top:15px;border-top:1px solid #1d2e40;font-size:14px;color:#9db1c8;line-height:1.5}
</style>
</head>
<body>
<main class="box">
<div class="eyebrow">PRIVATE VIEW · READ ONLY</div>
<div class="title">JJOONI Investment<br>Control Tower</div>
<div class="sub">Control Tower 전용 비밀번호를 입력하면 브라우저 안에서만 복호화합니다. 비밀번호는 서버로 전송되지 않습니다.</div>
<form id="loginForm" autocomplete="on">
<input class="sr-user" id="ctUser" name="username" type="text" value="jjooni-control-tower" autocomplete="username" tabindex="-1" aria-hidden="true">
<div class="row"><input id="pw" name="password" type="password" autocomplete="current-password" enterkeyhint="go" placeholder="Control Tower 비밀번호"><button id="go" type="submit">OPEN</button></div>
<label class="remember"><input id="rememberDevice" type="checkbox"> 이 기기에서 자동입력 사용 (Google/삼성 비밀번호 관리자)</label>
</form>
<div id="msg" class="msg"></div>
<div class="foot">Encrypted static shell · AES-256-GCM · PBKDF2-SHA256<br>브라우저 탭을 닫으면 세션 비밀번호도 제거됩니다.</div>
</main>
<script>
const $=id=>document.getElementById(id);
const b64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
const CT_PORTRAIT_HOTFIX=`<link id="ctResponsiveLayout" rel="stylesheet" href="responsive-layout.css?v=1.1">`;
const CT_POSTFIX=`<script src="canonical-metrics.js?v=33.7"><\/script><script id="ct-static-status-compact">(function(){function compact(){var e=document.querySelector('.live');if(!e)return;var t=(e.textContent||'').trim();if(/STALE/i.test(t)&&t!=='● STALE'){e.title=t;e.textContent='● STALE';}}compact();try{new MutationObserver(compact).observe(document.documentElement,{subtree:true,childList:true,characterData:true});}catch(e){}})();<\/script><script src="trade-review-loader.js?v=14.48"><\/script>`;
async function openTower(pw){
  const msg=$('msg'); msg.className='msg'; msg.textContent='암호화된 Control Tower를 여는 중…';
  try{
    const p=await fetch('payload.json',{cache:'no-store'}).then(r=>{if(!r.ok)throw Error('payload');return r.json()});
    const raw=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);
    const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:b64(p.salt),iterations:p.iterations,hash:'SHA-256'},raw,{name:'AES-GCM',length:256},false,['decrypt']);
    const plain=await crypto.subtle.decrypt({name:'AES-GCM',iv:b64(p.nonce),additionalData:b64(p.aad),tagLength:128},key,b64(p.ciphertext));
    sessionStorage.setItem('jjooni_ct_session_pw',pw);
    if($('rememberDevice')&&$('rememberDevice').checked){
      localStorage.setItem('jjooni_ct_device_autofill','1');
      try{
        if(window.PasswordCredential&&navigator.credentials&&navigator.credentials.store){
          navigator.credentials.store(new PasswordCredential({id:'jjooni-control-tower',password:pw,name:'JJOONI Control Tower'})).catch(()=>{});
        }
      }catch(_e){}
    }
    let html=new TextDecoder().decode(plain);
    html=html.replace('</head>',CT_PORTRAIT_HOTFIX+'</head>');
    html=html.replace('</body>',CT_POSTFIX+'</body>');
    const CT_LIVE_BOOT=`<script>(function(){
      var b=document.createElement('div');
      b.id='ctEncryptedLiveBadge';
      b.style.cssText='position:fixed;right:12px;bottom:72px;z-index:10001;padding:6px 9px;border-radius:999px;background:#fff7ed;border:1px solid #fed7aa;color:#b45309;font:800 10px/1.2 system-ui,-apple-system,sans-serif;box-shadow:0 4px 14px #0002';
      b.textContent='LINEAGE GUARD LOADING';document.body.appendChild(b);
      function blocked(msg){window.__LINEAGE_GUARD_ACTIVE=false;b.textContent='SSOT BLOCKED · '+msg;b.style.background='#fff1f2';b.style.borderColor='#fecdd3';b.style.color='#be123c';b.title='안전한 데이터 계보 보호기가 활성화되지 않아 live 숫자 갱신을 차단했습니다.';}
      function loadLive(){var s=document.createElement('script');s.src='live-bridge.js?v=4&_='+Date.now();s.async=false;s.onerror=function(){blocked('FEED LOAD FAIL')};s.onload=function(){setTimeout(function(){if(window.__LINEAGE_GUARD_ACTIVE!==true)blocked('GUARD LOST')},1500)};(document.head||document.documentElement).appendChild(s);}
      var g=document.createElement('script');g.src='lineage-guard.js?v=3&_='+Date.now();g.async=false;g.onerror=function(){blocked('GUARD LOAD FAIL')};g.onload=function(){var ok=!!(window.__JJOONI_LINEAGE_GUARD&&window.__JJOONI_LINEAGE_GUARD.policy);window.__LINEAGE_GUARD_ACTIVE=ok;if(!ok){blocked('GUARD INACTIVE');return;}b.textContent='LINEAGE GUARD ACTIVE';loadLive()};(document.head||document.documentElement).appendChild(g);
    }());<\/script>`;
    html=html.replace('</body>',CT_LIVE_BOOT+'</body>');document.open();document.write(html);document.close();
  }catch(e){
    sessionStorage.removeItem('jjooni_ct_session_pw'); msg.className='msg bad'; msg.textContent='비밀번호가 맞지 않거나 데이터가 손상되었습니다.';
  }
}
$('loginForm').addEventListener('submit',e=>{e.preventDefault();openTower($('pw').value)});
async function tryDeviceAutofill(){
  if(localStorage.getItem('jjooni_ct_device_autofill')!=='1')return;
  if($('rememberDevice'))$('rememberDevice').checked=true;
  try{
    if(navigator.credentials&&navigator.credentials.get){
      const cred=await navigator.credentials.get({password:true,mediation:'optional'});
      if(cred&&cred.password){$('pw').value=cred.password;openTower(cred.password);return;}
    }
  }catch(_e){}
  try{$('pw').focus()}catch(_e){}
}
const saved=sessionStorage.getItem('jjooni_ct_session_pw');
if(saved){$('pw').value=saved;if($('rememberDevice'))$('rememberDevice').checked=localStorage.getItem('jjooni_ct_device_autofill')==='1';openTower(saved)}
else{tryDeviceAutofill()}
</script>
</body>
</html>
