name: One-shot canonical cache bust
on:
  push:
    branches: [main]
    paths: ['.github/workflows/cache-bust-canonical-v1.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: Bump canonical metrics cache key exactly once
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          old='canonical-metrics.js?v=33.0'
          new='canonical-metrics.js?v=33.1'
          if new in s:
              print('CACHE_KEY_ALREADY_CURRENT=PASS')
          else:
              if s.count(old)!=1:
                  raise SystemExit(f'CACHE_BUST_REFUSE_COUNT={s.count(old)}')
              p.write_text(s.replace(old,new,1),encoding='utf-8')
              print('CACHE_BUST_PATCH=PASS')
          PY
      - name: Commit cache key only
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          if git diff --cached --quiet; then
            echo NO_CHANGES
            exit 0
          fi
          git commit -m 'fix: force fresh stable market/TRI-POD boot assets'
          git push
