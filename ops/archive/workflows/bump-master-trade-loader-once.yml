name: Patch Actual Freshness Classification Once

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/bump-master-trade-loader-once.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Make actual live timestamp authoritative for freshness UI
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          p=Path('human-ui-v6.js')
          s=p.read_text(encoding='utf-8')
          s=s.replace("version:'6.2'","version:'6.3'",1)

          old="function nextTime(){const L=live();return L.next_expected_update_kst||''}\nfunction freshnessState(){const L=live(),f=window.JjooniMetrics.freshness(L);if(L.schedule_contract_state==='MISMATCH')return {...f,kind:'warn',text:'수집 일정 확인 필요'};return f;}"
          new="\n".join([
            "function nextTime(){const L=live();return L.next_expected_update_kst||''}",
            "const ACTUAL_FRESH_MS=20*60*1000;",
            "function actualObservedTime(){const L=live();return L.observed_at||L.generated_kst||L.source_snapshot_kst||canon().observed_at||''}",
            "function actualObservedAgeMs(){const ms=parseKstMs(actualObservedTime());return ms==null?null:Math.max(0,Date.now()-ms)}",
            "function accessRefreshState(){return String(window.__JJOONI_FAST_ACCESS_REFRESH_V1?.state||'')}",
            "function freshnessState(){",
            " const L=live(),f=window.JjooniMetrics.freshness(L),age=actualObservedAgeMs(),access=accessRefreshState();",
            " if(age!=null&&age<=ACTUAL_FRESH_MS)return {...f,kind:'good',text:'최신',actual_age_ms:age,authority:'ACTUAL_OBSERVED_AT'};",
            " if(access==='REFRESHING')return {...f,kind:'refreshing',text:'최신 시세 반영 중',actual_age_ms:age,authority:'ACCESS_REFRESH'};",
            " if(L.schedule_contract_state==='MISMATCH')return {...f,kind:'warn',text:'수집 일정 확인 필요',actual_age_ms:age,authority:'SCHEDULE_DIAGNOSTIC'};",
            " return {...f,actual_age_ms:age,authority:'METRICS_FALLBACK'};",
            "}",
          ])
          if old not in s:
              raise SystemExit('FRESHNESS_STATE_TARGET_MISSING')
          s=s.replace(old,new,1)

          old2="function humanProducerText(){\n const basis=stamp(basisTime()),next=nextTime()?stamp(nextTime()):'',st=freshnessState();\n if(st.kind==='warn')return `${st.text} · 기준 ${basis}`;\n if(st.kind==='closed')return `● ${st.text} · 기준 ${basis}${next?' · 다음 '+next:''}`;\n return `● 최신 · 기준 ${basis}${next?' · 다음 '+next:''}`;\n}"
          new2="\n".join([
            "function humanProducerText(){",
            " const basis=stamp(actualObservedTime()||basisTime()),next=nextTime()?stamp(nextTime()):'',st=freshnessState();",
            " if(st.kind==='refreshing')return `↻ 최신 시세 반영 중 · 기준 ${basis}`;",
            " if(st.kind==='warn')return `${st.text} · 기준 ${basis}`;",
            " if(st.kind==='closed')return `● ${st.text} · 기준 ${basis}${next?' · 다음 '+next:''}`;",
            " return `● 최신 · 기준 ${basis}${next?' · 다음 '+next:''}`;",
            "}",
            "function updateGlobalFreshnessBar(){",
            " const bar=qs('#globalFreshnessBar');if(!bar)return;",
            " const st=freshnessState(),basis=stamp(actualObservedTime()||basisTime()),label=qs('.gf-label',bar),base=qs('.gf-base',bar),alert=qs('.gf-alert',bar);",
            " bar.dataset.ctFreshnessAuthority=String(st.authority||'');bar.dataset.ctActualAgeMs=st.actual_age_ms==null?'':String(Math.round(st.actual_age_ms));",
            " if(st.kind==='good'){",
            "  bar.classList.remove('gf-stale','gf-refreshing');bar.classList.add('gf-fresh');",
            "  if(label)label.textContent='최신';if(base)base.textContent='기준 '+basis;if(alert)alert.classList.remove('gf-alert-show');",
            "  bar.style.setProperty('display','none','important');",
            "  return;",
            " }",
            " bar.style.removeProperty('display');",
            " if(st.kind==='refreshing'){
              bar.classList.remove('gf-stale','gf-fresh');bar.classList.add('gf-refreshing');
              if(label)label.textContent='최신 시세 반영 중';if(base)base.textContent='기준 '+basis;
              if(alert){alert.textContent='마지막 검증값을 표시하면서 최신 시세를 반영 중입니다.';alert.classList.add('gf-alert-show')}
              bar.style.borderColor='#93c5fd';bar.style.background='#eff6ff';bar.style.color='#1d4ed8';
              return;
            }",
            " bar.classList.remove('gf-fresh','gf-refreshing');bar.classList.add('gf-stale');",
            " if(label)label.textContent=st.text||'수집 지연';if(base)base.textContent='기준 '+basis;",
            " if(alert){alert.textContent='⚠ 현재 시세 업데이트 지연 · 마지막 수집 '+basis.replace(' ','/')+' · 새 값 수집을 확인 중입니다.';alert.classList.add('gf-alert-show')}",
            " bar.style.removeProperty('border-color');bar.style.removeProperty('background');bar.style.removeProperty('color');",
            "}",
          ])
          if old2 not in s:
              raise SystemExit('PRODUCER_TEXT_TARGET_MISSING')
          s=s.replace(old2,new2,1)

          old3="ensureStyle();updateAccountCards();updateTrust();updateProducerBadge();updateHeroCompletion();scrubKnownCodes();"
          new3="ensureStyle();updateAccountCards();updateTrust();updateProducerBadge();updateGlobalFreshnessBar();updateHeroCompletion();scrubKnownCodes();"
          if old3 not in s:
              raise SystemExit('APPLY_TARGET_MISSING')
          s=s.replace(old3,new3,1)
          s=s.replace("state:'ACTIVE',version:'6.2'","state:'ACTIVE',version:'6.3'",1)
          p.write_text(s,encoding='utf-8')

          q=Path('trade-review-loader.js')
          t=q.read_text(encoding='utf-8')
          t=t.replace("version:'14.22'","version:'14.23'",1)
          t=t.replace("human-ui-v6.js?v=6.2","human-ui-v6.js?v=6.3",1)
          q.write_text(t,encoding='utf-8')

          r=Path('index.html')
          u=r.read_text(encoding='utf-8')
          u=u.replace('trade-review-loader.js?v=14.22','trade-review-loader.js?v=14.23')
          r.write_text(u,encoding='utf-8')
          print('CT_ACTUAL_FRESHNESS_UI_PATCH=PASS')
          PY
          node --check human-ui-v6.js
          node --check trade-review-loader.js
          grep -q "ACTUAL_OBSERVED_AT" human-ui-v6.js
          grep -q "updateGlobalFreshnessBar" human-ui-v6.js
          grep -q "human-ui-v6.js?v=6.3" trade-review-loader.js
          if git diff --quiet -- human-ui-v6.js trade-review-loader.js index.html; then
            echo 'CT_ACTUAL_FRESHNESS_UI_PATCH=NO_CHANGE'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add human-ui-v6.js trade-review-loader.js index.html
          git commit -m 'fix(ct-ui): classify freshness from actual observed time'
          git push origin HEAD:main