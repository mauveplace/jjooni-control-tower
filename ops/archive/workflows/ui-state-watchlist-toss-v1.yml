name: UI State + Watchlist + Toss V1

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/ui-state-watchlist-toss-v1.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Correct Toss canonical and merge loops
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          p=Path('live-bridge.js')
          s=p.read_text(encoding='utf-8')

          # makeCanonical: Toss has a dedicated object and must NOT be overwritten
          # by the generic KB account loop.
          a=s.find('function makeCanonical(live){')
          b=s.find('\nfunction mergePositions(live){',a)
          if a < 0 or b < 0:
              raise SystemExit('MAKE_CANONICAL_BLOCK_NOT_FOUND')
          block=s[a:b]
          bad="['TOSS','ISA','PENSION','IRP'].forEach(id=>"
          good="['ISA','PENSION','IRP'].forEach(id=>"
          if bad in block:
              block=block.replace(bad,good,1)
          elif good not in block:
              raise SystemExit('MAKE_CANONICAL_LOOP_NOT_FOUND')
          s=s[:a]+block+s[b:]

          # mergePositions: live Toss holdings should update the shared human
          # positions surface alongside ISA/PENSION/IRP.
          a=s.find('function mergePositions(live){')
          b=s.find('\nfunction mergeTrades(live){',a)
          if a < 0 or b < 0:
              raise SystemExit('MERGE_POSITIONS_BLOCK_NOT_FOUND')
          block=s[a:b]
          old="['ISA','PENSION','IRP'].forEach(id=>"
          new="['TOSS','ISA','PENSION','IRP'].forEach(id=>"
          if old in block:
              block=block.replace(old,new,1)
          elif new not in block:
              raise SystemExit('MERGE_POSITIONS_LOOP_NOT_FOUND')
          s=s[:a]+block+s[b:]

          if 'CT_UI_STATE_WATCHLIST_V1' not in s:
              raise SystemExit('UI_STATE_PATCH_MISSING')

          p.write_text(s,encoding='utf-8')
          print('CORRECTION_OK')
          PY

      - name: Commit correction
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add live-bridge.js
          if git diff --cached --quiet; then
            echo NO_CHANGES
            exit 0
          fi
          git commit -m 'Correct Toss canonical and live position merge'
          git push
