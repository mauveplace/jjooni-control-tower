name: Tablet Stability Font Floor V41

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/tablet-stability-hotfix-v37.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: tablet-stability-font-floor-v41
  cancel-in-progress: true

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Apply tablet font floor patch
        run: python scripts/apply_tablet_font_floor_v41.py

      - name: Validate production code
        run: |
          node --check tablet-stability-v37.js
          node --test tests/*.test.cjs
          python -c "from pathlib import Path; t=Path('tablet-stability-v37.js').read_text(); assert \"version:'37.4'\" in t; assert 'CONTENT_FONT_FLOOR_PX=16' in t; assert 'enforceContentFontFloor' in t; assert 'ctTabletFontFloorObserverV41' in t; print('V41_ACCEPTANCE=PASS')"
          git diff --check -- tablet-stability-v37.js

      - name: Commit production typography guard
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tablet-stability-v37.js
          git diff --cached --check
          git commit -m 'fix: enforce 16px minimum tablet auxiliary typography'
          git push
