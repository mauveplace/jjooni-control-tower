name: hotfix-performance-position-reconcile-20260907

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/hotfix-performance-position-reconcile-20260907.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch live bridge
        shell: bash
        env:
          POSITION_PATCH_B64: 
          PERFORMANCE_PATCH_B64: I 
        run: |
          python - <<'PY'
          import base64, os
          from pathlib import Path

          p = Path('live-bridge.js')
          s = p.read_text(encoding='utf-8')

          start = s.index('function mergePositions(live){')
          mid = s.index(' const ai=a.AI||{};', start)
          replacement = base64.b64decode(os.environ['POSITION_PATCH_B64']).decode('utf-8')
          s = s[:start] + replacement + s[mid:]

          marker = '});D.human.performance=arr;\n}'
          if marker not in s:
              raise SystemExit('PERFORMANCE_MARKER_NOT_FOUND')
          perf = base64.b64decode(os.environ['PERFORMANCE_PATCH_B64'].replace(' ', '')).decode('utf-8')
          s = s.replace(marker, perf, 1)

          p.write_text(s, encoding='utf-8')
          PY

      - name: Syntax and contract checks
        shell: bash
        run: |
          node --check live-bridge.js
          grep -q "account:'TOTAL'" live-bridge.js
          grep -q "acct!==id||rt!=='POSITION'" live-bridge.js
          git diff --check

      - name: Commit hotfix
        shell: bash
        run: |
          if git diff --quiet -- live-bridge.js; then
            echo 'NO_CHANGE=true'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add live-bridge.js
          git commit -m 'fix: reconcile sold positions and live performance rows'
          git push
