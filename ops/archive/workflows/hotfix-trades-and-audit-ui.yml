name: Hotfix Trades and Audit UI

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/hotfix-trades-and-audit-ui.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Patch mobile nav and validation labels
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import base64

          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          s=s.replace('grid-template-columns:repeat(5,minmax(0,1fr))','grid-template-columns:repeat(6,minmax(0,1fr))')
          needle='html.ctTouchTablet .tab[data-tab="overview"],html.ctTouchTablet .tab[data-tab="accounts"]'
          add='html.ctTouchTablet .tab[data-tab="trades"],.tab[data-tab="trades"],'+needle
          if needle in s and add not in s:
              s=s.replace(needle,add,1)
          p.write_text(s,encoding='utf-8')

          p=Path('live-bridge.js')
          s=p.read_text(encoding='utf-8')
          marker='CT_VALIDATION_UI_HOTFIX_V1'
          patch=base64.b64decode('').decode('utf-8')
          if marker not in s:
              s += '\n'+patch
          p.write_text(s,encoding='utf-8')
          PY

      - name: Commit hotfix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html live-bridge.js
          if git diff --cached --quiet; then
            echo 'NO_CHANGES'
            exit 0
          fi
          git commit -m 'Restore trades tab and correct validation semantics'
          git push
